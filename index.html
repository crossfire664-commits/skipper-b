20y%3D'788'%20font-size%3D'13'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3Erechts%20oben%20an%20der%20Saling%20(Querstange%20am%20Mast%2C%3C%2Ftext%3E%3Ctext%20x%3D'650'%20y%3D'805'%20font-size%3D'13'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3ESteuerbordseite).%20Nur%20bei%20ausl%C3%A4ndischen%20Booten.%3C%2Ftext%3E%3Cline%20x1%3D'85'%20y1%3D'870'%20x2%3D'40'%20y2%3D'800'%20stroke%3D'%23d62828'%20stroke-width%3D'2.5'%2F%3E%3Ccircle%20cx%3D'40'%20cy%3D'800'%20r%3D'4'%20fill%3D'%23d62828'%2F%3E%3Ctext%20x%3D'40'%20y%3D'750'%20font-size%3D'15'%20fill%3D'%230b2545'%20text-anchor%3D'start'%20font-weight%3D'bold'%3ENationalflagge%3C%2Ftext%3E%3Ctext%20x%3D'40'%20y%3D'767'%20font-size%3D'13'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3Ehinten%20am%20Heck%20(Flaggenstock)%2C%3C%2Ftext%3E%3Ctext%20x%3D'40'%20y%3D'783'%20font-size%3D'13'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3Ez.%20B.%20%C3%B6sterreichisches%20Boot%3C%2Ftext%3E%3Ctext%20x%3D'650'%20y%3D'860'%20font-size%3D'13'%20fill%3D'%230b2545'%20text-anchor%3D'start'%20font-weight%3D'bold'%3E%F0%9F%92%A1%20Charterboote%20in%20Kroatien%20sind%20kroatisch%20registriert%3A%3C%2Ftext%3E%3Ctext%20x%3D'650'%20y%3D'878'%20font-size%3D'13'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3Ehinten%20die%20kroatische%20Flagge%2C%20keine%20Gastlandflagge%20n%C3%B6tig.%3C%2Ftext%3E%3Ctext%20x%3D'650'%20y%3D'902'%20font-size%3D'13'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3EDie%20Flaggen%20liegen%20meist%20in%20einer%20Schublade%20am%3C%2Ftext%3E%3Ctext%20x%3D'650'%20y%3D'920'%20font-size%3D'13'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3ENavigationstisch%20oder%20in%20der%20Backskiste.%3C%2Ftext%3E%3Ctext%20x%3D'560'%20y%3D'985'%20font-size%3D'15'%20fill%3D'%23d62828'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3ETipp%3A%20Flagge%20A%20und%20N%20%C3%BCber%20C%20sind%20Pr%C3%BCfungsklassiker!%3C%2Ftext%3E%3C%2Fsvg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<div class=\"co co-tip\"><div class=\"co-t\">Praxis-Tipp für Neulinge<\/div><ul>\n<li>Die Flaggen liegen an Bord meist in einer Schublade am <strong>Navigationstisch<\/strong> oder in der <strong>Backskiste<\/strong>.<\/li>\n<li>Ein Charterboot in Kroatien ist kroatisch registriert: Hinten am Heck hängt die kroatische Flagge, eine Gastlandflagge brauchst du nicht.<\/li>\n<li>Die <strong>Flagge A<\/strong> siehst du in Kroatien oft an Tauchbooten vor beliebten Buchten. Dann langsam und mit viel Abstand vorbeifahren.<\/li>\n<\/ul><\/div>\n\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Flagge<\/th>\n<th>Aussehen<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Nationalflagge<\/strong><\/td>\n<td>Landesflagge<\/td>\n<td>Zeigt, in welchem Land das Boot registriert ist. Sie hängt <strong>hinten (am Heck)<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Gastlandflagge<\/strong><\/td>\n<td>Flagge des besuchten Landes, kleiner<\/td>\n<td>Ein ausländisches Boot zeigt damit Respekt vor dem Gastland. Sie hängt <strong>rechts oben (Steuerbord-Saling)<\/strong>. Ein in Kroatien registriertes Charterboot braucht keine<\/td>\n<\/tr>\n<tr>\n<td><strong>Flagge Q<\/strong><\/td>\n<td>ganz gelb<\/td>\n<td>„Ich komme aus dem Ausland und bitte um Einklarierung“ (Zoll, Grenzpolizei)<\/td>\n<\/tr>\n<tr>\n<td><strong>Flagge A<\/strong><\/td>\n<td>weiß-blau mit Schwalbenschwanz<\/td>\n<td><strong>„Taucher unten – Abstand halten, langsam fahren“<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>N über C<\/strong><\/td>\n<td>2 Flaggen übereinander<\/td>\n<td><strong>Seenotsignal<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Gesundheit an Bord<\/h2>\n<p><strong>Seekrankheit<\/strong> (Übelkeit durch das Schaukeln):<\/p>\n<ul>\n<li>An Deck bleiben, frische Luft, <strong>auf den Horizont schauen<\/strong><\/li>\n<li>Selbst <strong>steuern<\/strong> hilft, weil das Gehirn die Bewegung dann vorhersieht<\/li>\n<li>Nicht unter Deck lesen, kleine leichte Mahlzeiten<\/li>\n<li>Seekranke Personen nie allein an die Reling lassen: <strong>Absturzgefahr<\/strong>, im Zweifel sichern<\/li>\n<\/ul>\n<p><strong>Unterkühlung<\/strong> (jemand war länger im Wasser):<\/p>\n<ul>\n<li>Aus dem Wasser holen, möglichst <strong>waagrecht<\/strong> liegend<\/li>\n<li>Nasse Kleidung aus, in Decken einpacken, <strong>langsam<\/strong> aufwärmen<\/li>\n<li><strong>Nicht<\/strong> abrubbeln, keinen Alkohol geben<\/li>\n<li>Bei Bewusstlosigkeit oder Verwirrtheit: Notruf (<strong>195<\/strong> / Kanal 16)<\/li>\n<\/ul>\n<p><strong>Sonne und Hitze:<\/strong> Auf dem Wasser reflektiert die Sonne, deshalb Sonnenbrand und Sonnenstich besonders schnell. Kopfbedeckung, Sonnencreme und viel trinken.<\/p>\n<p><strong>Alkohol:<\/strong> Wer das Boot führt, bleibt nüchtern, wie beim Autofahren.<\/p>\n<h2>Umweltschutz<\/h2>\n<ul>\n<li><strong>Kein Müll<\/strong> ins Meer, auch keine Zigarettenstummel<\/li>\n<li><strong>Kein Öl und kein Kraftstoff<\/strong> ins Wasser. Beim Tanken nichts überlaufen lassen<\/li>\n<li>Die <strong>Toilette (Fäkalientank)<\/strong> nur an der Absauganlage im Hafen leeren, nie in Buchten oder Häfen<\/li>\n<li>Nicht auf <strong>Seegras<\/strong> ankern. Das ist geschützt und hält den Anker schlecht<\/li>\n<\/ul>\n<h2>Ebbe und Flut in der Adria<\/h2>\n<p>Der Wasserstand schwankt in der Adria nur wenig (meist deutlich unter 1 m, im Norden etwas mehr). Darum sind die Tiefen in der Seekarte dort ziemlich verlässlich. Leinen im Hafen trotzdem nicht ganz straff spannen.<\/p>\n<h2>Checkliste: Charterboot übernehmen (Check-in)<\/h2>\n<ol>\n<li>Papiere zeigen: <strong>Skipper-B-Schein<\/strong>, Ausweis, Crewliste<\/li>\n<li><strong>Sicherheitsausrüstung<\/strong> durchgehen (Tabelle oben): Wo liegt was?<\/li>\n<li><strong>Motor:<\/strong> Ölstand, Kühlwasser, Kraftstoff, Batterie (siehe <a href=\"#\" data-ch=\"09\">Motor &amp; Technik<\/a>)<\/li>\n<li><strong>Funkgerät<\/strong> testen, Kanal 16<\/li>\n<li><strong>Schäden am Boot fotografieren<\/strong>, bevor du losfährst (Rumpf, Polster, Beiboot)<\/li>\n<li>Wetterbericht für die nächsten Tage checken (siehe <a href=\"#\" data-ch=\"07\">Wetter Adria<\/a>)<\/li>\n<li>Crew einweisen: Wo sind die Westen? Was tun bei Mann über Bord? Wie geht das Funkgerät?<\/li>\n<\/ol>\n<h2>Der Prüfungstag<\/h2>\n<ul>\n<li><strong>Mitnehmen:<\/strong> Ausweis/Pass, Zahlungsbeleg der Gebühr, Passfotos (falls noch nicht abgegeben), <strong>Brille<\/strong> (für die Seekarte!), Kugelschreiber<\/li>\n<li><strong>Seil<\/strong> mitnehmen? Frag die Schule. Meist liegt eines bereit<\/li>\n<li><strong>Wie antworten:<\/strong> kurz, mit dem Fachwort <strong>und<\/strong> einem Satz Erklärung. Beispiel: „Das ist eine Nord-Kardinaltonne. Ich fahre nördlich daran vorbei, weil dort das sichere Wasser ist.“<\/li>\n<li><strong>Unsicher?<\/strong> Lieber nachfragen („Meinen Sie bei Tag oder bei Nacht?“) als raten<\/li>\n<li>Die Prüfer fragen gern <strong>Situationen<\/strong>: „Du siehst …, was machst du?“ Antworte immer mit dem, <strong>was du tust<\/strong><\/li>\n<li><strong>Ruhig bleiben:<\/strong> Es gibt keine Noten, nur bestanden oder nicht bestanden<\/li>\n<\/ul>"},{"n":"13","t":"Manöver","h":"<div class=\"co co-abstract\"><div class=\"co-t\">Worum geht&#x27;s überhaupt? (Erklärung für Einsteiger)<\/div><p>Ein <strong>Manöver<\/strong> ist jede geplante Bewegung mit dem Boot: in den Hafen einparken (Anlegen), wegfahren (Ablegen), ankern, wenden.\nEin Boot hat <strong>keine Bremse<\/strong> und reagiert verzögert auf Wind und Ruder. Deshalb gilt: <strong>langsam, vorausschauend, gegen den Wind<\/strong>. In der mündlichen Prüfung wird gern gefragt: „Wie legst du an?“ oder „Wie ankerst du?“<\/p>\n<p>Unbekannte Wörter? → 00a Bootssprache – Grundbegriffe<\/p><\/div>\n\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg%2 text-anchor%3D'middle'%20font-weight%3D'bold'%3E4%3C%2Ftext%3E%3Ctext%20x%3D'832'%20y%3D'755'%20font-size%3D'12'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3EKette%203%E2%80%935%20%C3%97%20Wassertiefe%20stecken%3C%2Ftext%3E%3Ctext%20x%3D'832'%20y%3D'770'%20font-size%3D'12'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E(5%20m%20tief%20%E2%86%92%2015%E2%80%9325%20m%20Kette)%3C%2Ftext%3E%3Ccircle%20cx%3D'815'%20cy%3D'800'%20r%3D'10'%20fill%3D'%230b2545'%2F%3E%3Ctext%20x%3D'815'%20y%3D'805'%20font-size%3D'12'%20fill%3D'%23ffffff'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3E5%3C%2Ftext%3E%3Ctext%20x%3D'832'%20y%3D'805'%20font-size%3D'12'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3ER%C3%BCckw%C3%A4rts%20eingraben%2C%3C%2Ftext%3E%3Ctext%20x%3D'832'%20y%3D'820'%20font-size%3D'12'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3EAnkerball%20ins%20Vorstag%3C%2Ftext%3E%3Ctext%20x%3D'832'%20y%3D'870'%20font-size%3D'12'%20fill%3D'%23d62828'%20text-anchor%3D'start'%20font-weight%3D'bold'%3EPr%C3%BCfen%3A%202%20Landmarken%20peilen.%3C%2Ftext%3E%3Ctext%20x%3D'832'%20y%3D'886'%20font-size%3D'12'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3EWandern%20sie%20aus%2C%20slipt%20der%3C%2Ftext%3E%3Ctext%20x%3D'832'%20y%3D'902'%20font-size%3D'12'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3EAnker%20(rutscht%20%C3%BCber%20den%20Grund).%3C%2Ftext%3E%3C%2Fsvg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<h2>Die 5 Grundregeln für jedes Manöver<\/h2>\n<ol>\n<li><strong>So langsam wie möglich, so schnell wie nötig.<\/strong> Wenig Gas, aber genug, damit das Boot noch steuert<\/li>\n<li><strong>Möglichst gegen den Wind<\/strong> (oder gegen die Strömung) anfahren. Dann bremst der Wind das Boot, und du hast mehr Kontrolle<\/li>\n<li><strong>Vorher planen und die Crew einweisen:<\/strong> Wer hält welche Leine, wo kommen die Fender hin?<\/li>\n<li><strong>Fender raus und Leinen klar legen<\/strong>, bevor du in den Hafen fährst<\/li>\n<li><strong>Abbrechen ist erlaubt.<\/strong> Klappt es nicht, wieder raus und neu anfahren. Das ist gute Seemannschaft, keine Schande<\/li>\n<\/ol>\n<h2>Radeffekt – warum das Boot rückwärts „schief“ fährt<\/h2>\n<ul>\n<li>Die Schraube dreht sich und schiebt das Heck dabei etwas zur Seite. <strong>Rückwärts ist das besonders stark<\/strong><\/li>\n<li>Bei einer <strong>rechtsdrehenden Schraube<\/strong> (häufigster Fall) zieht das Heck rückwärts <strong>nach Backbord<\/strong> (links)<\/li>\n<li><strong>Tipp:<\/strong> Vor dem Anlegen im freien Wasser kurz rückwärts fahren. Dann siehst du, wohin dein Boot zieht<\/li>\n<\/ul>\n<h2>Anlegen mit Muring (in Kroatien Standard, „römisch-katholisch“)<\/h2>\n<ol>\n<li>Vor dem Hafen: <strong>Fender<\/strong> an beide Seiten, <strong>Heckleinen<\/strong> klar legen, Crew einteilen<\/li>\n<li>Vor dem Liegeplatz quer stoppen, dann <strong>langsam rückwärts<\/strong> in die Lücke. Den Radeffekt vorhalten<\/li>\n<li>Kurz vor dem Steg: <strong>auskuppeln<\/strong>. Die Crew steigt mit den <strong>Heckleinen<\/strong> über oder gibt sie dem Marinero (Hafenhelfer)<\/li>\n<li>Die <strong>Muringleine<\/strong> vom Steg nach <strong>vorne zum Bug<\/strong> führen und dort belegen. Dabei Motor im Leerlauf, damit sie nicht in die Schraube kommt<\/li>\n<li>Heckleinen so einstellen, dass das Heck nicht an den Steg stößt (ca. 1 m Abstand)<\/li>\n<\/ol>\n<h2>Ablegen<\/h2>\n<p><strong>Von der Muring:<\/strong><\/p>\n<ol>\n<li>Motor starten, warmlaufen lassen<\/li>\n<li><strong>Muringleine lösen und langsam absinken lassen.<\/strong> Kurz warten, damit sie tief genug ist<\/li>\n<li>Heckleinen los, langsam <strong>vorwärts<\/strong> raus<\/li>\n<\/ol>\n<p><strong>Längsseits am Steg – „In die Vorspring eindampfen“:<\/strong><\/p>\n<ol>\n<li>Alle Leinen los außer der <strong>Vorspring<\/strong> (sie geht vom Bug schräg nach hinten zum Steg)<\/li>\n<li><strong>Fender an den Bug<\/strong> (dort drückt das Boot gegen den Steg)<\/li>\n<li><strong>Ruder zum Steg<\/strong>, langsam <strong>voraus<\/strong> geben → das Heck schwenkt vom Steg weg<\/li>\n<li>Wenn das Heck weit genug weg ist: Vorspring los, langsam <strong>rückwärts<\/strong> raus<\/li>\n<\/ol>\n<h2>Ankern<\/h2>\n<ol>\n<li><strong>Platz wählen:<\/strong> passende Tiefe (z. B. 4–10 m), <strong>Sand oder Schlamm<\/strong> (hält gut), genug Abstand zu anderen Booten. In Kroatien ist Ankern innerhalb <strong>150 m von Naturstränden verboten<\/strong><\/li>\n<li><strong>Gegen den Wind<\/strong> langsam anfahren und stoppen<\/li>\n<li><strong>Anker fallen lassen<\/strong>, während das Boot langsam zurücktreibt<\/li>\n<li><strong>Kette stecken:<\/strong> mindestens <strong>3 × Wassertiefe<\/strong> (bei Leine statt Kette mindestens <strong>5 ×<\/strong>). Bei 5 m Tiefe sind das 15 m Kette bzw. 25 m Leine<\/li>\n<li><strong>Rückwärts eindampfen<\/strong> (mit wenig Gas rückwärts, bis der Anker hält), dann <strong>Ankerball<\/strong> ins Vorstag<\/li>\n<li><strong>Kontrollieren:<\/strong> 2 Landmarken an Land peilen (z. B. Kirche und Baum). Bleiben sie gleich, hält der Anker. Wandern sie aus, <strong>slipt<\/strong> der Anker (rutscht über den Grund)<\/li>\n<\/ol>\n<p><strong>Ankerauf:<\/strong> langsam zum Anker vorfahren, dabei Kette einholen. Ist sie senkrecht, bricht der Anker aus. Einholen und sichern.<\/p>\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage<\/div><p>Wie viel Kette steckst du bei 6 m Wassertiefe?\n→ <strong>Mindestens 18 m Kette<\/strong> (3 × Wassertiefe). Mit Leine mindestens 30 m (5 ×). Bei viel Wind mehr.<\/p><\/div>\n\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage<\/div><p>Warum legt man möglichst gegen den Wind an?\n→ Der Wind <strong>bremst<\/strong> das Boot. Man hat mehr Kontrolle und kann langsamer fahren.<\/p><\/div>"},{"n":"14","t":"Seekarten-Übung","h":"<div class=\"co co-abstract\"><div class=\"co-t\">Worum geht&#x27;s überhaupt? (Erklärung für Einsteiger)<\/div><p>In der Prüfung bekommst du eine echte Seekarte, einen <strong>Zirkel<\/strong> und ein <strong>Kursdreieck<\/strong>. Du musst eine Position ablesen oder eintragen, eine Entfernung messen und einen Kurs bestimmen.\nHier ist eine <strong>Musteraufgabe, komplett vorgerechnet<\/strong>. Darunter stehen Übungsaufgaben zum Kompass und zu Weg, Zeit und Fahrt, mit Lösungen zum Aufklappen.\nGrundlagen dazu: <a href=\"#\" data-ch=\"06\">Navigation &amp; Seekarte<\/a><\/p><\/div>\n\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%201120%20715'%20width%3D'1120'%20height%3D'715'%20font-family%3D'Segoe%20UI%2C%20Arial%2C%20sans-serif'%3E%3Crect%20width%3D'1120'%20height%3D'715'%20fill%3D'%23ffffff'%2F%3E%3Ctext%20x%3D'560'%20y%3D'40'%20font-size%3D'26'%20fill%3D'%230b2545'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3ESeekarten-%C3%9Cbung%3A%20so%20rechnest%20du%20es%20Schritt%20f%C3%BCr%20Schritt%3C%2Ftext%3E%3Ctext%20x%3D'560'%20y%3D'66'%20font-size%3D'15'%20fill%3D'%23444'%20text-anchor%3D'middle'%20font-weight%3D'normal'%3E%C3%9Cbungskarte%20(Mercator)%20%C2%B7%20Fahrt%20von%20Hafen%20A%20zum%20Leuchtfeuer%20B%3C%2Ftext%3E%3Crect%20x%3D'70'%20y%3D'110'%20width%3D'406.7'%20height%3D'400'%20fill%3D'%23ffffff'%20stroke%3D'%231a1a1a'%20stroke-width%3D'2'%2F%3E%3Cline%20x1%3D'70'%20y1%3D'510'%20x2%3D'476.7'%20y2%3D'510'%20stroke%3D'%23e3e9f0'%2F%3E%3Cline%20x1%3D'60'%20y1%3D'510'%20x2%3D'70'%20y2%3D'510'%20stroke%3D'%231a1a1a'%2F%3E%3Ctext%20x%3D'56'%20y%3D'514'%20font-size%3D'11'%20fill%3D'%231a1a1a'%20text-anchor%3D'end'%20font-weight%3D'normal'%3E43%C2%B020'%3C%2Ftext%3E%3Cline%20x1%3D'70'%20y1%3D'470'%20x2%3D'476.7'%20y2%3D'470'%20stroke%3D'%23e3e9f0'%2F%3E%3Cline%20x1%3D'60'%20y1%3D'470'%20x2%3D'70'%20y2%3D'470'%20stroke%3D'%231a1a1a'%2F%3E%3Cline%20x1%3D'70'%20y1%3D'430'%20x2%3 8'%20y%3D'674'%20font-size%3D'13.5'%20fill%3D'%231a1a1a'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E%E2%80%A2%20Vorzeichen%20bei%20der%20Missweisung%3A%20Ost%20%3D%20plus%2C%20West%20%3D%20minus.%20Von%20der%20Karte%20zum%20Kompass%20wird%20ABgezogen.%3C%2Ftext%3E%3C%2Fsvg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<h2>Musteraufgabe: Von Hafen A zum Leuchtfeuer B<\/h2>\n<p><strong>Gegeben:<\/strong> A liegt auf 43°22,0' N 016°12,0' E. Fahrt 6 kn. Missweisung 4° Ost. Ablenkung 1° West.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Schritt<\/th>\n<th>Was du tust<\/th>\n<th>Ergebnis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1 Position B<\/td>\n<td>Waagrecht zum seitlichen Rand → Breite. Senkrecht nach unten → Länge<\/td>\n<td><strong>43°28,0' N 016°20,0' E<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2 Distanz<\/td>\n<td>Zirkel auf A und B, dann an die <strong>Breitenskala<\/strong> (seitlich) halten, auf Höhe der Strecke<\/td>\n<td><strong>8,4 sm<\/strong><\/td>\n<\/tr>\n<tr>\n<td>3 Kurs<\/td>\n<td>Kursdreieck an die Linie A–B, am Meridian (senkrechte Linie) ablesen<\/td>\n<td><strong>rwK 044°<\/strong><\/td>\n<\/tr>\n<tr>\n<td>4 Fahrzeit<\/td>\n<td>8,4 sm : 6 kn = 1,4 h → 0,4 × 60 = 24 min<\/td>\n<td><strong>1 h 24 min<\/strong><\/td>\n<\/tr>\n<tr>\n<td>5 Kompasskurs<\/td>\n<td>MgK = 044° − 4° = 040° · KK = 040° − (−1°) = 041°<\/td>\n<td><strong>KK 041°<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>Zur Kontrolle: 6' Breitenunterschied = 6 sm nach Norden; 8' Längenunterschied × cos 43,4° ≈ 5,8 sm nach Osten. Daraus folgen √(6² + 5,8²) ≈ 8,4 sm und ein Kurs von 044°.<\/em><\/p>\n<h2>Kompass-Rechnung – Übungen<\/h2>\n<p>Formel: <strong>KK + Abl = MgK<\/strong> · <strong>MgK + Mw = rwK<\/strong> (Ost = plus, West = minus)<\/p>\n<div class=\"co co-question\"><div class=\"co-t\">Aufgabe 1: rwK aus der Karte 120°, Mw 4° Ost, Abl 2° West. Welchen KK steuerst du?<\/div><p>MgK = 120° − 4° = <strong>116°<\/strong> · KK = 116° − (−2°) = <strong>118°<\/strong><\/p><\/div>\n\n<div class=\"co co-question\"><div class=\"co-t\">Aufgabe 2: Du steuerst KK 250°. Abl 3° Ost, Mw 4° Ost. Wie lautet der rwK?<\/div><p>MgK = 250° + 3° = <strong>253°<\/strong> · rwK = 253° + 4° = <strong>257°<\/strong><\/p><\/div>\n\n<div class=\"co co-question\"><div class=\"co-t\">Aufgabe 3: rwK 002°, Mw 4° Ost, Abl 1° Ost. KK?<\/div><p>MgK = 002° − 4° = −2° = <strong>358°<\/strong> · KK = 358° − 1° = <strong>357°<\/strong>\n(Unter 0° rechnest du + 360°.)<\/p><\/div>\n\n<div class=\"co co-question\"><div class=\"co-t\">Aufgabe 4: rwK 270° (Westen), Mw 4° Ost, keine Ablenkung. Was zeigt der Kompass?<\/div><p>MgK = KK = 270° − 4° = <strong>266°<\/strong><\/p><\/div>\n\n<h2>Weg – Zeit – Fahrt – Übungen<\/h2>\n<p>Formel: <strong>Weg = Fahrt × Zeit<\/strong> (Weg in sm, Fahrt in kn, Zeit in Stunden)<\/p>\n<div class=\"co co-question\"><div class=\"co-t\">Aufgabe 5: 45 Minuten mit 5 kn. Wie weit kommst du?<\/div><p>5 × 45 : 60 = <strong>3,75 sm<\/strong><\/p><\/div>\n\n<div class=\"co co-question\"><div class=\"co-t\">Aufgabe 6: 18 sm bei 6 kn. Wie lange brauchst du?<\/div><p>18 : 6 = <strong>3 h<\/strong><\/p><\/div>\n\n<div class=\"co co-question\"><div class=\"co-t\">Aufgabe 7: Du fährst 10 sm in 1 h 15 min. Wie schnell warst du?<\/div><p>1 h 15 min = 1,25 h → 10 : 1,25 = <strong>8 kn<\/strong><\/p><\/div>\n\n<div class=\"co co-question\"><div class=\"co-t\">Aufgabe 8: Treibstoff reicht für 4 h bei 7 kn. Wie weit darfst du mit der Drittelregel hinausfahren?<\/div><p>Gesamtweg 4 × 7 = 28 sm. Ein Drittel davon für den Hinweg: <strong>ca. 9,3 sm<\/strong> (⅓ hin, ⅓ zurück, ⅓ Reserve)<\/p><\/div>\n\n<div class=\"co co-tip\"><div class=\"co-t\">So übst du an einer echten Karte<\/div><ul>\n<li>Im Kurs gibt es meist eine Übungskarte. Frag danach und übe zu Hause <strong>mindestens 3×<\/strong> Position, Distanz und Kurs<\/li>\n<li>Zirkel und Kursdreieck kosten im Bootszubehör oder online wenig. Damit kannst du auch an einer alten Karte üben<\/li>\n<\/ul><\/div>"},{"n":"15","t":"Fachwörter DE-EN-HR","h":"<div class=\"co co-abstract\"><div class=\"co-t\">Worum geht&#x27;s überhaupt? (Erklärung für Einsteiger)<\/div><p>Die Prüfung kann auf Kroatisch, Englisch oder (über manche Schulen) auf Deutsch sein. <strong>Kläre die Sprache vorher mit deiner Bootsschule.<\/strong>\nWird auf Englisch geprüft, brauchst du die englischen Begriffe. Für den Funk sind sie sowieso Pflicht. Kroatisch hilft im Hafen und beim Marinero (Hafenhelfer).<\/p><\/div>\n\n<div class=\"co co-warning\"><div class=\"co-t\">Hinweis<\/div><p>Die englischen Begriffe sind internationaler Standard. Die <strong>kroatischen<\/strong> Begriffe sind gängige Wörter. Lass sie im Kurs kurz bestätigen, falls du auf Kroatisch geprüft wirst.<\/p><\/div>\n\n<h2>Boot und Richtungen<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Deutsch<\/th>\n<th>Englisch<\/th>\n<th>Kroatisch<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bug (vorne)<\/td>\n<td>bow<\/td>\n<td>pramac<\/td>\n<\/tr>\n<tr>\n<td>Heck (hinten)<\/td>\n<td>stern<\/td>\n<td>krma<\/td>\n<\/tr>\n<tr>\n<td>Backbord (links)<\/td>\n<td>port<\/td>\n<td>lijeva strana<\/td>\n<\/tr>\n<tr>\n<td>Steuerbord (rechts)<\/td>\n<td>starboard<\/td>\n<td>desna strana<\/td>\n<\/tr>\n<tr>\n<td>Anker<\/td>\n<td>anchor<\/td>\n<td>sidro<\/td>\n<\/tr>\n<tr>\n<td>Leine, Seil<\/td>\n<td>line, rope<\/td>\n<td>konop<\/td>\n<\/tr>\n<tr>\n<td>Fender<\/td>\n<td>fender<\/td>\n<td>bokobran<\/td>\n<\/tr>\n<tr>\n<td>Steg, Pier<\/td>\n<td>pier, jetty<\/td>\n<td>gat, mol<\/td>\n<\/tr>\n<tr>\n<td>Hafen<\/td>\n<td>harbour, port<\/td>\n<td>luka<\/td>\n<\/tr>\n<tr>\n<td>Boje, Tonne<\/td>\n<td>buoy<\/td>\n<td>plutača<\/td>\n<\/tr>\n<tr>\n<td>Leuchtturm<\/td>\n<td>lighthouse<\/td>\n<td>svjetionik<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Navigation und Wetter<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Deutsch<\/th>\n<th>Englisch<\/th>\n<th>Kroatisch<\/th>\n<\/tr>\n<\/thead>\n<tbo t-anchor%3D'start'%20font-weight%3D'bold'%3EWas%20du%20tust%3A%20gro%C3%9Fen%20Abstand%20halten%20und%20langsam%20fahren.%20Taucher%20k%C3%B6nnen%20jederzeit%20auftauchen.%3C%2Ftext%3E%3C%2Fsvg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<h2>Vor dem Auslaufen, Wetter, Recht<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Frage<\/th>\n<th>Antwort zum Aufsagen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Worauf achte ich, bevor ich auslaufe?<\/td>\n<td><strong>Auf den Wetterbericht.<\/strong> Dazu Motor-Check und Treibstoff → <a href=\"#\" data-ch=\"07\">Wetter Adria<\/a> · <a href=\"#\" data-ch=\"09\">Motor &amp; Technik<\/a><\/td>\n<\/tr>\n<tr>\n<td>Die 4 wichtigsten Winde in Kroatien?<\/td>\n<td><strong>Bura aus NO, Jugo aus SO, Lebić aus SW, Maestral aus NW<\/strong> → <a href=\"#\" data-ch=\"07\">Wetter Adria<\/a><\/td>\n<\/tr>\n<tr>\n<td>Wie schnell darf man im Hafen fahren?<\/td>\n<td><strong>Nur langsam, ca. 2–3 Knoten<\/strong>, ohne Wellenschlag<\/td>\n<\/tr>\n<tr>\n<td>Ab wann darf man in Gleitfahrt gehen?<\/td>\n<td><strong>Erst ab 300 m von der Küste.<\/strong> Innerhalb von 300 m gilt höchstens 8 kn → <a href=\"#\" data-ch=\"10\">Kroatien-Recht &amp; Notfall<\/a><\/td>\n<\/tr>\n<tr>\n<td>Wie groß ist eine Seemeile?<\/td>\n<td><strong>1,852 km<\/strong> (1852 m)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Seekarte<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Frage<\/th>\n<th>Antwort zum Aufsagen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Was bedeutet ein <strong>+<\/strong> in der Seekarte?<\/td>\n<td><strong>Untiefe / Unterwasserfelsen<\/strong>, gefährlich<\/td>\n<\/tr>\n<tr>\n<td>Was ist eine <strong>rote (magenta) Wellenlinie<\/strong>?<\/td>\n<td><strong>Unterwasserkabel<\/strong> – dort <strong>nicht ankern<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Was ist eine <strong>rote Raute<\/strong>?<\/td>\n<td><strong>Lotsenversetzpunkt<\/strong> (dort steigen Lotsen auf große Schiffe um)<\/td>\n<\/tr>\n<tr>\n<td>Was ist eine <strong>Strich-Punkt-Linie<\/strong> (– · – · –)?<\/td>\n<td>Laut Kursblatt: <strong>Peillinie<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Was bedeuten dunkelblau und hellblau?<\/td>\n<td>Wassertiefe: <strong>dunkelblau 0–10 m, hellblau 10–20 m<\/strong> (je dunkler, desto flacher)<\/td>\n<\/tr>\n<tr>\n<td>Was ist der <strong>Kurs<\/strong>?<\/td>\n<td>Der <strong>Winkel vom Meridian (Nordrichtung) zur Kiellinie<\/strong> des Bootes, im Uhrzeigersinn<\/td>\n<\/tr>\n<tr>\n<td>Wie lege ich das <strong>Kursdreieck<\/strong> an?<\/td>\n<td><strong>Lange Seite auf die Kurslinie<\/strong>, die <strong>Null auf den Meridian<\/strong>. Wo der Meridian aus dem Dreieck herauskommt, lese ich den Kurs ab (es gibt zwei Werte – den passenden für meine Fahrtrichtung nehmen)<\/td>\n<\/tr>\n<tr>\n<td>Wo lese ich <strong>Distanzen<\/strong> ab?<\/td>\n<td>Mit dem <strong>Zirkel<\/strong>, nur am <strong>rechten oder linken Kartenrand<\/strong> (Breitenskala)<\/td>\n<\/tr>\n<tr>\n<td>Wie bestimme ich eine <strong>Position<\/strong>?<\/td>\n<td><strong>Breite:<\/strong> Zirkel von der Position zur nächsten waagrechten Hilfslinie, am <strong>seitlichen Rand<\/strong> ablesen (von unten nach oben zählen). <strong>Länge:<\/strong> genauso zur senkrechten Hilfslinie, am <strong>oberen oder unteren Rand<\/strong> ablesen (von links nach rechts zählen). Immer zuerst die Breite nennen<\/td>\n<\/tr>\n<tr>\n<td>Was heißt <strong>„B C Bl(3) 3s 6/4M“<\/strong> am Leuchtfeuer?<\/td>\n<td><strong>Weiß und rot, Blitzfeuer mit 3 Blitzen, alle 3 Sekunden, Tragweite weiß 6, rot 4 Seemeilen<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Ausführlich: <a href=\"#\" data-ch=\"06\">Navigation &amp; Seekarte<\/a> · Rechnen üben: <a href=\"#\" data-ch=\"14\">Seekarten-Übung<\/a><\/p>\n<h2>Lichter, Signalkörper, Tonnen<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Frage<\/th>\n<th>Antwort zum Aufsagen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Was kann ein <strong>einzelnes weißes Licht<\/strong> nachts sein?<\/td>\n<td><strong>Ankerlieger<\/strong>, ein <strong>Boot von hinten<\/strong> (Hecklicht) oder ein <strong>kleines Boot<\/strong> (unter 7 m und langsamer als 7 kn)<\/td>\n<\/tr>\n<tr>\n<td>Rot-weiß-rot übereinander?<\/td>\n<td><strong>Manövrierbehindertes Fahrzeug<\/strong> (z. B. Bagger)<\/td>\n<\/tr>\n<tr>\n<td>1, 2 oder 3 <strong>schwarze Bälle<\/strong> übereinander?<\/td>\n<td><strong>1 = vor Anker, 2 = manövrierunfähig, 3 = auf Grund gelaufen<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Topzeichen <strong>grünes Dreieck<\/strong>?<\/td>\n<td><strong>Steuerbord-Tonne<\/strong> (beim Einlaufen rechts lassen)<\/td>\n<\/tr>\n<tr>\n<td>Topzeichen <strong>rotes Rechteck<\/strong> (Zylinder)?<\/td>\n<td><strong>Backbord-Tonne<\/strong> (beim Einlaufen links lassen)<\/td>\n<\/tr>\n<tr>\n<td>Topzeichen <strong>2 schwarze Kugeln<\/strong>?<\/td>\n<td><strong>Einzelgefahrenzeichen<\/strong> – Gefahr direkt darunter<\/td>\n<\/tr>\n<tr>\n<td>Topzeichen <strong>2 schwarze Dreiecke nach unten<\/strong>?<\/td>\n<td><strong>Süd-Kardinalzeichen<\/strong> – südlich vorbeifahren<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Ausführlich: <a href=\"#\" data-ch=\"01\">Lichterführung<\/a> · <a href=\"#\" data-ch=\"03\">Seezeichen<\/a><\/p>\n<h2>Ausweichen<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Frage<\/th>\n<th>Antwort zum Aufsagen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Wie begegnen wir uns in der Regel?<\/td>\n<td><strong>Backbord an Backbord<\/strong> – beide weichen nach Steuerbord (rechts) aus<\/td>\n<\/tr>\n<tr>\n<td>Wer hat Vorrang bei <strong>Maschinenfahrzeugen<\/strong> untereinander?<\/td>\n<td><strong>Der von rechts Kommende<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Wer hat Vorrang bei <strong>Seglern<\/strong> untereinander?<\/td>\n<td><strong>Steuerbord-Bug vor Backbord-Bug.<\/strong> Bei gleichem Bug: <strong>Lee vor Luv<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Ausführlich: <a href=\"#\" data-ch=\"02\">Ausweichregeln<\/a><\/p>\n<h2>Schallsignale<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Frage<\/th>\n<th>Antwort zum Aufsagen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1, 2, 3 kurze Töne?<\/td>\n<td><strong>1 kurz = ich ändere Kurs nach Steuerbord, 2 kurz = nach Backbord, 3 kurz = meine Maschine geht rückwärts<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Nebelsignale (alle 2 Minuten)?<\/td>\n<td><strong>1 lang<\/strong> = Maschinenfahrzeug in Fahrt · <strong>lang-kurz-kurz<\/strong> = Fahrzeuge mit Vorrang (Segler, Fischer …) · <strong>2 lang<\/strong> = siehe Hinweis unten<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"co co-warning\"><div class=\"co-t\">Hinweis zu „2 lang“ im Nebel – bitte im Kurs nachfragen<\/div><p>Im Kursblatt steht: „2 lang alle 2 min = Ankerlieger“.\nNach den internationalen Kollisionsverhütungsregeln (KVR/COLREG, Regel 35) bedeutet <strong>2 lang = Maschinenfahrzeug, das gestoppt ist<\/strong> (liegt still, aber nicht vor Anker). Ein <strong>Ankerlieger läutet die Glocke<\/strong> (jede Minute ca. 5 Sekunden).\nFrag deinen Ausbilder, welche Antwort er in der Prüfung hören will. Sicher richtig ist: „2 lang = gestoppter Maschinenfahrer, Ankerlieger = Glocke“.<\/p><\/div>\n\n<p>Ausführlich: <a href=\"#\" data-ch=\"04\">Schall- und Notsignale<\/a><\/p>\n<h2>Notfall und Funk<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Frage<\/th>\n<th>Antwort zum Aufsagen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Seenot-Notrufnummer per Telefon?<\/td>\n<td><strong>195<\/strong> (Kroatien), international <strong>112<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Wann setze ich eine Notmeldung ab?<\/td>\n<td>Wenn <strong>Schiff oder Mensch in unmittelbarer Lebensgefahr<\/strong> ist<\/td>\n<\/tr>\n<tr>\n<td>Kennung für Not-, Dringlichkeits-, Sicherheitsmeldung?<\/td>\n<td><strong>MAYDAY – PAN PAN – SÉCURITÉ<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Was ist der Notkanal?<\/td>\n<td><strong>Kanal 16<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Notzeichen, Ausrüstung, Funkalphabet?<\/td>\n<td>Laut Skript → <a href=\"#\" data-ch=\"04\">Schall- und Notsignale<\/a> · <a href=\"#\" data-ch=\"12\">Ausrüstung, Flaggen &amp; Praxis<\/a> · <a href=\"#\" data-ch=\"05\">UKW-Funk<\/a><\/td>\n<\/tr>\n<tr>\n<td>Was bedeutet die <strong>Flagge A<\/strong> (Alfa)?<\/td>\n<td><strong>„Ich habe Taucher unten – halten Sie gut Abstand“<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Wie sieht eine <strong>Taucherboje<\/strong> aus?<\/td>\n<td><strong>Orange oder rot<\/strong>, oft mit Taucher-Fähnchen. Alternativ zeigt das Tauchboot die <strong>Flagge A<\/strong>. Abstand halten, langsam fahren<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Motor<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Frage<\/th>\n<th>Antwort zum Aufsagen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Welche Motorkühlungen gibt es?<\/td>\n<td><strong>Einkreiskühlung<\/strong> (Seewasser direkt durch den Motor) und <strong>Zweikreiskühlung<\/strong> (innen Kühlflüssigkeit, außen Seewasser über einen Wärmetauscher)<\/td>\n<\/tr>\n<tr>\n<td>Was beachte ich beim Starten eines <strong>Benzin-Innenborders<\/strong>?<\/td>\n<td><strong>Erst den Motorraum mit dem Lüfter lüften<\/strong> (Benzindämpfe können explodieren)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Ausführlich: <a href=\"#\" data-ch=\"09\">Motor &amp; Technik<\/a><\/p>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%201000%20905'%20width%3D'1000'%20height%3D'905'%20font-family%3D'Segoe%20UI%2C%20Arial%2C%20sans-serif'%3E%3Crect%20width%3D'1000'%20height%3D'905'%20fill%3D'%23ffffff'%2F%3E%3Ctext%20x%3D'500.0'%20y%3D'40'%20font-size%3D'26'%20fill%3D'%230b2545'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3EAnker%2C%20Ankergrund%20und%20Motork%C3%BChlung%3C%2Ftext%3E%3Ctext%20x%3D'500.0'%20y%3D'66'%20font-size%3D'15'%20fill%3D'%23444'%20text-anchor%3D'middle'%20font-weight%3D'normal'%3EStark%20vereinfachte%20Umrisse%20%E2%80%93%20es% deutet diese Flagge?","a":"Lotse an Bord","w":["Taucher unten","Seenot","Einklarierung"],"e":"Flagge H.","p":"f:H"},{"c":"Bilder-Quiz","q":"Was bedeutet dieses Schallsignal?","a":"Ich ändere meinen Kurs nach Steuerbord","w":["Nach Backbord","Maschine rückwärts","Achtung, Zweifel"],"e":"1× kurz.","p":"s:s"},{"c":"Bilder-Quiz","q":"Was bedeutet dieses Schallsignal?","a":"Ich ändere meinen Kurs nach Backbord","w":["Nach Steuerbord","Maschine rückwärts","Nebel"],"e":"2× kurz.","p":"s:ss"},{"c":"Bilder-Quiz","q":"Was bedeutet dieses Schallsignal?","a":"Meine Maschine geht rückwärts","w":["Kurs nach Steuerbord","Seenot","Ich überhole"],"e":"3× kurz.","p":"s:sss"},{"c":"Bilder-Quiz","q":"Was bedeutet dieses Schallsignal?","a":"Zweifel / Warnung – deine Absicht ist mir unklar","w":["Seenot","Ich ankere","Kurs nach Backbord"],"e":"Mindestens 5× kurz.","p":"s:sssss"},{"c":"Bilder-Quiz","q":"Du hörst im Nebel alle 2 Minuten dieses Signal. Wer ist das?","a":"Ein Segler, Fischer oder anderes Fahrzeug mit Vorrang","w":["Motorboot in Fahrt","Ankerlieger","Motorboot gestoppt"],"e":"Lang-kurz-kurz.","p":"s:lss"},{"c":"Bilder-Quiz","q":"Du hörst im Nebel alle 2 Minuten dieses Signal. Wer ist das?","a":"Ein Maschinenfahrzeug mit Fahrt durchs Wasser","w":["Ein Segler","Ein Ankerlieger","Ein gestopptes Motorboot"],"e":"1× lang.","p":"s:l"},{"c":"Mündliche Prüfung","q":"Du siehst nachts rot über weiß und darunter ein grünes Licht. Was ist das und was tust du?","a":"Ein Fischer (nicht schleppend), der mir seine Steuerbordseite zeigt. Fischer haben Vorrang vor Motor- und Segelbooten → ich weiche aus, früh und deutlich, und fahre hinter ihm vorbei.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Wie setzt du einen Notruf ab?","a":"Kanal 16 (vorher DSC-Notknopf, wenn vorhanden): 3× MAYDAY, 3× Bootsname + Rufzeichen/MMSI, MAYDAY + Name, Position, was passiert ist, welche Hilfe ich brauche, Personen an Bord, OVER. Ohne Funk: Telefon 195.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Ein Crewmitglied fällt über Bord. Was machst du?","a":"Laut rufen, Rettungsring werfen, einen Ausguck bestimmen, der zeigt. MOB-Taste am GPS drücken. Ruder zur Seite der Person (Schraube weg), zurückfahren, gegen den Wind anfahren, nahe der Person auskuppeln. Wenn nötig MAYDAY.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Die Öldrucklampe geht an. Was tust du?","a":"Motor sofort abstellen, Ölstand prüfen und nachfüllen. Neu starten und beobachten. Geht sie wieder an: nicht weiterfahren, Hilfe holen.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Der Motor überhitzt. Was prüfst du?","a":"Gas weg bzw. Motor aus. Seeventil offen? Seewasserfilter verstopft (Plastiktüte)? Impeller defekt? Keilriemen gerissen? Kommt Kühlwasser aus dem Auspuff?","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Welche Winde gibt es in der Adria, und welcher ist gefährlich?","a":"Bura (NO, kalter böiger Fallwind, kommt plötzlich, Anzeichen Wolkenkappe über dem Gebirge), Jugo (SO, warm, feucht, hohe Wellen, fallender Luftdruck), Maestral (NW, Schönwetter-Thermik im Sommer). Gefährlich sind Bura und Jugo.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Erkläre die Kardinaltonnen.","a":"Gelb-schwarze Tonnen, die eine Gefahr markieren. Man fährt auf der Seite vorbei, nach der sie benannt sind. Nord: beide Spitzen oben, Süd: beide unten, Ost: Spitzen auseinander, West: Spitzen zusammen. Licht weiß: N ununterbrochen, O 3, S 6 + lang, W 9 Blitze.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Zwei Motorboote fahren aufeinander zu. Was tun beide?","a":"Beide ändern Kurs nach Steuerbord und passieren sich Backbord an Backbord.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Wer muss bei kreuzenden Kursen ausweichen?","a":"Das Maschinenfahrzeug, das das andere an seiner Steuerbordseite (rechts) sieht. Es fährt hinter dem anderen vorbei.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Wie erkennst du, dass Kollisionsgefahr besteht?","a":"Wenn die Peilung zum anderen Fahrzeug gleich bleibt und der Abstand kleiner wird.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Wie ankerst du richtig?","a":"Platz mit passender Tiefe und Sand/Schlamm wählen, gegen den Wind anfahren und stoppen, Anker fallen lassen, beim Zurücktreiben Kette mindestens 3 × (Leine 5 ×) Wassertiefe stecken, rückwärts eingraben, Ankerball setzen, mit Landmarken kontrollieren.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Wie legst du in Kroatien mit Muring an?","a":"Fender und Heckleinen klar, langsam rückwärts in die Lücke (Radeffekt beachten), Heckleinen an den Steg, Muringleine nach vorne zum Bug führen und belegen, Motor dabei auskuppeln.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Wie misst du eine Distanz in der Seekarte?","a":"Mit dem Zirkel A und B abgreifen und an der Breitenskala (seitlicher Rand), auf Höhe der Strecke, ablesen. 1 Minute = 1 Seemeile.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Was bedeutet Fl(3) G 10s 5M auf der Seekarte?","a":"Ein grünes Leuchtfeuer mit einer Gruppe von 3 Blitzen, die sich alle 10 Sekunden wiederholt. Tragweite 5 Seemeilen.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Welche Höchstgeschwindigkeit gilt in Kroatien nahe der Küste?","a":"Innerhalb von 300 m von der Küste maximal 8 Knoten.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Wie weit muss ein Boot unter 15 m von der Küste bleiben, und wo darfst du nicht ankern?","a":"Mindestens 50 m von der Küste. Kein Ankern innerhalb 150 m von Naturstränden und dort, wo es das Hafenamt verbietet.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Was machst du, bevor du den Motor startest?","a":"Ölstand prüfen, Seeventil öffnen, Kraftstoff prüfen (Drittelregel), Batteriehauptschalter an, beim Benziner den Motorraum lüften, Schalthebel auf neutral. Nach dem Start prüfen, ob Kühlwasser aus dem Auspuff kommt.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Welche Notsignale kennst du?","a":"Rote Fallschirmrakete oder Handfackel, oranger Rauch, MAYDAY über Funk, SOS, Arme seitlich heben und senken, Dauerton mit dem Nebelhorn, Flaggen N über C, Flammen an Bord, EPIRB.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Welche Knoten kennst du, und wofür brauchst du sie?","a":"Palstek (feste Schlinge, Poller, Rettung), Webeleinstek (Fender), Klampenschlag (Festmachen an der Klampe), Achtknoten (Stopper), Kreuzknoten (gleich dicke Leinen), Schotstek (dicke + dünne Leine).","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Was ist der Unterschied zwischen MAYDAY, PAN PAN und SÉCURITÉ?","a":"MAYDAY = unmittelbare Lebensgefahr. PAN PAN = dringend, aber keine unmittelbare Lebensgefahr (z. B. Motorausfall). SÉCURITÉ = Sicherheitsmeldung (z. B. Treibgut, Sturmwarnung).","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Worauf achtest du, bevor du mit dem Boot ausläufst?","a":"Auf den Wetterbericht. Dazu Motor-Check (Öl, Seeventil, Treibstoff nach Drittelregel) und Sicherheitsausrüstung.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Nenne die 4 wichtigsten Winde in Kroatien mit Richtung.","a":"Bura aus Nordost, Jugo aus Südost, Lebić aus Südwest, Maestral aus Nordwest.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Was ist der Kurs?","a":"Der Winkel vom Meridian (Nordrichtung) zur Kiellinie des Bootes, im Uhrzeigersinn gemessen.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Wie legst du das Kursdreieck an, um den Kurs abzulesen?","a":"Lange Seite auf die Kurslinie, Null auf einen Meridian. Wo der Meridian aus dem Dreieck kommt, lese ich den Kurs ab und nehme den Wert, der zu meiner Fahrtrichtung passt.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Wie bestimmst du mit dem Zirkel eine gegebene Position?","a":"Breite: Zirkel von der Position zur nächsten waagrechten Hilfslinie, am seitlichen Kartenrand ablesen (von unten nach oben). Länge: zur senkrechten Hilfslinie, am oberen oder unteren Rand ablesen (von links nach rechts). Zuerst die Breite nennen.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Was kann ein einzelnes weißes Licht in der Nacht bedeuten?","a":"Ein Ankerlieger, ein Boot, das ich von hinten sehe (Hecklicht), oder ein kleines Boot unter 7 m und unter 7 kn.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Was bedeuten diese Topzeichen: grünes Dreieck, rotes Rechteck, 2 schwarze Kugeln, 2 schwarze Dreiecke nach unten?","a":"Steuerbord-Tonne, Backbord-Tonne, Einzelgefahrenzeichen, Süd-Kardinalzeichen.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Erkläre die Kennung „B C Bl(3) 3s 6/4M“.","a":"Weiß und rot, Blitzfeuer mit Gruppen aus 3 Blitzen, Wiederkehr alle 3 Sekunden, Tragweite weiß 6, rot 4 Seemeilen.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Welche Ankertypen kennst du, und welcher Grund hält gut?","a":"Danforth-, Pflugschar-, Klapp-, Hall- und Stockanker. Gut: Sand, Ton, Schlick. Schlecht: Stein, Seegras.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Wie viel Kette oder Leine steckst du bei normalen Verhältnissen?","a":"Kette mindestens 3 × Wassertiefe, Leine mindestens 5 × Wassertiefe. Bei viel Wind mehr.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Welche Motorkühlungen gibt es?","a":"Einkreiskühlung: Seewasser direkt durch den Motor. Zweikreiskühlung: innen eigene Kühlflüssigkeit, die über einen Wärmetauscher vom Seewasser gekühlt wird.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Wer hat Vorrang bei Seglern untereinander?","a":"Steuerbord-Bug vor Backbord-Bug. Haben beide den Wind von derselben Seite: Lee vor Luv.","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Welche Schallsignale gibt es im Nebel?","a":"Alle 2 Minuten: 1 lang = Maschinenfahrzeug in Fahrt, 2 lang = Maschinenfahrzeug gestoppt, lang-kurz-kurz = Fahrzeuge mit Vorrang (Segler, Fischer …). Ankerlieger: jede Minute ca. 5 s Glocke. (Im Kurs fragen, was dort zu „2 lang“ erwartet wird.)","w":[],"e":""},{"c":"Mündliche Prüfung","q":"Was bedeuten +, eine rote Wellenlinie und eine rote Raute in der Seekarte?","a":"+ = Untiefe/Unterwasserfelsen, rote Wellenlinie = Unterwasserkabel (nicht ankern), rote Raute = Lotsenversetzpunkt.","w":[],"e":""}],"g":[{"t":"Bug","a":[],"e":"Die vordere Spitze des Bootes."},{"t":"Heck","a":[],"e":"Das hintere Ende des Bootes, dort ist meist der Motor."},{"t":"Steuerbord","a":[],"e":"Die rechte Seite des Bootes, wenn du nach vorne schaust. Erkennbar am grünen Licht."},{"t":"Backbord","a":[],"e":"Die linke Seite des Bootes, wenn du nach vorne schaust. Erkennbar am roten Licht."},{"t":"querab","a":[],"e":"Genau seitlich vom Boot, also im rechten Winkel zur Fahrtrichtung."},{"t":"achterlich","a":["achteraus"],"e":"Weiter nach hinten. „Achteraus“ heißt hinter dem Boot."},{"t":"Luv","a":[],"e":"Die Seite, von der der Wind kommt."},{"t":"Lee","a":[],"e":"Die Seite, die vom Wind abgewandt ist, also die geschützte Seite."},{"t":"Bug (Segeln)","a":["Backbordbug","Steuerbordbug"],"e":"Beim Segeln: Kommt der Wind von rechts, fährt das Boot auf Steuerbordbug. Kommt er von links, auf Backbordbug."},{"t":"Bilge","a":[],"e":"Der tiefste Raum ganz unten im Rumpf. Dort sammelt sich Wasser, Öl und bei Benzinern auch gefährlicher Benzindampf."},{"t":"Klampe","a":[],"e":"Ein Metall-Beschlag mit zwei „Hörnern“ am Boot oder am Steg, an dem du die Leine festmachst."},{"t":"Fender","a":[],"e":"Ein Gummi-Puffer, der zwischen Boot und Steg hängt, damit nichts zerkratzt."},{"t":"Reling","a":[],"e":"Das Geländer rund ums Deck."},{"t":"Leine","a":["Tau","Schot"],"e":"Seemännisch für Seil. „Schot“ ist die Leine, mit der man ein Segel einstellt."},{"t":"Muring","a":["Muringleine","Mooring"],"e":"Eine Leine, die am Meeresgrund an einem Betonklotz befestigt ist. Im Hafen ziehst du sie hoch und machst damit den Bug fest, das Heck kommt an den Steg."},{"t":"Vorstag","a":[],"e":"Das Drahtseil vom Mast nach vorne zum Bug. Dort hängt man z. B. den Ankerball auf."},{"t":"Backskiste","a":[],"e":"Ein Stauraum unter den Sitzbänken im Cockpit. Dort liegen oft Leinen, Fender und der Ankerball."},{"t":"Cockpit","a":[],"e":"Der offene Sitzbereich hinten an Deck, wo das Steuer ist."},{"t":"Niedergang","a":["Navigationstisch","Kartentisch"],"e":"Die Treppe vom Cockpit hinunter in die Kajüte. Gleich daneben ist meist der Navigationstisch (Kartentisch) mit Seekarte und Funkgerät."},{"t":"BT","a":["BRT","GT"],"e":"Bruttoraumzahl, ein Maß für die Größe (das Volumen) eines Schiffs, nicht für das Gewicht. 30 BT entspricht etwa einer Yacht von 18–20 m."},{"t":"Seemeile","a":["sm","NM"],"e":"Das Längenmaß auf See: 1 Seemeile (sm) = 1852 m. Das ist genau eine Bogenminute auf der Breitenskala der Seekarte."},{"t":"Knoten (Geschwindigkeit)","a":["kn"],"e":"Die Geschwindigkeit auf See: 1 Knoten (kn) = 1 Seemeile pro Stunde, also etwa 1,85 km/h. 10 kn sind etwa 18,5 km/h."},{"t":"Breite (Koordinate)","a":["Breitengrad","Breitenskala","Latitude"],"e":"Wie weit nördlich vom Äquator du bist. Auf der Seekarte sind das die waagrechten Linien, abgelesen am seitlichen Rand."},{"t":"Länge (Koordinate)","a":["Längengrad","Längenskala","Longitude"],"e":"Wie weit östlich (oder westlich) von Greenwich du bist. Auf der Karte sind das die senkrechten Linien, abgelesen am oberen oder unteren Rand."},{"t":"Bogenminute","a":[],"e":"Ein Grad wird in 60 Minuten geteilt. Auf der Breitenskala ist 1 Minute genau 1 Seemeile lang."},{"t":"Kurs","a":[],"e":"Die Richtung, in die du fährst, in Grad von 000° bis 360°. 000° ist Norden, 090° Osten, 180° Süden, 270° Westen."},{"t":"Peilung","a":["peilen"],"e":"Die Richtung, in der du ein anderes Objekt siehst, zum Beispiel ein Schiff oder einen Leuchtturm. Bleibt die Peilung zu einem anderen Schiff gleich, droht ein Zusammenstoß."},{"t":"Missweisung","a":["Mw"],"e":"Der Kompass zeigt nicht genau zum geografischen Nordpol, sondern zum magnetischen. Der Unterschied heißt Missweisung und steht in der Seekarte, in der Adria etwa 4–5°."},{"t":"Ablenkung","a":["Deviation","Abl"],"e":"Eisen und Elektrik an Bord lenken den Kompass zusätzlich ein bisschen ab."},{"t":"rechtweisend","a":["rwK"],"e":"Der „wahre“ Kurs bezogen auf geografisch Nord. So steht er in der Seekarte."},{"t":"Zirkel","a":["Kartenzirkel"],"e":"Ein Werkzeug mit zwei Spitzen, mit dem du in der Seekarte Entfernungen abgreifst."},{"t":"Kursdreieck","a":[],"e":"Ein Geodreieck für die Seekarte, mit dem du Kurse einzeichnest und abliest."},{"t":"Tragweite","a":[],"e":"Bis zu welcher Entfernung ein Leuchtfeuer zu sehen ist, angegeben in Seemeilen."},{"t":"Fahrwasser","a":[],"e":"Der Bereich, in dem Schiffe sicher fahren können, oft mit roten und grünen Tonnen markiert."},{"t":"Hoheitsgewässer","a":[],"e":"Das Meer bis 12 sm vor der Küste, das noch zum Staatsgebiet gehört."},{"t":"Tonne","a":["Tonnen","Boje"],"e":"Ein schwimmendes, am Grund verankertes Seezeichen. Es zeigt, wo du fahren darfst und wo Gefahr ist."},{"t":"Lateralzeichen","a":[],"e":"Die roten und grünen Tonnen, die den Rand eines Fahrwassers markieren, wie Leitpfosten an der Straße."},{"t":"Kardinalzeichen","a":["Kardinaltonne"],"e":"Die gelb-schwarzen Tonnen. Sie zeigen, auf welcher Himmelsrichtung (Nord, Ost, Süd, West) das sichere Wasser liegt."},{"t":"Toppzeichen","a":[],"e":"Die Form ganz oben auf einer Tonne, z. B. zwei Kegel oder ein Ball. Damit erkennst du die Tonne auch ohne Farbe."},{"t":"Leuchtfeuer","a":["Feuer","Feuerkennung"],"e":"Ein Leuchtturm oder eine Leuchttonne. Jedes blinkt in seinem eigenen Rhythmus (Feuerkennung), damit du es nachts erkennst."},{"t":"Topplicht","a":[],"e":"Weißes Licht vorne oben am Mast. Es leuchtet nach vorne und zeigt an: „Ich fahre mit Motor“."},{"t":"Seitenlicht","a":["Seitenlichter"],"e":"Rotes Licht links und grünes Licht rechts. Daran siehst du nachts, welche Seite eines Bootes du gerade siehst."},{"t":"Hecklicht","a":[],"e":"Weißes Licht hinten. Siehst du nur dieses, fährt das Boot von dir weg."},{"t":"Rundumlicht","a":["Rundumlichter"],"e":"Ein Licht, das in alle Richtungen (360°) leuchtet."},{"t":"Signalkörper","a":[],"e":"Schwarze Bälle, Kegel und Zylinder, die Schiffe tagsüber aufhängen. Sie bedeuten dasselbe wie die Lichter in der Nacht."},{"t":"Sektor","a":[],"e":"Ein „Tortenstück“ des Kreises, in das ein Licht strahlt. Das Topplicht leuchtet zum Beispiel 225° nach vorne."},{"t":"KVR","a":["COLREG"],"e":"Die internationalen Kollisionsverhütungsregeln, also die „Straßenverkehrsordnung“ auf See."},{"t":"Kurshalter","a":[],"e":"Das Boot, das Vorrang hat. Es muss Kurs und Geschwindigkeit beibehalten, damit der andere berechenbar ausweichen kann."},{"t":"Ausweichpflichtiger","a":["ausweichen"],"e":"Das Boot, das Platz machen muss, früh und deutlich."},{"t":"Maschinenfahrzeug","a":[],"e":"Jedes Boot, das mit Motor fährt. Auch ein Segelboot, sobald der Motor läuft."},{"t":"Manövrierunfähig","a":["NUC"],"e":"Ein Schiff, das nicht steuern kann, z. B. weil das Ruder kaputt ist (englisch: Not Under Command)."},{"t":"Manövrierbehindert","a":["RAM"],"e":"Ein Schiff, das wegen seiner Arbeit nicht ausweichen kann, z. B. ein Bagger, Kabelleger oder Taucherschiff."},{"t":"Tiefgangbehindert","a":["CBD"],"e":"Ein großes Schiff, das wegen seines Tiefgangs nur in einer tiefen Rinne fahren kann."},{"t":"Tiefgang","a":[],"e":"Wie tief das Boot unter Wasser reicht."},{"t":"Hafenamt","a":["Lučka kapetanija","Hafenkapitanat"],"e":"Die kroatische Behörde für Schifffahrt in einem Hafen. Dort legst du die Prüfung ab."},{"t":"UKW","a":["VHF","Funkgerät"],"e":"Das Seefunkgerät an Bord. Die Reichweite liegt bei etwa 20–30 sm, ähnlich wie bei einem Walkie-Talkie."},{"t":"Kanal 16","a":[],"e":"Der Notruf- und Anrufkanal am Funkgerät. Den hören alle Schiffe und die Küstenwache mit."},{"t":"DSC","a":[],"e":"Digitaler Notruf per Knopfdruck am Funkgerät. Er schickt automatisch deine Position und Kennung."},{"t":"MMSI","a":[],"e":"Die 9-stellige „Telefonnummer“ deines Funkgeräts bzw. Bootes."},{"t":"Rufzeichen","a":[],"e":"Der offizielle Funk-Name des Bootes, z. B. 9A1234."},{"t":"MAYDAY","a":[],"e":"Das Funkwort für höchste Not: Lebensgefahr."},{"t":"PAN PAN","a":[],"e":"Das Funkwort für einen dringenden Notfall ohne unmittelbare Lebensgefahr."},{"t":"SÉCURITÉ","a":[],"e":"Das Funkwort für eine Sicherheitsmeldung, z. B. eine Wetterwarnung oder Treibgut."},{"t":"MRCC","a":[],"e":"Die Seenotleitstelle, die Rettungen koordiniert. In Kroatien ist das MRCC Rijeka, Telefon 195."},{"t":"EPIRB","a":["PLB"],"e":"Ein Notsender, der per Satellit deine Position meldet."},{"t":"MOB","a":["Mann über Bord"],"e":"Mann über Bord: Jemand ist ins Wasser gefallen. Viele Plotter haben dafür eine eigene MOB-Taste, die die Position speichert."},{"t":"Plotter","a":["GPS"],"e":"Ein Bildschirm mit Seekarte und GPS-Position, das Navi fürs Boot."},{"t":"Beaufort","a":["Bft"],"e":"Die Skala für Windstärke von 0 (Stille) bis 12 (Orkan). Ab 6 Bft wird es für kleine Boote ungemütlich."},{"t":"Bura","a":[],"e":"Ein kalter, sehr böiger Fallwind aus Nordost, der oft plötzlich kommt. Er ist der gefährlichste Wind der Adria."},{"t":"Jugo","a":[],"e":"Ein warmer, feuchter Wind aus Südost. Er bringt Wolken, Regen und hohe Wellen."},{"t":"Maestral","a":[],"e":"Ein angenehmer Sommerwind aus Nordwest, der nachmittags weht."},{"t":"Böe","a":["böig","Böen"],"e":"Ein kurzer, plötzlicher Windstoß, der deutlich stärker ist als der normale Wind."},{"t":"Seegang","a":["Dünung"],"e":"Die Wellen. Dünung sind lange Wellen, die von weit her kommen, auch ohne Wind vor Ort."},{"t":"Luftdruck","a":["Barometer","hPa"],"e":"Fällt der Luftdruck schnell, kommt meist schlechtes Wetter oder Sturm. Gemessen wird er mit dem Barometer in hPa."},{"t":"Impeller","a":[],"e":"Ein kleines Gummi-Flügelrad in der Kühlwasserpumpe. Ist es kaputt, überhitzt der Motor."},{"t":"Seeventil","a":[],"e":"Ein Absperrhahn im Rumpf, durch den Meerwasser zum Kühlen angesaugt wird. Er muss beim Motorstart offen sein."},{"t":"Seewasserfilter","a":[],"e":"Ein Sieb vor der Kühlwasserpumpe, damit kein Dreck oder Plastik angesaugt wird."},{"t":"Keilriemen","a":[],"e":"Ein Gummiriemen am Motor, der Pumpe und Lichtmaschine antreibt."},{"t":"Lichtmaschine","a":[],"e":"Der Generator am Motor, der die Batterie lädt, wie beim Auto."},{"t":"Außenborder","a":[],"e":"Ein Motor, der außen am Heck hängt, typisch bei kleinen Booten."},{"t":"Schraube","a":["Propeller"],"e":"Der Propeller unter Wasser. Für Menschen im Wasser ist er lebensgefährlich."},{"t":"auskuppeln","a":["Leerlauf","Neutral"],"e":"Den Gashebel in die Mitte stellen: Der Motor läuft, aber die Schraube dreht sich nicht."},{"t":"Radeffekt","a":[],"e":"Die drehende Schraube schiebt das Heck seitlich weg, besonders beim Rückwärtsfahren. Bei rechtsdrehender Schraube zieht das Heck rückwärts nach Backbord."},{"t":"Vorspring","a":["Spring"],"e":"Eine Leine, die vom Bug schräg nach hinten zum Steg läuft. Mit ihr kann man das Heck vom Steg wegdrehen (eindampfen)."},{"t":"eindampfen","a":[],"e":"Mit Motorkraft gegen eine festgemachte Leine fahren, damit sich das Boot dreht. Zum Beispiel beim Ablegen in die Vorspring."},{"t":"Schwojkreis","a":["schwojen"],"e":"Der Kreis, in dem sich ein ankerndes Boot bei drehendem Wind um seinen Anker bewegt."},{"t":"slippen","a":["slipt"],"e":"Der Anker hält nicht und rutscht über den Grund."},{"t":"Marinero","a":[],"e":"Der Hafenhelfer in der Marina. Er zeigt dir den Platz und reicht dir die Muringleine."}]};

let tab = "lernen";
function go(t, arg){
  tab = t; document.querySelector(".sheet")?.remove();

function zoom(src){

/* ---------- Bild-Piktogramme fürs Quiz ---------- */
function pic(code){
  const [k,v]=code.split(":"); const W=280,H=170;
  const C={W:"#fffbe6",R:"#ff3b3b",G:"#2ee06a"};
  let b="";
  if(k==="n"){ const [stack,side]=v.split("|"); b+=`<rect width='${W}' height='${H}' fill='#0a1624'/>`;
    const s=[...stack]; s.forEach((c,i)=>b+=`<circle cx='140' cy='${28+i*34}' r='9' fill='${C[c]}'/><circle cx='140' cy='${28+i*34}' r='14' fill='${C[c]}' opacity='.2'/>`);
    const y=28+Math.max(s.length,1)*34+14; const sd=[...(side||"")];
    sd.forEach((c,i)=>{const x=sd.length===2?(i?168:112):140; b+=`<circle cx='${x}' cy='${y}' r='8' fill='${C[c]}'/><circle cx='${x}' cy='${y}' r='15' fill='${C[c]}' opacity='.18'/>`;});
    b+=`<path d='M0,${H-18} q20,-6 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0' stroke='#1f3a55' fill='none' stroke-width='2'/>`; }
  else if(k==="d"){ b+=`<rect width='${W}' height='${H}' fill='#dceaf5'/><line x1='140' y1='8' x2='140' y2='${H-10}' stroke='#556' stroke-width='4'/>`;
    const sh=v.split(","); sh.forEach((s,i)=>{const y=34+i*38, x=140;
      if(s==="ball") b+=`<circle cx='${x}' cy='${y}' r='14' fill='#111'/>`;
      if(s==="cone_up") b+=`<polygon points='${x},${y-15} ${x+15},${y+13} ${x-15},${y+13}' fill='#111'/>`;
      if(s==="cone_dn") b+=`<polygon points='${x},${y+15} ${x+15},${y-13} ${x-15},${y-13}' fill='#111'/>`;
      if(s==="diamond") b+=`<polygon points='${x},${y-17} ${x+13},${y} ${x},${y+17} ${x-13},${y}' fill='#111'/>`;
      if(s==="cyl") b+=`<rect x='${x-12}' y='${y-18}' width='24' height='36' fill='#111'/>`;}); }
  else if(k==="b"){ const BK="#111",Y="#f2c200",Rd="#d62828",Gn="#1b9e3e",Wh="#fff";
    const P={N:[[BK,Y],["u","u"]],S:[[Y,BK],["d","d"]],E:[[BK,Y,BK],["d","u"]],W:[[Y,BK,Y],["u","d"]],port:[[Rd],["cyl"]],stbd:[[Gn],["u"]],iso:[[BK,Rd,BK],["ball","ball"]],safe:[["stripe"],["rball"]],special:[[Y],["x"]]}[v];
    b+=`<rect width='${W}' height='${H}' fill='#eaf3fb'/><rect y='${H-34}' width='${W}' height='34' fill='#bcd9f0'/>`;
    const x=140, top=60, h=80, n=P[0].length;
    if(P[0][0]==="stripe"){ for(let i=0;i<4;i++) b+=`<rect x='${x-14+i*7}' y='${top}' width='7' height='${h}' fill='${i%2?Wh:Rd}'/>`; }
    else P[0].forEach((c,i)=>b+=`<rect x='${x-14}' y='${top+i*h/n}' width='28' height='${h/n+0.5}' fill='${c}'/>`);
    b+=`<rect x='${x-14}' y='${top}' width='28' height='${h}' fill='none' stroke='#333'/><line x1='${x}' y1='${top}' x2='${x}' y2='${top-10}' stroke='#333' stroke-width='2'/>`;
    let ty=top-22; P[1].forEach(t=>{
      if(t==="u") b+=`<polygon points='${x},${ty-10} ${x+11},${ty+9} ${x-11},${ty+9}' fill='${v==="stbd"?Gn:BK}'/>`;
      if(t==="d") b+=`<polygon points='${x},${ty+9} ${x+11},${ty-10} ${x-11},${ty-10}' fill='${BK}'/>`;
      if(t==="ball") b+=`<circle cx='${x}' cy='${ty}' r='9' fill='${BK}'/>`;
      if(t==="rball") b+=`<circle cx='${x}' cy='${ty}' r='9' fill='${Rd}'/>`;
      if(t==="cyl") b+=`<rect x='${x-9}' y='${ty-10}' width='18' height='20' fill='${Rd}'/>`;
      if(t==="x") b+=`<path d='M${x-9},${ty-9} L${x+9},${ty+9} M${x+9},${ty-9} L${x-9},${ty+9}' stroke='${Y}' stroke-width='5'/>`;
      ty-=22; });
    b+=`<path d='M0,${H-34} q20,-8 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0' stroke='#1f5fbf' fill='none' stroke-width='2'/>`; }
  else if(k==="f"){ b+=`<rect width='${W}' height='${H}' fill='#eef3f8'/><rect x='58' y='18' width='5' height='${H-30}' fill='#667'/>`;
    const fx=63,fy=24,fw=150,fh=96;
    const flag=(name,y,h)=>{ let s="";
      if(name==="A") s=`<rect x='${fx}' y='${y}' width='${fw/2}' height='${h}' fill='#fff' stroke='#999'/><path d='M${fx+fw/2},${y} h${fw/2} l-${fw/4},${h/2} l${fw/4},${h/2} h-${fw/2} z' fill='#1f5fbf'/>`;
      if(name==="Q") s=`<rect x='${fx}' y='${y}' width='${fw}' height='${h}' fill='#f2c200' stroke='#999'/>`;
      if(name==="H") s=`<rect x='${fx}' y='${y}' width='${fw/2}' height='${h}' fill='#fff' stroke='#999'/><rect x='${fx+fw/2}' y='${y}' width='${fw/2}' height='${h}' fill='#d62828'/>`;
      if(name==="N"){ for(let r=0;r<4;r++)for(let c=0;c<4;c++) s+=`<rect x='${fx+c*fw/4}' y='${y+r*h/4}' width='${fw/4}' height='${h/4}' fill='${(r+c)%2?"#fff":"#1f5fbf"}'/>`; }
      if(name==="C") ["#1f5fbf","#fff","#d62828","#fff","#1f5fbf"].forEach((c,i)=>s+=`<rect x='${fx}' y='${y+i*h/5}' width='${fw}' height='${h/5}' fill='${c}'/>`);
      return s; };
    if(v==="NC") b+=flag("N",14,66)+flag("C",86,66).replace(/^/,""); else b+=flag(v,fy,fh); }
  else if(k==="s"){ b+=`<rect width='${W}' height='${H}' fill='#f4f7fb'/>`; let x=20; const tot=[...v].reduce((a,c)=>a+(c==="l"?78:30),0); x=(W-tot)/2;
    [...v].forEach(c=>{ const w=c==="l"?64:18; b+=`<rect x='${x}' y='70' width='${w}' height='26' rx='5' fill='#0b2545'/>`; x+=w+(c==="l"?14:12); });
    b+=`<text x='140' y='140' font-size='14' text-anchor='middle' fill='#4f6576'>kurz ≈ 1 s · lang = 4–6 s</text>`; }
  return `<svg viewBox='0 0 ${W} ${H}' width='100%' style='max-width:340px;display:block;margin:10px auto;border-radius:12px' role='img' aria-label='Bild zur Frage'>${b}</svg>`;
}

    <div class="row" style="margin-top:10px"><button class="btn ghost" id="startOral">🎤 Prüfer-Modus: mündliche Fragen laut beantworten</button></div>
    <p class="lbl" style="margin-top:14px">${Object.values(known).filter(Boolean).length} von ${DATA.q.length} als gewusst markiert</p>
    <button class="btn ghost" id="reset">Fortschritt zurücksetzen</button>`;
  const getCat = bindPicker("cp");
  const start = onlyNew => {
    const k = store.get("known", {});
    deck = shuffle(DATA.q.filter(q => (!getCat() || q.c === getCat()) && (!onlyNew || !k[q.id])));
    di = 0; deck.length ? renderCard() : (view.innerHTML = `<h2>Alles gewusst! 🎉</h2><p>In diesem Thema hast du alle Karten. Wechsle zum Quiz.</p><button class="btn" onclick="go('quiz')">Zum Quiz</button>`);
  };
  $("#startAll").onclick = () => start(false);
  $("#startNew").onclick = () => start(true);
  $("#startOral").onclick = () => { deck = shuffle(DATA.q.filter(q => q.c === "Mündliche Prüfung")); di = 0; renderCard(); };
  $("#reset").onclick = e => { if (e.target.dataset.sure) { store.set("known", {}); renderCardsStart(); } else { e.target.dataset.sure = 1; e.target.textContent = "Wirklich zurücksetzen? Nochmal tippen"; } };
}
function renderCard(){
  const q = deck[di];
  view.innerHTML = `<p class="lbl" style="margin-top:16px">${esc(q.c)} · Karte ${di+1} / ${deck.length}</p>
    <div class="bar"><i style="width:${di/deck.length*100}%"></i></div>
    <div class="card" id="card" role="button" tabindex="0" aria-label="Karte umdrehen">
      <div class="card-in">
        <div class="face">${q.p?pic(q.p):""}<div class="q">${esc(q.q)}</div><div class="hint">Antippen zum Umdrehen</div></div>
        <div class="face back"><div class="a" style="${q.a.length>90?'font-size:18px;line-height:1.35':''}">${esc(q.a)}</div>${q.e?`<div class="e">${esc(q.e)}</div>`:""}<div class="hint">Wusstest du es?</div></div>
      </div>
    </div>
    <div class="row"><button class="btn no" id="again">Nochmal</button><button class="btn ok" id="knew">Gewusst</button></div>`;
  const card = $("#card");
  const flip = () => card.classList.toggle("flip");
  card.onclick = flip; card.onkeydown = e => { if (e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); } };
  const next = ok => {
    const k = store.get("known", {}); k[q.id] = ok; store.set("known", k);
    if (!ok) deck.push(q);
    di++; di < deck.length ? renderCard() : (view.innerHTML = `<h2>Stapel durch ✔</h2><p>Stark. Jetzt das Quiz probieren – das ist näher an der Prüfung.</p><div class="row"><button class="btn ghost" id="more">Neuer Stapel</button><button class="btn" id="tq">Zum Quiz</button></div>`, $("#more").onclick=renderCardsStart, $("#tq").onclick=()=>go("quiz"));
  };
  $("#again").onclick = () => next(false);
  $("#knew").onclick = () => next(true);
}

/* ---------- QUIZ ---------- */
let qz = [], qi = 0, qright = 0, qwrong = [];
function renderQuizStart(){
  $("#hdrInfo").textContent = "Quiz";
  const miss = store.get("miss", []);
  view.innerHTML = `<h2>Quiz</h2>
    <p>Multiple Choice mit Erklärung. In der echten Prüfung musst du frei antworten, also erst im Kopf antworten und dann tippen.</p>
    <span class="lbl">Thema</span>${catPicker("qp")}
    <span class="lbl">Anzahl</span>
    <div class="chips" id="np"><button data-n="10" aria-pressed="true">10</button><button data-n="20" aria-pressed="false">20</button><button data-n="999" aria-pressed="false">Alle</button></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="qs">Quiz starten</button></div>
    ${miss.length ? `<div class="row" style="margin-top:10px"><button class="btn ghost" id="qm">Meine Fehler wiederholen (${miss.length})</button></div>` : ""}
    <div class="stats" style="margin-top:18px"><div class="stat"><b>${store.get("best",0)}%</b><span class="lbl">Bestes Ergebnis</span></div><div class="stat"><b>${store.get("runs",0)}</b><span class="lbl">Durchgänge</span></div></div>`;
  const getCat = bindPicker("qp");
  let n = 10;
  view.querySelectorAll("#np button").forEach(b => b.onclick = () => { n = +b.dataset.n; view.querySelectorAll("#np button").forEach(x => x.setAttribute("aria-pressed", x===b)); });
  $("#qs").onclick = () => startQuiz(shuffle(DATA.q.filter(q => q.w.length >= 3 && (!getCat() || q.c === getCat()))).slice(0, n));
  $("#qm") && ($("#qm").onclick = () => startQuiz(shuffle(DATA.q.filter(q => miss.includes(q.id)))));
}
function startQuiz(list){ if(!list.length){ view.innerHTML = `<h2>Quiz</h2><p>Zu diesem Thema gibt es keine Auswahl-Fragen. Die mündlichen Prüfungsfragen übst du unter <b>Karten → Prüfer-Modus</b>.</p><button class="btn" id="bk">Zurück</button>`; $("#bk").onclick=renderQuizStart; return; } qz = list; qi = 0; qright = 0; qwrong = []; renderQ(); }
function renderQ(){
  const q = qz[qi];
  const opts = shuffle([q.a, ...q.w]);
  view.innerHTML = `<p class="lbl" style="margin-top:16px">${esc(q.c)} · Frage ${qi+1} / ${qz.length} · ${qright} richtig</p>
    <div class="bar"><i style="width:${qi/qz.length*100}%"></i></div>
    ${q.p?pic(q.p):""}<p class="qtext">${esc(q.q)}</p>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-o="${i}">${esc(o)}</button>`).join("")}</div>
    <div id="after"></div>`;
  view.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (view.querySelector(".opt.right")) return;
    const ok = opts[+b.dataset.o] === q.a;
    view.querySelectorAll(".opt").forEach(x => { if (opts[+x.dataset.o] === q.a) x.classList.add("right"); x.disabled = true; });
    if (!ok) { b.classList.add("wrong"); qwrong.push(q.id); } else qright++;
    const miss = new Set(store.get("miss", [])); ok ? miss.delete(q.id) : miss.add(q.id); store.set("miss", [...miss]);
    $("#after").innerHTML = `<div class="fb"><b>${ok ? "Richtig." : "Falsch. Richtig ist: " + esc(q.a)}</b>${q.e ? "<br>" + esc(q.e) : ""}</div>
      <button class="btn" id="nx" style="width:100%">${qi < qz.length-1 ? "Nächste Frage →" : "Ergebnis anzeigen"}</button>`;
    $("#nx").onclick = () => { qi++; qi < qz.length ? renderQ() : renderResult(); };
    $("#nx").scrollIntoView({block:"nearest", behavior:"smooth"});
  });
}
function renderResult(){
  const pct = Math.round(qright / qz.length * 100);
  store.set("runs", store.get("runs",0) + 1);
  if (pct > store.get("best",0)) store.set("best", pct);
  const verdict = pct >= 90 ? "Prüfungsreif in diesem Bereich." : pct >= 70 ? "Gut. Die Fehler noch einmal anschauen." : "Noch üben: Kapitel lesen, dann nochmal.";
  view.innerHTML = `<p class="lbl" style="margin-top:20px">Ergebnis</p>
    <div class="score" style="color:${pct>=70?'var(--stbd)':'var(--port)'}">${pct}%</div>
    <p><b>${qright} von ${qz.length}</b> richtig. ${verdict}</p>
    ${qwrong.length ? `<h3>Falsch beantwortet</h3><div class="tw"><table><tr><th>Frage</th><th>Richtig</th></tr>${qwrong.map(id=>{const q=DATA.q[id];return `<tr><td>${esc(q.q)}</td><td><b>${esc(q.a)}</b></td></tr>`}).join("")}</table></div>` : ""}
    <div class="row" style="margin-top:16px"><button class="btn ghost" id="b1">Neues Quiz</button>${qwrong.length?`<button class="btn" id="b2">Fehler wiederholen</button>`:""}</div>`;
  $("#b1").onclick = renderQuizStart;
  $("#b2") && ($("#b2").onclick = () => startQuiz(shuffle(qwrong.map(id => DATA.q[id]))));
}

/* ---------- Fachbegriffe antippbar ---------- */
const GL = (DATA.g || []).flatMap(g => [g.t, ...g.a].map(n => ({n, g})));
GL.sort((a,b) => b.n.length - a.n.length);
const L = "A-Za-zÄÖÜäöüßčćšžđČĆŠŽĐ";
function markTerms(root){
  const used = new Set();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n =>
    n.parentElement.closest("h2,figure,pre,code,a,button,.chips,.pager,.co-t,.term") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes){
    let text = node.nodeValue, hit = null;
    for (const item of GL){
      if (used.has(item.g.t)) continue;
      const re = new RegExp(`(^|[^${L}])(${item.n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})(?=$|[^${L}])`);
      const m = re.exec(text);
      if (m && (!hit || m.index < hit.i)) hit = { i: m.index + m[1].length, len: m[2].length, item };
    }
    if (!hit) continue;
    used.add(hit.item.g.t);
    const after = node.splitText(hit.i); const rest = after.splitText(hit.len);
    const b = document.createElement("button"); b.className = "term"; b.type = "button"; b.textContent = after.nodeValue;
    b.onclick = e => { e.stopPropagation(); showTerm(hit.item.g); };
    after.replaceWith(b);
    nodes.push(rest);
  }
}
function showTerm(g){
  document.querySelector(".sheet")?.remove();
  const s = document.createElement("div"); s.className = "sheet"; s.setAttribute("role","dialog");
  s.innerHTML = `<p class="lbl">Was heißt das?</p><div class="st">${esc(g.t)}</div><p>${esc(g.e)}</p><button class="btn" style="width:100%">Verstanden</button>`;
  s.querySelector("button").onclick = () => s.remove();
  document.body.appendChild(s);
}
document.addEventListener("click", e => { const s = document.querySelector(".sheet"); if (s && !s.contains(e.target)) s.remove(); });

go("lernen");
</script>
