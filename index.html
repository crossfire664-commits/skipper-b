l_markers_at_Marsden_Point_NZ_%2820047235141%29.jpg/500px-Left_and_right_channel_markers_at_Marsden_Point_NZ_%2820047235141%29.jpg\" alt=\"Lateral: grün mit Spitze = Steuerbord, rot mit flachem Kopf = Backbord (beim Einlaufen)\" loading=\"lazy\" referrerpolicy=\"no-referrer\" style=\"aspect-ratio:4/3;object-fit:contain;background:#eef3f7\"><figcaption style=\"text-align:left;font-family:inherit;font-size:13px;color:#24384a;line-height:1.35\"><b>Lateral<\/b>: grün mit Spitze = Steuerbord, rot mit flachem Kopf = Backbord (beim Einlaufen)<br><span style=\"font-size:10.5px;color:#6b7c8c\">Foto: Bernard Spragg, CC0 · Wikimedia Commons<\/span><\/figcaption><\/figure><figure class=\"fig ext\" style=\"margin:0\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5b/Lateral_marks.jpg/500px-Lateral_marks.jpg\" alt=\"Lateral als Stangen: an Felsküsten oft nur rote und grüne Stangen statt Tonnen\" loading=\"lazy\" referrerpolicy=\"no-referrer\" style=\"aspect-ratio:4/3;object-fit:contain;background:#eef3f7\"><figcaption style=\"text-align:left;font-family:inherit;font-size:13px;color:#24384a;line-height:1.35\"><b>Lateral als Stangen<\/b>: an Felsküsten oft nur rote und grüne Stangen statt Tonnen<br><span style=\"font-size:10.5px;color:#6b7c8c\">Foto: Esquilo, CC BY-SA 3.0 · Wikimedia Commons<\/span><\/figcaption><\/figure><figure class=\"fig ext\" style=\"margin:0\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e0/Limfjord_safe_water_mark.jpg/500px-Limfjord_safe_water_mark.jpg\" alt=\"Sicheres Wasser: rot-weiß senkrecht gestreift, oben roter Ball\" loading=\"lazy\" referrerpolicy=\"no-referrer\" style=\"aspect-ratio:4/3;object-fit:contain;background:#eef3f7\"><figcaption style=\"text-align:left;font-family:inherit;font-size:13px;color:#24384a;line-height:1.35\"><b>Sicheres Wasser<\/b>: rot-weiß senkrecht gestreift, oben roter Ball<br><span style=\"font-size:10.5px;color:#6b7c8c\">Foto: Paul Fox, CC BY-SA 2.0 · Wikimedia Commons<\/span><\/figcaption><\/figure><figure class=\"fig ext\" style=\"margin:0\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f9/Bou%C3%A9e_jaune_Lac_de_Garde_Italie.JPG/500px-Bou%C3%A9e_jaune_Lac_de_Garde_Italie.JPG\" alt=\"Sonderzeichen: ganz gelb, oben gelbes X (z. B. Badezone, Sperrgebiet)\" loading=\"lazy\" referrerpolicy=\"no-referrer\" style=\"aspect-ratio:4/3;object-fit:contain;background:#eef3f7\"><figcaption style=\"text-align:left;font-family:inherit;font-size:13px;color:#24384a;line-height:1.35\"><b>Sonderzeichen<\/b>: ganz gelb, oben gelbes X (z. B. Badezone, Sperrgebiet)<br><span style=\"font-size:10.5px;color:#6b7c8c\">Foto: Xavier Caré, CC BY-SA 3.0 · Wikimedia Commons<\/span><\/figcaption><\/figure><\/div>\n\n<div class=\"co co-tip\"><div class=\"co-t\">Praxis-Tipp für Neulinge<\/div><ul>\n<li>Nicht jede Gefahr ist mit einer Tonne markiert. In Kroatien gibt es viele kleine Felsen <strong>ohne<\/strong> Zeichen. Die stehen nur in der Seekarte (siehe <a href=\"#\" data-ch=\"06\">Navigation &amp; Seekarte<\/a>).<\/li>\n<li><strong>Fischerbojen<\/strong> (kleine Bojen mit Fähnchen, oft orange oder schwarz) sieht man ständig. Nie dazwischen durchfahren, sonst kommt das Netz in die Schraube.<\/li>\n<li>In Buchten mit gelben Bojen-Ketten ist eine Badezone. Langsam und außen herum fahren.<\/li>\n<\/ul><\/div>\n\n<h2>Weitere Zeichen<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Zeichen<\/th>\n<th>Aussehen<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Einzelgefahr<\/td>\n<td>schwarz-rot-schwarz, 2 schwarze Bälle, weiß Fl(2)<\/td>\n<td>Gefahr <strong>direkt unter<\/strong> dem Zeichen, z. B. ein Felsen. Rundum befahrbar, aber Abstand halten<\/td>\n<\/tr>\n<tr>\n<td>Ansteuerung / sicheres Wasser<\/td>\n<td>rot-weiß senkrecht gestreift, 1 roter Ball<\/td>\n<td>Rundum sicheres Wasser, z. B. Fahrwassermitte oder Hafenansteuerung<\/td>\n<\/tr>\n<tr>\n<td>Sonderzeichen<\/td>\n<td>gelb, gelbes X<\/td>\n<td>Sperrgebiet, Badezone, Kabel, Messboje<\/td>\n<\/tr>\n<tr>\n<td>Neue Gefahr / Wrack<\/td>\n<td>blau-gelb senkrecht, gelbes Kreuz<\/td>\n<td>frisch gesunkenes Wrack, noch nicht in der Karte<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Feuerkennungen – so liest du sie in der Karte<\/h2>\n<p><code>Fl(3) G 10s 8m 5M<\/code> heißt:<\/p>\n<ul>\n<li><strong>Fl(3)<\/strong> = Gruppe aus 3 Blitzen<\/li>\n<li><strong>G<\/strong> = grün (R = rot, W oder ohne Angabe = weiß, Y = gelb)<\/li>\n<li><strong>10s<\/strong> = Wiederkehr alle 10 Sekunden<\/li>\n<li><strong>8m<\/strong> = Feuerhöhe 8 m über dem Wasser<\/li>\n<li><strong>5M<\/strong> = <strong>Tragweite 5 Seemeilen<\/strong><\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Kürzel<\/th>\n<th>Name<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>F<\/td>\n<td>Festfeuer<\/td>\n<td>brennt dauernd<\/td>\n<\/tr>\n<tr>\n<td>Fl<\/td>\n<td>Blitz<\/td>\n<td>hell <strong>kürzer<\/strong> als dunkel<\/td>\n<\/tr>\n<tr>\n<td>LFl<\/td>\n<td>langer Blitz<\/td>\n<td>Blitz mindestens 2 s<\/td>\n<\/tr>\n<tr>\n<td>Oc<\/td>\n<td>unterbrochen<\/td>\n<td>hell <strong>länger<\/strong> als dunkel<\/td>\n<\/tr>\n<tr>\n<td>Iso<\/td>\n<td>Gleichtakt<\/td>\n<td>hell = dunkel<\/td>\n<\/tr>\n<tr>\n<td>Q / VQ<\/td>\n<td>Funkel / schnelles Funkel<\/td>\n<td>50–60 bzw. 100–120 pro Minute<\/td>\n<\/tr>\n<tr>\n<td>Mo(A)<\/td>\n<td>Morse A<\/td>\n<td>· –<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage (AC Nautik)<\/div><p>Ein Leuchtfeuer hat eine Tragweite von 3 sm. Siehst du es aus 5 sm Entfernung?\n→ <strong>Nein.<\/strong> Die Tragweite ist die Grenze, ab der das Feuer sichtbar ist.<\/p><\/div>"},{"n":"04","t":"Schall- und Notsignale","h":"<div class=\"co co-abstract\"><div class=\"co-t\">Worum geht&#x27;s überhaupt? (Erklärung für Einsteiger)<\/div><p>Boote „hupen“ sich an, aber mit festen Bedeutungen. Ein Signal heißt zum Beispiel „Ich drehe nach rechts“, ein anderes „Ich fahre rückwärts“.\nBei <strong>Nebel<\/strong> gibt jedes Boot regelmäßig Töne ab, damit die anderen wissen, dass es da ist.\n<strong>Notsignale<\/strong> (rote Fackel, Rakete, oranger Rauch) setzt du nur ein, wenn Menschen in Gefahr sind.<\/p>\n<p>Unbekannte Wörter? → 00a Bootssprache – Grundbegriffe<\/p><\/div>\n\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 580' width='940' height='580' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='940' height='580' fill='%23ffffff'/%3E%3Ctext x='470.0' y='40' font-size='22' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ESchallsignale %E2%80%93 kurz = ca. 1 s %C2%B7 lang = 4%E2%80%936 s%3C/text%3E%3Ctext x='30' y='106' font-size='15' fill='%230b2545' text-anchor='start' font-weight='bold'%3EMAN%C3%96VERSIGNALE (Sichtweite)%3C/text%3E%3Crect x='20' y='124' width='900' height='36' fill='%23eef3fa'/%3E%3Ctext x='30' y='148' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EIch %C3%A4ndere Kurs nach Steuerbord%3C/text%3E%3Crect x='560' y='136' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Ctext x='910' y='148' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3E1 kurz%3C/text%3E%3Ctext x='30' y='188' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EIch %C3%A4ndere Kurs nach Backbord%3C/text%3E%3Crect x='560' y='176' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='582' y='176' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Ctext x='910' y='188' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3E2 kurz%3C/text%3E%3Crect x='20' y='204' width='900' height='36' fill='%23eef3fa'/%3E%3Ctext x='30' y='228' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EMeine Maschine geht r%C3%BCckw%C3%A4rts%3C/text%3E%3Crect x='560' y='216' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='582' y='216' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='604' y='216' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Ctext x='910' y='228' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3E3 kurz%3C/text%3E%3Ctext x='30' y='268' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EZweifel / Warnung: %E2%80%9EWas machst du%3F%21%E2%80%9C%3C/text%3E%3Crect x='560' y='256' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='582' y='256' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='604' y='256' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='626' y='256' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='648' y='256' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Ctext x='910' y='268' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3Emind. 5 kurz%3C/text%3E%3Crect x='20' y='284' width='900' height='36' fill='%23eef3fa'/%3E%3Ctext x='30' y='308' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EAnn%C3%A4herung an un%C3%BCbersichtliche Biegung im Fahrwasser%3C/text%3E%3Crect x='560' y='296' width='56' height='14' rx='3' fill='%230b2545'/%3E%3Ctext x='910' y='308' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3E1 lang%3C/text%3E%3Ctext x='30' y='346' font-size='15' fill='%230b2545' text-anchor='start' font-weight='bold'%3ENEBELSIGNALE (alle 2 Minuten)%3C/text%3E%3Crect x='20' y='364' width='900' height='36' fill='%23eef3fa'/%3E%3Ctext x='30' y='388' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EMaschinenfahrzeug mit Fahrt durchs Wasser%3C/text%3E%3Crect x='560' y='376' width='56' height='14' rx='3' fill='%230b2545'/%3E%3Ctext x='910' y='388' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3E1 lang%3C/text%3E%3Ctext x='30' y='428' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EMaschinenfahrzeug gestoppt, ohne Fahrt%3C/text%3E%3Crect x='560' y='416' width='56' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='642' y='416' width='56' height='14' rx='3' fill='%230b2545'/%3E%3Ctext x='910' y='428' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3E2 lang%3C/text%3E%3Crect x='20' y='444' width='900' height='36' fill='%23eef3fa'/%3E%3Ctext x='30' y='468' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3ESegler, Fischer, NUC, RAM, CBD, Schlepper%3C/text%3E%3Crect x='560' y='456' width='56' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='624' y='456' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='646' y='456' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Ctext x='910' y='468' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3Elang-kurz-kurz%3C/text%3E%3Ctext x='30' y='508' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EVor Anker (jede Minute)%3C/text%3E%3Ctext x='910' y='508' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3E5 s Glocke l%C3%A4uten%3C/text%3E%3Ctext x='30' y='546' font-size='13' fill='%23d62828' text-anchor='start' font-weight='bold'%3EBoote %26lt; 12 m: m%C3%BCssen nicht die obigen Signale geben %E2%80%93 aber irgendein Schallsignal alle 2 Min.%3C/text%3E%3C/svg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<h2>Manöversignale – Merkhilfe<\/h2>\n<ul>\n<li><strong>1 kurz<\/strong> = Steuerbord. Das Wort hat <strong>1<\/strong> „S“ am Anfang<\/li>\n<li><strong>2 kurz<\/strong> = Backbord<\/li>\n<li><strong>3 kurz<\/strong> = Maschine rückwärts<\/li>\n<li><strong>5 kurz<\/strong> (oder mehr) = „Ich verstehe deine Absicht nicht / Achtung!“<\/li>\n<\/ul>\n<h2>Nebel (alle 2 Minuten)<\/h2>\n<ul>\n<li>Motorboot <strong>mit Fahrt<\/strong>: 1 lang<\/li>\n<li>Motorboot <strong>gestoppt<\/strong> (treibt): 2 lang<\/li>\n<li>Alles, was „mehr Rechte“ hat (Segler, Fischer, NUC, RAM, CBD, Schlepper): <strong>lang-kurz-kurz<\/strong> (– · ·)<\/li>\n<li>Ankerlieger: jede Minute 5 s die Glocke läuten<\/li>\n<li>Boote <strong>unter 12 m<\/strong> müssen diese Signale nicht geben, aber <strong>irgendein<\/strong> kräftiges Schallsignal alle 2 Minuten<\/li>\n<\/ul>\n<h2>Seenotsignale<\/h2>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 560' width='940' height='560' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='940' height='560' fill='%23ffffff'/%3E%3Ctext x='470.0' y='40' font-size='22' fill='%23d62828' text-anchor='middle' font-weight='bold'%3ESeenotsignale %E2%80%93 das bedeutet: %E2%80%9EIch bin in Not, brauche Hilfe%21%E2%80%9C%3C/text%3E%3Crect x='30' y='70' width='280' height='130' rx='12' fill='%23fff1f1' stroke='%23f2b8b8'/%3E%3Ctext x='170' y='118' font-size='30' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3E%F0%9F%9A%80%3C/text%3E%3Ctext x='170' y='158' font-size='16' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3ERote Fallschirm-Rakete%3C/text%3E%3Ctext x='170' y='180' font-size='13' fill='%23444' text-anchor='middle' font-weight='normal'%3Eoder rote Handfackel%3C/text%3E%3Crect x='330' y='70' width='280' height='130' rx='12' fill='%23fff1f1' stroke='%23f2b8b8'/%3E%3Ctext x='470' y='118' font-size='30' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3E%F0%9F%9F%A7%3C/text%3E%3Ctext x='470' y='158' font-size='16' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EOranger Rauch%3C/text%3E%3Ctext x='470' y='180' font-size='13' fill='%23444' text-anchor='middle' font-weight='normal'%3ERauchsignal (Tag)%3C/text%3E%3Crect x='630' y='70' width='280' height='130' rx='12' fill='%23fff1f1' stroke='%23f2b8b8'/%3E%3Ctext x='770' y='118' font-size='30' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3E%F0%9F%93%BB%3C/text%3E%3Ctext x='770' y='158' font-size='16' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EMAYDAY %C3%BCber Funk%3C/text%3E%3Ctext x='770' y='180' font-size='13' ht='normal'%3EFlaggensignal%3C/text%3E%3Crect x='330' y='370' width='280' height='130' rx='12' fill='%23fff1f1' stroke='%23f2b8b8'/%3E%3Ctext x='470' y='418' font-size='30' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3E%F0%9F%94%A5%3C/text%3E%3Ctext x='470' y='458' font-size='16' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EFlammen an Bord%3C/text%3E%3Ctext x='470' y='480' font-size='13' fill='%23444' text-anchor='middle' font-weight='normal'%3Ez. B. brennendes %C3%96l-Fass%3C/text%3E%3Crect x='630' y='370' width='280' height='130' rx='12' fill='%23fff1f1' stroke='%23f2b8b8'/%3E%3Ctext x='770' y='418' font-size='30' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3E%F0%9F%93%A1%3C/text%3E%3Ctext x='770' y='458' font-size='16' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EEPIRB / PLB%3C/text%3E%3Ctext x='770' y='480' font-size='13' fill='%23444' text-anchor='middle' font-weight='normal'%3ESatelliten-Notfunkbake%3C/text%3E%3Ctext x='470.0' y='540' font-size='16' fill='%230b2545' text-anchor='middle' font-weight='bold'%3EKroatien: Seenotleitstelle MRCC Rijeka %C2%B7 Tel. 195 (oder 112) %C2%B7 UKW Kanal 16%3C/text%3E%3C/svg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<p><strong>Wichtig für die Prüfung:<\/strong><\/p>\n<ul>\n<li>Rote Rakete oder Handfackel, oranger Rauch, SOS, MAYDAY, Arme heben und senken, Flaggen <strong>N über C<\/strong>, Dauerton<\/li>\n<li><strong>Nicht<\/strong> verwechseln: <strong>Flagge A<\/strong> (weiß-blau) heißt „Taucher unten – Abstand halten, langsam fahren“. Das ist <strong>kein<\/strong> Notsignal<\/li>\n<li><strong>Gelbe Flagge Q<\/strong> heißt „Gesund, ich bitte um freie Verkehrserlaubnis“ (Zoll und Einklarierung)<\/li>\n<li>Pyrotechnik <strong>nur im echten Notfall<\/strong> zünden, und erst dann, wenn jemand in Sichtweite ist<\/li>\n<\/ul>\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage<\/div><p>Was bedeutet ein Schallsignal <strong>lang-kurz-kurz<\/strong> im Nebel?\n→ Ein Fahrzeug mit Vorrang (Segler, Fischer, NUC, RAM, CBD oder Schlepper) ist in der Nähe.<\/p><\/div>"},{"n":"05","t":"UKW-Funk","h":"<div class=\"co co-abstract\"><div class=\"co-t\">Worum geht&#x27;s überhaupt? (Erklärung für Einsteiger)<\/div><p>An Bord gibt es ein <strong>Seefunkgerät (UKW/VHF)<\/strong>. Es funktioniert wie ein Walkie-Talkie: Alle in der Nähe hören mit, auch die Küstenwache.<\/p>\n<ul>\n<li><strong>Kanal 16<\/strong> ist der Notruf- und Anrufkanal.<\/li>\n<li>In der Prüfung musst du vor allem einen <strong>Notruf (MAYDAY)<\/strong> richtig aufsagen können: wer du bist, wo du bist, was passiert ist.<\/li>\n<li>Ohne Funk gilt in Kroatien die Notrufnummer <strong>195<\/strong>.<\/li>\n<\/ul>\n<p>Unbekannte Wörter? → 00a Bootssprache – Grundbegriffe<\/p><\/div>\n\n<h2>Kanäle, die du kennen musst<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Kanal<\/th>\n<th>Wofür<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>16<\/strong><\/td>\n<td><strong>Not-, Dringlichkeits- und Anrufkanal.<\/strong> Immer mithören. Nach dem Anruf auf einen Arbeitskanal wechseln<\/td>\n<\/tr>\n<tr>\n<td><strong>70<\/strong><\/td>\n<td><strong>Nur DSC<\/strong> (digitaler Selektivruf), <strong>kein Sprechfunk<\/strong><\/td>\n<\/tr>\n<tr>\n<td>06, 08, 72, 77<\/td>\n<td>Schiff-zu-Schiff<\/td>\n<\/tr>\n<tr>\n<td>Marinas<\/td>\n<td>meist Kanal 17, steht im Hafenhandbuch<\/td>\n<\/tr>\n<tr>\n<td>Küstenfunkstellen<\/td>\n<td>Rijeka Radio, Split Radio, Dubrovnik Radio, rund um die Uhr. Wetterberichte zu festen Zeiten<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Die 3 Dringlichkeitsstufen<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Wort<\/th>\n<th>Wann<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>MAYDAY<\/strong><\/td>\n<td><strong>Unmittelbare Lebensgefahr<\/strong> für Menschen oder Schiff<\/td>\n<td>Feuer, Sinken, Mann über Bord<\/td>\n<\/tr>\n<tr>\n<td><strong>PAN PAN<\/strong><\/td>\n<td>Dringend, aber <strong>keine unmittelbare Lebensgefahr<\/strong><\/td>\n<td>Motorausfall bei auflandigem Wind, verletzte Person<\/td>\n<\/tr>\n<tr>\n<td><strong>SÉCURITÉ<\/strong><\/td>\n<td>Sicherheitsmeldung<\/td>\n<td>Treibgut, Sturmwarnung, ausgefallenes Leuchtfeuer<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>MAYDAY-Meldung – auswendig lernen!<\/h2>\n<p><strong>Merkhilfe:<\/strong> <em>„MMM – WER – WO – WAS – WIE VIELE – OVER“<\/em>\nVorher, falls vorhanden: <strong>DSC-Notknopf<\/strong> (rot) 5 Sekunden drücken.<\/p>\n<pre><code>MAYDAY MAYDAY MAYDAY\nTHIS IS  &lt;Bootsname&gt; &lt;Bootsname&gt; &lt;Bootsname&gt;\n         &lt;Rufzeichen&gt;  MMSI &lt;Nummer&gt;\nMAYDAY  &lt;Bootsname&gt;  &lt;Rufzeichen&gt;\nMY POSITION IS  43°30' N  016°26' E   (oder: 2 sm südlich Hvar)\nI AM ON FIRE / SINKING / MAN OVERBOARD   (was ist passiert)\nI REQUIRE IMMEDIATE ASSISTANCE\n4 PERSONS ON BOARD\n(weitere Infos: Rettungsinsel klar, Rettungswesten an …)\nOVER\n<\/code><\/pre>\n<ul>\n<li><strong>MAYDAY RELAY<\/strong>: wenn du die Notmeldung eines <strong>anderen<\/strong> weitergibst, z. B. weil er außer Reichweite ist<\/li>\n<li><strong>SEELONCE MAYDAY<\/strong>: Funkstille, nur noch Notverkehr auf Kanal 16<\/li>\n<li><strong>SEELONCE FEENEE<\/strong>: Der Notverkehr ist beendet<\/li>\n<li><strong>OVER<\/strong> = „Ich warte auf Antwort“ · <strong>OUT<\/strong> = „Gespräch beendet“ (nie beides zusammen)<\/li>\n<\/ul>\n<h2>Funk-ABC (Buchstabieralphabet) ⭐ wird gern abgefragt<\/h2>\n<p>Im Funk rauscht es, und „B“, „D“ und „P“ klingen gleich. Deshalb buchstabiert man mit festen Wörtern, weltweit gleich und auf Englisch ausgesprochen. Den Bootsnamen und das Rufzeichen musst du so buchstabieren können.<\/p>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%201000%20738'%20width%3D'1000'%20height%3D'738'%20font-family%3D'Segoe%20UI%2C%20Arial%2C%20sans-serif'%3E%3Crec le'%20font-weight%3D'bold'%3E8%3C%2Ftext%3E%3Ctext%20x%3D'711'%20y%3D'623'%20font-size%3D'18'%20fill%3D'%231a1a1a'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3EAIT%3C%2Ftext%3E%3Crect%20x%3D'794'%20y%3D'590'%20width%3D'183'%20height%3D'52'%20rx%3D'8'%20fill%3D'%23fff5d6'%2F%3E%3Ctext%20x%3D'824'%20y%3D'625'%20font-size%3D'26'%20fill%3D'%230b2545'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3E9%3C%2Ftext%3E%3Ctext%20x%3D'904'%20y%3D'623'%20font-size%3D'18'%20fill%3D'%231a1a1a'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3ENIN-ER%3C%2Ftext%3E%3Ctext%20x%3D'500.0'%20y%3D'678'%20font-size%3D'15'%20fill%3D'%23333'%20text-anchor%3D'middle'%20font-weight%3D'normal'%3EBeispiel%3A%20Position%2043%C2%B030'%20%E2%86%92%20%E2%80%9EFOW-ER%20TREE%20DEGREES%2C%20TREE%20ZE-RO%20MINUTES%20NORTH%E2%80%9C%3C%2Ftext%3E%3Ctext%20x%3D'500.0'%20y%3D'703'%20font-size%3D'15'%20fill%3D'%23333'%20text-anchor%3D'middle'%20font-weight%3D'normal'%3EBootsname%20%E2%80%9EMare%E2%80%9C%20buchstabiert%3A%20MIKE%20%E2%80%93%20ALFA%20%E2%80%93%20ROMEO%20%E2%80%93%20ECHO%3C%2Ftext%3E%3C%2Fsvg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<p><strong>Übung:<\/strong> Buchstabiere deinen Vornamen, den Bootsnamen und dein Autokennzeichen laut, jeden Tag 2 Minuten. In der App gibt es das Funk-ABC auch als Karteikarten (Thema „Funk-ABC“).<\/p>\n<ul>\n<li>Beispiel Gernot: <strong>G<\/strong>olf · <strong>E<\/strong>cho · <strong>R<\/strong>omeo · <strong>N<\/strong>ovember · <strong>O<\/strong>scar · <strong>T<\/strong>ango<\/li>\n<li><strong>Zahlen<\/strong> sprichst du einzeln: 16 = „WUN SIX“. Für Kanal 16 sagst du „channel one-six“<\/li>\n<\/ul>\n<h2>Kroatien<\/h2>\n<ul>\n<li>Seenotleitstelle <strong>MRCC Rijeka<\/strong>: Telefon <strong>195<\/strong> (oder 112), Funk Kanal 16<\/li>\n<li>In italienischen Gewässern: Küstenwache Tel. <strong>1530<\/strong><\/li>\n<li>Die UKW-Berechtigung im Skipper B gilt <strong>nur in kroatischen Gewässern<\/strong><\/li>\n<\/ul>\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage (AC Nautik)<\/div><p>Ein Crewmitglied geht über Bord. Wie setzt du den Notruf ab?\n→ Kanal 16, „MAYDAY MAYDAY MAYDAY, this is …“, Bootsname, Position, „man overboard“, Hilfe anfordern, Personen an Bord, „over“.<\/p><\/div>"},{"n":"06","t":"Navigation & Seekarte","h":"<div class=\"co co-abstract\"><div class=\"co-t\">Worum geht&#x27;s überhaupt? (Erklärung für Einsteiger)<\/div><p>Eine <strong>Seekarte<\/strong> ist die Landkarte fürs Meer. Sie zeigt nicht Straßen, sondern <strong>Wassertiefen<\/strong>, Felsen, Seezeichen und Häfen.\nIn der Prüfung musst du ein paar Handgriffe können:<\/p>\n<ul>\n<li>eine <strong>Position<\/strong> ablesen, also wo genau ein Punkt liegt (in Grad und Minuten, wie GPS-Koordinaten),<\/li>\n<li>eine <strong>Entfernung<\/strong> messen (in Seemeilen),<\/li>\n<li>einen <strong>Kurs<\/strong> bestimmen (in welche Richtung du fahren musst).<\/li>\n<\/ul>\n<p>Auf See rechnet man in <strong>Seemeilen<\/strong> (1 sm = 1852 m) und <strong>Knoten<\/strong> (1 kn = 1 sm pro Stunde).<\/p>\n<p>Unbekannte Wörter? → 00a Bootssprache – Grundbegriffe<\/p><\/div>\n\n<div class=\"co co-tip\"><div class=\"co-t\">Der praktische Teil der Prüfung<\/div><p>Du bekommst eine Seekarte, Zirkel und Kursdreieck und sollst eine Position ablesen oder eintragen, eine Distanz messen oder einen Kurs bestimmen. <strong>Mindestens 3× an einer echten Karte üben<\/strong> (im Kurs oder mit einer Übungskarte).<\/p><\/div>\n\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 980' width='1000' height='980' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='1000' height='980' fill='%23ffffff'/%3E%3Ctext x='500.0' y='40' font-size='23' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ESeekarte %26amp; Navigation %E2%80%93 die 4 Handgriffe, die immer kommen%3C/text%3E%3Crect x='60' y='90' width='500' 0fill%3D'%23ffffff'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3E11%3C%2Ftext%3E%3Ctext%20x%3D'695'%20y%3D'583'%20font-size%3D'13'%20fill%3D'%230b2545'%20text-anchor%3D'start'%20font-weight%3D'bold'%3EKompassrose%3C%2Ftext%3E%3Ctext%20x%3D'695'%20y%3D'600'%20font-size%3D'12'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3ERichtungen%20und%20Missweisung%20(hier%204%C2%B0%20Ost)%3C%2Ftext%3E%3Ccircle%20cx%3D'675'%20cy%3D'630'%20r%3D'11'%20fill%3D'%230b2545'%2F%3E%3Ctext%20x%3D'675'%20y%3D'635'%20font-size%3D'12'%20fill%3D'%23ffffff'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3E12%3C%2Ftext%3E%3Ctext%20x%3D'695'%20y%3D'630'%20font-size%3D'13'%20fill%3D'%230b2545'%20text-anchor%3D'start'%20font-weight%3D'bold'%3Egestrichelte%20Linie%3C%2Ftext%3E%3Ctext%20x%3D'695'%20y%3D'647'%20font-size%3D'12'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3ETiefenlinie%3A%20verbindet%20gleiche%20Tiefen%20(z.%20B.%2010%20m)%3C%2Ftext%3E%3Ctext%20x%3D'560'%20y%3D'712'%20font-size%3D'14'%20fill%3D'%230b2545'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3EFarben%3A%20gelb%2Fbeige%20%3D%20Land%20%C2%B7%20blau%20%3D%20flach%20(Vorsicht!)%20%C2%B7%20wei%C3%9F%20%3D%20tief%20%C2%B7%20magenta%20%3D%20Lichter%2C%20Kabel%2C%20Ankerpl%C3%A4tze%3C%2Ftext%3E%3Crect%20x%3D'20'%20y%3D'730'%20width%3D'1090'%20height%3D'160'%20rx%3D'12'%20fill%3D'%23fff5d6'%20stroke%3D'%23f0d98a'%2F%3E%3Ctext%20x%3D'40'%20y%3D'760'%20font-size%3D'18'%20fill%3D'%230b2545'%20text-anchor%3D'start'%20font-weight%3D'bold'%3E%F0%9F%92%A1%20Wo%20finde%20ich%20was%3F%3C%2Ftext%3E%3Ctext%20x%3D'48'%20y%3D'790'%20font-size%3D'13.5'%20fill%3D'%231a1a1a'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E%E2%80%A2%20Die%20Seekarte%20liegt%20an%20Bord%20am%20Navigationstisch%20(Kartentisch%2C%20meist%20links%20oder%20rechts%20beim%20Niedergang).%20Auf%20Charteryachten%20gibt%20es%20oft%20einen%20Kartensatz%20der%20Region.%3C%2Ftext%3E%3Ctext%20x%3D'48'%20y%3D'816'%20font-size%3D'13.5'%20fill%3D'%231a1a1a'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E%E2%80%A2%20Kroatische%20Seekarten%20macht%20das%20Hydrografische%20Institut%20(HHI%2C%20Split).%20Alle%20Zeichen%20erkl%C3%A4rt%20das%20Heft%20%E2%80%9EKarte%201%20%2F%20INT%201%E2%80%9C%3A%20das%20%E2%80%9EW%C3%B6rterbuch%E2%80%9C%20der%20Seekarte.%3C%2Ftext%3E%3Ctext%20x%3D'48'%20y%3D'842'%20font-size%3D'13.5'%20fill%3D'%231a1a1a'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E%E2%80%A2%20Kartentitel%2C%20Ma%C3%9Fstab%20und%20%E2%80%9ETiefen%20in%20Metern%E2%80%9C%20stehen%20immer%20am%20Rand%20der%20Karte.%20Die%20Breitenskala%20f%C3%BCr%20Seemeilen%20ist%20der%20linke%20und%20rechte%20Rand.%3C%2Ftext%3E%3Ctext%20x%3D'48'%20y%3D'868'%20font-size%3D'13.5'%20fill%3D'%231a1a1a'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E%E2%80%A2%20Am%20Handy%2FPlotter%20sehen%20die%20Zeichen%20fast%20gleich%20aus.%20Wer%20die%20Papierkarte%20kann%2C%20kann%20auch%20Navionics%20und%20Co.%3C%2Ftext%3E%3C%2Fsvg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<div class=\"co co-tip\"><div class=\"co-t\">Praxis-Tipp für Neulinge<\/div><ul>\n<li>Die <strong>Seekarte liegt am Navigationstisch<\/strong> (Kartentisch, beim Niedergang zur Kajüte). Auf Charteryachten ist oft ein Kartensatz oder ein Revierführer für die Region an Bord.<\/li>\n<li>Alle Zeichen erklärt das Heft <strong>„Karte 1 / INT 1“<\/strong>, das Wörterbuch der Seekarte. Kroatische Karten macht das Hydrografische Institut (HHI) in Split.<\/li>\n<li>Gefahren wie Felsen (+), Wracks und Kabel sind in der Karte oft <strong>winzig<\/strong>. Vor jeder Fahrt die Strecke in der Karte langsam abfahren, mit dem Finger.<\/li>\n<li>Am Plotter oder Handy (z. B. Navionics) sehen die Zeichen fast gleich aus.<\/li>\n<\/ul><\/div>\n\n<h2>Die Grundzahlen<\/h2>\n<ul>\n<li><strong>1 Seemeile (sm, NM) = 1852 m = 1 Bogenminute (1') Breite<\/strong><\/li>\n<li><strong>1 Knoten (kn) = 1 sm pro Stunde<\/strong> ≈ 1,85 km/h<\/li>\n<li>1 Kabellänge = 0,1 sm ≈ 185 m<\/li>\n<li>Die Tiefen auf kroatischen Karten sind in <strong>Metern<\/strong> angegeben<\/li>\n<li><strong>12 sm<\/strong> von der Küste = Grenze der Hoheitsgewässer<\/li>\n<\/ul>\n<h2>Position ablesen<\/h2>\n<ol>\n<li><strong>Breite (Latitude, N)<\/strong>: Waagrechte Linie durch den Punkt, Wert am <strong>senkrechten<\/strong> Kartenrand ablesen<\/li>\n<li><strong>Länge (Longitude, E)<\/strong>: Senkrechte Linie, Wert am <strong>waagrechten<\/strong> Rand ablesen<\/li>\n<li>Immer zuerst die Breite nennen, dann die Länge: <code>43°30,5' N 016°26,0' E<\/code><\/li>\n<li>Kroatien liegt ungefähr bei <strong>42–45,5° N<\/strong> und <strong>13–19,5° E<\/strong><\/li>\n<\/ol>\n<h2>Distanz messen<\/h2>\n<ol>\n<li>Zirkel auf Punkt A und Punkt B setzen<\/li>\n<li>Den Zirkel an die <strong>Breitenskala (seitlich)<\/strong> anlegen, auf <strong>gleicher Höhe<\/strong> wie die Strecke (Mercator-Karte!)<\/li>\n<li>Minuten zählen. <strong>Jede Minute ist eine Seemeile<\/strong><\/li>\n<li>❌ <strong>Nie<\/strong> an der Längenskala oben oder unten messen<\/li>\n<\/ol>\n<h2>Kurs bestimmen<\/h2>\n<ol>\n<li>Kursdreieck an die Linie A→B legen<\/li>\n<li>Parallel zur nächsten Kompassrose schieben oder das Kursdreieck auf einen Meridian legen<\/li>\n<li>Den Kurs in Grad ablesen (000°–360°, dreistellig sprechen: „null-neun-null“)<\/li>\n<\/ol>\n<h2>Kompass-Rechnung<\/h2>\n<p><code>KK + Abl = MgK<\/code> → <code>MgK + Mw = rwK<\/code> (Ost = plus, West = minus)<\/p>\n<ul>\n<li><strong>rwK<\/strong> = rechtweisend, so steht es in der Karte<\/li>\n<li><strong>Mw<\/strong> = Missweisung, steht in der Kompassrose der Karte. In der Adria ca. <strong>4–5° Ost<\/strong><\/li>\n<li><strong>Abl<\/strong> = Ablenkung durch Eisen und Elektrik an Bord (Deviationstabelle)<\/li>\n<li>Von der Karte zum Steuerkompass: rückwärts rechnen<\/li>\n<\/ul>\n<h2>Weg – Zeit – Fahrt<\/h2>\n<ul>\n<li>Weg = Fahrt × Zeit<\/li>\n<li><strong>Beispiel:<\/strong> 12 sm bei 6 kn → 2 h<\/li>\n<li><strong>Minuten-Formel:<\/strong> Weg = Fahrt × Minuten ÷ 60. Also 20 min bei 9 kn = 3 sm<\/li>\n<li><strong>Treibstoff-Drittelregel:<\/strong> ⅓ hin, ⅓ zurück, ⅓ Reserve<\/li>\n<\/ul>\n<h2>Farben und Zeichen der Seekarte<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Was du siehst<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Gelb/beige<\/td>\n<td>Land<\/td>\n<\/tr>\n<tr>\n<td>Grün<\/td>\n<td>trockenfallend (bei Ebbe; in der Adria kaum relevant)<\/td>\n<\/tr>\n<tr>\n<td>Blau<\/td>\n<td><strong>flaches Wasser<\/strong> → Vorsicht. Je dunkler, desto flacher (laut Kursblatt: dunkelblau 0–10 m, hellblau 10–20 m; genaue Grenzen in der Kartenlegende)<\/td>\n<\/tr>\n<tr>\n<td>Weiß<\/td>\n<td>tiefes Wasser<\/td>\n<\/tr>\n<tr>\n<td>Zahl im Wasser (z. B. 12)<\/td>\n<td>Wassertiefe in Metern<\/td>\n<\/tr>\n<tr>\n<td><code>+<\/code> oder <code>*<\/code><\/td>\n<td>Unterwasserfelsen bzw. Felsen, der bei Niedrigwasser sichtbar wird<\/td>\n<\/tr>\n<tr>\n<td>Wrack-Symbol<\/td>\n<td>Wrack (gefährlich oder nicht)<\/td>\n<\/tr>\n<tr>\n<td>Anker-Symbol<\/td>\n<td>Ankerplatz<\/td>\n<\/tr>\n<tr>\n<td>durchgestrichener Anker<\/td>\n<td>Ankerverbot<\/td>\n<\/tr>\n<tr>\n<td>Wellenlinie (rot/magenta)<\/td>\n<td>Unterwasserkabel oder -leitung → <strong>nicht ankern<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Raute (rot/magenta)<\/td>\n<td><strong>Lotsenversetzpunkt<\/strong>: Hier steigen Lotsen auf große Schiffe um<\/td>\n<\/tr>\n<tr>\n<td>Strich-Punkt-Linie (– · – ·)<\/td>\n<td>laut Kursblatt <strong>Peillinie<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Magenta-Tropfen mit Kennung<\/td>\n<td>Leuchtfeuer<\/td>\n<\/tr>\n<tr>\n<td>Buchstaben S, M, R, G …<\/td>\n<td>Grundart: Sand, Schlamm, Fels, Kies → für Ankern wichtig (Sand/Schlamm hält gut)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%201000%201138'%20width%3  Übungskarte im Kurs durchgehen.<\/p><\/div>"},{"n":"07","t":"Wetter Adria","h":"<div class=\"co co-abstract\"><div class=\"co-t\">Worum geht&#x27;s überhaupt? (Erklärung für Einsteiger)<\/div><p>Auf dem Boot entscheidet das Wetter, ob du rausfährst. In der Adria musst du vor allem die <strong>Winde<\/strong> kennen, denn jeder hat einen eigenen Namen und ein eigenes „Verhalten“.<\/p>\n<ul>\n<li>Ein Wind wird immer nach der Richtung benannt, <strong>aus der er kommt<\/strong>. „Nordwind“ bläst also von Norden nach Süden.<\/li>\n<li>Die zwei gefährlichen Winde sind <strong>Bura<\/strong> (kommt plötzlich, starke Böen) und <strong>Jugo<\/strong> (bringt hohe Wellen).<\/li>\n<li>Die <strong>Windstärke<\/strong> misst man in <strong>Beaufort (Bft)<\/strong>, von 0 (Stille) bis 12 (Orkan).<\/li>\n<\/ul>\n<p>Unbekannte Wörter? → 00a Bootssprache – Grundbegriffe<\/p><\/div>\n\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 900' width='900' height='900' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='900' height='900' fill='%23ffffff'/%3E%3Ctext x='450.0' y='40' font-size='22' fill='%230b2545' text-anchor='middle' font-weight='bold'%3EWindrose der Adria %E2%80%93 Namen werden in der Pr%C3%BCfung gefragt%21%3C/text%3E%3Ctext x='450.0' y='64' font-size='14' fill='%23444' text-anchor='middle' font-weight='normal'%3EWind wird immer nach der Richtung benannt, AUS der er kommt%3C/text%3E%3Ccircle cx='450' cy='450' r='120' fill='%23eef3fa' stroke='%239fb3cc' stroke-width='2'/%3E%3Cline x1='450' y1='160' x2='450' y2='322' stroke='%234a6fa5' stroke-width='7'/%3E%3Cpolygon points='450,350 437,323 463,323' fill='%234a6fa5'/%3E%3Ctext x='450' y='396' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3EN%3C/text%3E%3Ctext x='450' y='105' font-size='18' fill='%234a6fa5' text-anchor='middle' font-weight='bold'%3ETRAMONTANA%3C/text%3E%3Ctext x='450' y='123' font-size='12' fill='%2 '450' y='813' font-size='12' fill='%23333' text-anchor='middle' font-weight='normal'%3Ewarm, kurz %26amp; stark%3C/text%3E%3Cline x1='245' y1='655' x2='359' y2='541' stroke='%237f1d1d' stroke-width='7'/%3E%3Cpolygon points='379,521 369,549 351,531' fill='%237f1d1d'/%3E%3Ctext x='408' y='498' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ESW%3C/text%3E%3Ctext x='206' y='694' font-size='18' fill='%237f1d1d' text-anchor='middle' font-weight='bold'%3ELEBI%C4%86 (Garbin)%3C/text%3E%3Ctext x='206' y='712' font-size='12' fill='%23333' text-anchor='middle' font-weight='normal'%3Egef%C3%A4hrlicher Sturmwind, Gewitter%3C/text%3E%3Cline x1='160' y1='450' x2='322' y2='450' stroke='%234a6fa5' stroke-width='7'/%3E%3Cpolygon points='350,450 323,463 323,437' fill='%234a6fa5'/%3E%3Ctext x='390' y='456' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3EW%3C/text%3E%3Ctext x='105' y='450' font-size='18' fill='%234a6fa5' text-anchor='middle' font-weight='bold'%3EPULENAT%3C/text%3E%3Ctext x='105' y='468' font-size='12' fill='%23333' text-anchor='middle' font-weight='normal'%3Ekurz, oft Gewitter%3C/text%3E%3Cline x1='245' y1='245' x2='359' y2='359' stroke='%231b9e3e' stroke-width='7'/%3E%3Cpolygon points='379,379 351,369 369,351' fill='%231b9e3e'/%3E%3Ctext x='408' y='414' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ENW%3C/text%3E%3Ctext x='206' y='206' font-size='18' fill='%231b9e3e' text-anchor='middle' font-weight='bold'%3EMAESTRAL%3C/text%3E%3Ctext x='206' y='224' font-size='12' fill='%23333' text-anchor='middle' font-weight='normal'%3ESch%C3%B6nwetter-Thermik, nachmittags%3C/text%3E%3Ctext x='450.0' y='860' font-size='16' fill='%230b2545' text-anchor='middle' font-weight='bold'%3EDie 4 wichtigsten (laut Kurs): BURA (NO) %C2%B7 JUGO (SO) %C2%B7 LEBI%C4%86 (SW) %C2%B7 MAESTRAL (NW)%3C/text%3E%3C/svg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<h2>Die 3 Winde, die du perfekt können musst<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Wind<\/th>\n<th>Aus<\/th>\n<th>Typisch<\/th>\n<th>Gefahr / Anzeichen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>BURA<\/strong><\/td>\n<td><strong>NO<\/strong><\/td>\n<td>Kalter, trockener <strong>Fallwind<\/strong> von den Bergen, extrem <strong>böig<\/strong>, klare Sicht, oft bei Hochdruck<\/td>\n<td>Kommt <strong>plötzlich<\/strong>. Anzeichen: <strong>Wolkenkappe über dem Gebirge<\/strong> (Velebit, Biokovo). Am stärksten im Velebit-Kanal, Kvarner, bei Senj. Im Sommer Böen bis 9–10 Bft möglich, meist 1–3 Tage<\/td>\n<\/tr>\n<tr>\n<td><strong>JUGO<\/strong><\/td>\n<td><strong>SO<\/strong><\/td>\n<td>Warm, feucht, bewölkt, Regen, <strong>baut sich über Tage auf<\/strong>, langer hoher Seegang<\/td>\n<td><strong>Fallender Luftdruck<\/strong>, diesige Sicht, Dünung aus Süden. Im Süden am stärksten, im Herbst und Winter heftiger<\/td>\n<\/tr>\n<tr>\n<td><strong>MAESTRAL<\/strong><\/td>\n<td><strong>NW<\/strong><\/td>\n<td>Thermischer <strong>Schönwetterwind<\/strong> im Sommer, ab Mittag, 3–5 Bft, abends ruhig<\/td>\n<td>Ungefährlich. Bleibt er an einem Sommertag aus, kann das Wetter umschlagen<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Merke:<\/strong> Wind wird immer nach der Richtung benannt, <strong>aus der er kommt<\/strong>.\n<strong>Burin<\/strong> = schwacher nächtlicher Landwind aus NO im Sommer.<\/p>\n<h2>Die ganze Windrose (Kroatisch)<\/h2>\n<p>N <strong>Tramontana<\/strong> · NO <strong>Bura<\/strong> · O <strong>Levanat<\/strong> · SO <strong>Jugo<\/strong> · S <strong>Oštro<\/strong> · SW <strong>Lebić (Garbin)<\/strong> · W <strong>Pulenat<\/strong> · NW <strong>Maestral<\/strong><\/p>\n<p>Tipp: Die Rose im Uhrzeigersinn ab Nord 5× laut aufsagen, dann mit geschlossenen Augen auf eine leere Skizze schreiben.<\/p>\n<h2>Beaufort-Skala – das Nötigste<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Bft<\/th>\n<th>kn<\/th>\n<th>Bezeichnung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>&lt; 1<\/td>\n<td>Stille<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>7–10<\/td>\n<td>schwach<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>11–16<\/td>\n<td>mäßig – angenehm<\/td>\n<\/tr>\n<tr>\n<td><strong>6<\/strong><\/td>\n<td><strong>22–27<\/strong><\/td>\n<td><strong>Starkwind – für kleine Boote kritisch, im Hafen bleiben<\/strong><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>34–40<\/td>\n<td>Sturm<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>&gt; 64<\/td>\n<td>Orkan<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Woher kommt der Wetterbericht?<\/h2>\n<ul>\n<li><strong>Küstenfunkstellen<\/strong> Rijeka, Split und Dubrovnik Radio senden mehrmals täglich Seewetter auf Kroatisch und Englisch (UKW)<\/li>\n<li><strong>NAVTEX<\/strong> (Station bei Split)<\/li>\n<li>Hafenämter senden eine <strong>Dauer-Wetterschleife auf UKW<\/strong>, je nach Gebiet auf Kanal 67, 69 oder 73 (<em>ungeprüft, im Kurs bestätigen lassen<\/em>)<\/li>\n<li>Internet: DHMZ (meteo.hr), Seewetter Adria<\/li>\n<li><strong>Barometer:<\/strong> Fällt der Druck schnell, z. B. mehrere hPa in 3 Stunden, kommt Sturm<\/li>\n<\/ul>\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage<\/div><p>Über dem Velebit hängt eine dichte, stehende Wolkenwalze. Was erwartest du?\n→ <strong>Bura.<\/strong> Sofort einen geschützten Hafen oder Ankerplatz suchen, aber keinen offen nach NO.<\/p><\/div>"},{"n":"08","t":"Knoten & Seemannschaft","h":"<div class=\"co co-abstract\"><div class=\"co-t\">Worum geht&#x27;s überhaupt? (Erklärung für Einsteiger)<\/div><p><strong>Seemannschaft<\/strong> heißt: wie man ein Boot sicher bedient, zum Beispiel festmachen, ankern, Knoten und das richtige Verhalten, wenn jemand ins Wasser fällt.\n<strong>Knoten<\/strong> musst du in der Prüfung <strong>vorzeigen<\/strong>. Ein Kandidat musste den Palstek (kroatisch <em>vrzni čvor<\/em>) erst auf dem Gang üben, weil er ihn nicht konnte (Index.hr).\nJeder Knoten hat <strong>eine bestimmte Aufgabe<\/strong>. Lern deshalb nicht nur, wie er geht, sondern auch: <strong>Wofür ist er da, wann brauche ich ihn?<\/strong> Genau das fragen die Prüfer.<\/p>\n<p>Unbekannte Wörter? → 00a Bootssprache – Grundbegriffe<\/p><\/div>\n\n<div class=\"co co-tip\"><div class=\"co-t\">So lernst du Knoten richtig<\/div><ol>\n<li>Kauf ein Seil, ca. 1,5 m lang und 8–10 mm dick (Baumarkt).<\/li>\n<li>Schau dir die Animation an: <strong>animatedknots.com<\/strong>. Dort zeigt jeder Knoten Schritt für Schritt, wie er gebunden wird.<\/li>\n<li>Knote jeden Knoten <strong>20×<\/strong>, dann <strong>5× mit geschlossenen Augen<\/strong>. Auf dem Boot musst du ihn auch nachts und bei Wellen können.<\/li>\n<li>Für den Webeleinstek und den Klampenschlag: zu Hause an einem Stuhlbein oder Treppengeländer üben.<\/li>\n<\/ol><\/div>\n\n<hr />\n<h2>1. Palstek – der „König der Knoten“ ⭐ kommt fast sicher<\/h2>\n<figure class=\"fig ext\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e6/Palstek_innen.jpg/960px-Palstek_innen.jpg\" alt=\"Palstek\" loading=\"lazy\" referrerpolicy=\"no-referrer\"><figcaption>Palstek · antippen zum Vergrößern<\/figcaption><\/figure>\n<p><strong>Was er macht:<\/strong> Er bildet eine <strong>feste Schlinge (ein Auge)<\/strong>, die sich <strong>nicht zuzieht<\/strong>, egal wie stark man zieht. Danach lässt er sich trotzdem leicht wieder öffnen.<\/p>\n<p><strong>Wann und wo du ihn brauchst:<\/strong><\/p>\n<ul>\n<li><strong>Im Hafen:<\/strong> Du legst die Schlinge über einen <strong>Poller<\/strong> (einen dicken Pfosten am Steg) und das Boot ist fest<\/li>\n<li><strong>Rettung:<\/strong> Du machst eine Schlinge, die sich jemand im Wasser <strong>unter die Arme<\/strong> legen kann. Sie schnürt nicht ein<\/li>\n<li>Zum Festmachen an einem Ring oder einer Boje<\/li>\n<\/ul>\n<p><strong>So geht's (Merkgeschichte):<\/strong><\/p>\n<ol>\n<li>Mit dem kurzen Ende ein kleines Auge in die Leine legen: <strong>„der See“<\/strong><\/li>\n<li>Das Ende kommt von unten durch das Auge: <strong>„der Fisch springt aus dem See“<\/strong><\/li>\n<li>Hinter der langen Leine herum: <strong>„schwimmt um den Baum“<\/strong><\/li>\n<li>Wieder von oben zurück ins Auge: <strong>„und springt zurück in den See“<\/strong><\/li>\n<li>Festziehen<\/li>\n<\/ol>\n<hr />\n<h2>2. Webeleinstek – der Fender-Knoten ⭐<\/h2>\n<figure class=\"fig ext\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/Clove_Hitch_-_ABoK_11_-_USCG.jpg/960px-Clove_Hitch_-_ABoK_11_-_USCG.jpg\" alt=\"Webeleinstek\" loading=\"lazy\" referrerpolicy=\"no-referrer\"><figcaption>Webeleinstek · antippen zum Vergrößern<\/figcaption><\/figure>\n<p><strong>Was er macht:<\/strong> Er befestigt eine Leine schnell an einer <strong>Stange oder einem Rohr<\/strong>. Die Länge lässt sich leicht verstellen.<\/p>\n<p><strong>Wann und wo du ihn brauchst:<\/strong><\/p>\n<ul>\n<li><strong>Fender an die Reling hängen.<\/strong> Das machst du vor jedem Anlegen<\/li>\n<li>Kurz an einem Pfahl festmachen<\/li>\n<\/ul>\n<p><strong>So geht's:<\/strong> Die Leine einmal um die Stange legen und dabei über sich selbst kreuzen. Ein zweites Mal herum, dann das Ende <strong>unter<\/strong> der letzten Wicklung durchstecken. Von vorne sieht man ein <strong>X<\/strong>.<\/p>\n<p><strong>Achtung:<\/strong> Er kann sich lockern, wenn die Leine hin und her schlägt. Für das Boot selbst nimmst du deshalb den Klampenschlag oder den Palstek.<\/p>\n<hr />\n<h2>3. Klampenschlag – Boot am Steg festmachen ⭐<\/h2>\n<figure class=\"fig ext\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Belegen_auf_der_Klampe.jpg/960px-Belegen_auf_der_Klampe.jpg\" alt=\"Klampenschlag\" loading=\"lazy\" referrerpolicy=\"no-referrer\"><figcaption>Klampenschlag · antippen zum Vergrößern<\/figcaption><\/figure>\n<p><strong>Was er macht:<\/strong> Er befestigt eine Leine an einer <strong>Klampe<\/strong>, dem Metall-Beschlag mit zwei „Hörnern“ an Steg und Boot. Er hält fest und ist <strong>in Sekunden wieder los<\/strong>.<\/p>\n<p><strong>Wann und wo du ihn brauchst:<\/strong><\/p>\n<ul>\n<li><strong>Bei jedem Anlegen und Ablegen.<\/strong> Das ist der Knoten, den du an Bord am häufigsten machst<\/li>\n<li>Leinen an Bord „belegen“ (festmachen)<\/li>\n<\/ul>\n<p><strong>So geht's:<\/strong><\/p>\n<ol>\n<li>Die Leine einmal <strong>ganz um den Fuß<\/strong> der Klampe führen (Rundtörn)<\/li>\n<li>Dann <strong>über Kreuz als „8“<\/strong> über die beiden Hörner, 2–3 Mal<\/li>\n<li>Zum Schluss ein <strong>Kopfschlag<\/strong>: eine verdrehte Schlinge über das Horn legen, damit nichts aufgeht<\/li>\n<\/ol>\n<hr />\n<h2>4. Achtknoten – der Stopper<\/h2>\n<p><img alt=\"Achtknoten\" src=\"https://upload.wikimedia.org/wikipedia/commons/d/db/Figure-eight_knot.svg\" />\n<em>Bild: Lucasbosch, Lizenz CC BY-SA 3.0 (Wikimedia Commons)<\/em><\/p>\n<p><strong>Was er macht:<\/strong> Er macht ein <strong>dickes Ende<\/strong> an eine Leine.<\/p>\n<p><strong>Wann und wo du ihn brauchst:<\/strong><\/p>\n<ul>\n<li>Am <strong>Ende jeder Schot<\/strong> (Segelleine), damit sie nicht durch die Rolle oder Öse rutscht und weg ist<\/li>\n<li>Am Ende jeder Leine, die nicht „ausrauschen“ (ganz durchlaufen) darf<\/li>\n<\/ul>\n<p><strong>So geht's:<\/strong> Mit dem Ende eine Schlinge legen, einmal um die lange Leine herum und von oben durch die Schlinge stecken. Er sieht aus wie eine <strong>8<\/strong>.<\/p>\n<hr />\n<h2>5. Kreuzknoten – zwei gleiche Leinen verbinden<\/h2>\n<figure class=\"fig ext\"><img src=\"https://upload.wikimedia.org/wikipedia/commons/a/a0/Square_knot.svg\" alt=\"Kreuzknoten\" loading=\"lazy\" referrerpolicy=\"no-referrer\"><figcaption>Kreuzknoten · antippen zum Vergrößern<\/figcaption><\/figure>\n<p><strong>Was er macht:<\/strong> Er verbindet <strong>zwei gleich dicke Leinen<\/strong>.<\/p>\n<p><strong>Wann und wo du ihn brauchst:<\/strong><\/p>\n<ul>\n<li>Beim <strong>Reffen<\/strong> (das Segel verkleinern, wenn viel Wind ist): Das zusammengerollte Segel wird damit gebunden<\/li>\n<li>Zwei kurze Leinen zusammenknüpfen<\/li>\n<\/ul>\n<p><strong>So geht's:<\/strong> <strong>„Rechts über links, dann links über rechts.“<\/strong> Falsch herum gebunden wird ein „Altweiberknoten“, der rutscht durch.<\/p>\n<p><strong>Achtung:<\/strong> Für Leinen, an denen das Boot hängt, ist er <strong>ungeeignet<\/strong>, weil er unter Last aufgehen kann.<\/p>\n<hr />\n<h2>6. Schotstek – zwei unterschiedliche Leinen verbinden<\/h2>\n<figure class=\"fig ext\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0d/Schotstek_rechts.jpg/960px-Schotstek_rechts.jpg\" alt=\"Schotstek\" loading=\"lazy\" referrerpolicy=\"no-referrer\"><figcaption>Schotstek · antippen zum Vergrößern<\/figcaption><\/figure>\n<p><strong>Was er macht:<\/strong> Er verbindet <strong>eine dicke mit einer dünnen<\/strong> Leine. Das kann der Kreuzknoten nicht.<\/p>\n<p><strong>Wann und wo du ihn brauchst:<\/strong><\/p>\n<ul>\n<li>Eine Leine ist zu kurz und du hast nur eine dünnere zum Verlängern<\/li>\n<li>Eine Leine an einer Schlaufe befestigen<\/li>\n<\/ul>\n<p><strong>So geht's:<\/strong> Mit der <strong>dicken<\/strong> Leine eine Bucht legen (eine U-Form). Die <strong>dünne<\/strong> Leine von unten durch die Bucht stecken, einmal um die ganze Bucht herum und dann <strong>unter sich selbst<\/strong> durchstecken.<\/p>\n<hr />\n<h2>7. Rundtörn mit zwei halben Schlägen – hält unter Zug<\/h2>\n<figure class=\"fig ext\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Anderthalb_Rundt%C3%B6rn_mit_zwei_halben_Schl%C3%A4gen.jpg/960px-Anderthalb_Rundt%C3%B6rn_mit_zwei_halben_Schl%C3%A4gen.jpg\" alt=\"Rundtörn mit zwei halben Schlägen\" loading=\"lazy\" referrerpolicy=\"no-referrer\"><figcaption>Rundtörn mit zwei halben Schlägen · antippen zum Vergrößern<\/figcaption><\/figure>\n<p><strong>Was er macht:<\/strong> Er befestigt eine Leine an einem <strong>Ring, Pfosten oder Baum<\/strong>, auch wenn schon Zug auf der Leine ist.<\/p>\n<p><strong>Wann und wo du ihn brauchst:<\/strong><\/p>\n<ul>\n<li>Das Boot zieht schon an der Leine und du musst sie trotzdem festmachen<\/li>\n<li>Am <strong>Ring einer Mole<\/strong> oder am Ring einer Boje<\/li>\n<\/ul>\n<p><strong>So geht's:<\/strong> Die Leine 2× um den Ring oder Pfosten führen. Dann 2 halbe Schläge um die eigene Leine (das sieht aus wie ein Webeleinstek).<\/p>\n<hr />\n<h2>Welcher Knoten wofür? Spickzettel<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Situation<\/th>\n<th>Knoten<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fender aufhängen<\/td>\n<td><strong>Webeleinstek<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Boot an der Klampe festmachen<\/td>\n<td><strong>Klampenschlag<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Schlinge über einen Poller<\/td>\n<td><strong>Palstek<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Person aus dem Wasser holen<\/td>\n<td><strong>Palstek<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Schot soll nicht durchrutschen<\/td>\n<td><strong>Achtknoten<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Zwei gleich dicke Leinen<\/td>\n<td>Kreuzknoten<\/td>\n<\/tr>\n<tr>\n<td>Dicke + dünne Leine<\/td>\n<td><strong>Schotstek<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Am Ring festmachen, wenn Zug drauf ist<\/td>\n<td>Rundtörn + 2 halbe Schläge<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>Knotenbilder: Wikimedia Commons, gemeinfrei/CC0 (Markus Bärlocher; USCG), Achtknoten CC BY-SA 3.0 (Lucasbosch). Die Bilder werden aus dem Internet geladen.<\/em><\/p>\n<hr />\n<h2>Seemannschaft – häufige Fragen<\/h2>\n<p><strong>Bootsbegriffe:<\/strong> Bug = vorne · Heck = hinten · <strong>Steuerbord = rechts<\/strong> · <strong>Backbord = links<\/strong> (in Fahrtrichtung) · Luv = dem Wind zugewandt · Lee = vom Wind abgewandt → alles erklärt in 00a Bootssprache – Grundbegriffe<\/p>\n<p><strong>Ankern:<\/strong><\/p>\n<ul>\n<li>Gegen den Wind ankern<\/li>\n<li>Den Anker hinablassen, dann <strong>rückwärts eingraben<\/strong> (mit dem Motor langsam rückwärts, bis er hält)<\/li>\n<li><strong>Kette: mindestens 3 × Wassertiefe. Leine (Seil): mindestens 5 × Wassertiefe.<\/strong> Bei 5 m Tiefe also 15 m Kette oder 25 m Leine. Bei viel Wind mehr<\/li>\n<li>Guter Grund: <strong>Sand, Ton, Schlick (Schlamm)<\/strong>. Schlecht: <strong>Stein/Fels, Seegras<\/strong><\/li>\n<li><strong>Ankertypen:<\/strong> Danforth- (Platten-), Pflugschar-, Klapp- (Draggen), Hall- und Stockanker → Bild in <a href=\"#\" data-ch=\"16\">Kursblatt-Fragen<\/a><\/li>\n<li>In Kroatien ist Ankern innerhalb <strong>150 m von Naturstränden verboten<\/strong> (siehe <a href=\"#\" data-ch=\"10\">Kroatien-Recht &amp; Notfall<\/a>)<\/li>\n<li>Ankerlieger zeigen tagsüber einen <strong>schwarzen Ball<\/strong>, nachts ein <strong>weißes Rundumlicht<\/strong><\/li>\n<\/ul>\n<p><strong>Anlegen mit Muring (in Kroatien Standard):<\/strong><\/p>\n<ul>\n<li>Das Boot fährt <strong>rückwärts mit dem Heck an den Steg<\/strong><\/li>\n<li>Vom Steg ziehst du die <strong>Muringleine<\/strong> hoch. Sie hängt am Meeresgrund an einem Betonklotz. Du führst sie nach <strong>vorne zum Bug<\/strong> und machst sie dort fest<\/li>\n<li>Hinten kommen 2 Leinen vom Heck an den Steg<\/li>\n<li><strong>Vorsicht:<\/strong> Die Muringleine nicht in die Schraube bringen. Sie sinkt nur langsam ab<\/li>\n<\/ul>\n<p><strong>Mann über Bord (MOB):<\/strong><\/p>\n<ol>\n<li>Laut <strong>„Mann über Bord!“<\/strong> rufen<\/li>\n<li><strong>Rettungsring<\/strong> werfen<\/li>\n<li><strong>Einen Ausguck bestimmen<\/strong>, der nur auf die Person zeigt und sie nicht aus den Augen lässt<\/li>\n<li><strong>MOB-Taste<\/strong> am GPS/Plotter drücken (das speichert die Position)<\/li>\n<li>Mit dem Motorboot: Ruder <strong>zur Seite der Person<\/strong> legen, damit <strong>Heck und Schraube von ihr wegdrehen<\/strong>. Zurückfahren und <strong>gegen den Wind<\/strong> anfahren<\/li>\n<li>Nahe bei der Person <strong>auskuppeln<\/strong> (Leerlauf), damit die Schraube steht<\/li>\n<li>Wenn nötig MAYDAY über Funk (Kanal 16)<\/li>\n<\/ol>\n<p><strong>Rettungsmittel an Bord:<\/strong> Rettungswesten für alle, Rettungsring, Feuerlöscher, Notsignale, Erste-Hilfe-Kasten, Lenzpumpe/Eimer, Taschenlampe, Paddel, Anker → Details in <a href=\"#\" data-ch=\"12\">Ausrüstung, Flaggen &amp; Praxis<\/a><\/p>"},{"n":"09","t":"Motor & Technik","h":"<div class=\"co co-abstract\"><div class=\"co-t\">Worum geht&#x27;s überhaupt? (Erklärung für Einsteiger)<\/div><p>Du musst kein Mechaniker sein. Du musst aber wissen, <strong>was du vor dem Losfahren prüfst<\/strong> und <strong>was du tust, wenn eine Warnlampe angeht<\/strong>. Ein Bootsmotor wird mit <strong>Meerwasser gekühlt<\/strong>: Das Wasser wird unten angesaugt, durch den Motor gepumpt und kommt hinten mit dem Auspuff wieder heraus.\nDie meisten Pannen entstehen, weil diese Kühlung verstopft ist (z. B. durch eine Plastiktüte) oder weil Öl fehlt.<\/p>\n<p>Unbekannte Wörter? → 00a Bootssprache – Grundbegriffe<\/p><\/div>\n\n<h2>Zwei Arten der Kühlung (wird gefragt)<\/h2>\n<ul>\n<li><strong>Einkreiskühlung:<\/strong> Das Seewasser fließt <strong>direkt durch den Motor<\/strong> und mit dem Auspuff wieder hinaus<\/li>\n<li><strong>Zweikreiskühlung:<\/strong> Im Motor läuft eine <strong>eigene Kühlflüssigkeit<\/strong> im geschlossenen Kreis (wie beim Auto). Das Seewasser kühlt diese Flüssigkeit über einen <strong>Wärmetauscher<\/strong> und geht dann mit dem Auspuff hinaus. Vorteil: Kein Salzwasser im Motor<\/li>\n<\/ul>\n<h2>Checkliste vor dem Start (oft gefragt)<\/h2>\n<ol>\n<li><strong>Ölstand<\/strong> prüfen (Peilstab)<\/li>\n<li><strong>Kühlwasser-Seeventil offen?<\/strong><\/li>\n<li>Kraftstoff reicht? → <strong>Drittelregel<\/strong>: ⅓ hin, ⅓ zurück, ⅓ Reserve<\/li>\n<li><strong>Batterie-Hauptschalter<\/strong> an<\/li>\n<li>Keilriemen gespannt, keine Risse?<\/li>\n<li><strong>Bilge<\/strong> trocken, kein Kraftstoff- oder Ölgeruch?<\/li>\n<li><strong>Benzinmotor:<\/strong> Motorraum <strong>mehrere Minuten lüften<\/strong> (Gebläse). <strong>Benzindämpfe sind schwerer als Luft<\/strong>, sammeln sich in der Bilge und können explodieren<\/li>\n<li>Schalthebel auf <strong>Neutral<\/strong>, dann starten<\/li>\n<li>Nach dem Start: <strong>Kommt Kühlwasser aus dem Auspuff?<\/strong> Wenn nicht, sofort Motor aus<\/li>\n<\/ol>\n<h2>Warnlampen und was du tust<\/h2>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%201100%20845'%20width%3D'1100'%20height%3D'845'%20font-family%3D'Segoe%20UI%2C%20Arial%2C%20sans-serif'%3E%3Crect%20width%3D'1100'%20height%3D'845'%20fill%3D'%23ffffff'%2F%3E%3Ctext%20x%3D'550'%20y%3D'40'%20font-size%3D'26'%20fill%3D'%230b2545'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3EWarnlampen%20am%20Motor-Bedienpanel%3C%2Ftext%3E%3Ctext%20x%3D'550'%20y%3D'66'%20font-size%3D'14'%20fill%3D'%23444'%20text-anchor%3D'middle'%20font-weight%3D'normal'%3EDas%20Panel%20sitzt%20meist%20im%20Cockpit%20beim%20Steuerrad%2C%20oft%20unter%20einer%20Klappe.%20Beim%20Einschalten%20leuchten%20kurz%20alle%20Lampen%20(Lampentest)%3C%2Ftext%3E%3Crect%20x%3D'40'%20y%3D'90'%20width%3D'1020'%20height%3D'210'%20rx%3D'18'%20fill%3D'%2322303d'%20stroke%3D'%231a1a1a'%20stroke-width%3D'3'%2F%3E%3Ccircle%20cx%3D'165'%20cy%3D'175'%20r%3D'52'%20fill%3D'%23d62828'%20stroke%3D'%2311181f'%20stroke-width%3D'6'%2F%3E%3Cpath%20d%3D'M137%2C176%20h40%20l14%2C-10%20l8%2C4%20l-14%2C14%20h-48%20z'%20fill%3D'%23ffffff'%2F%3E%3Cpath%20d%3D'M137%2C176%20l-10%2C-8'%20stroke%3D'%23ffffff'%20stroke-width%3D'4'%2F%3E%3Ccircle%20cx%3D'195'%20cy%3D'188'%20r%3D'3'%20fill%3D'%23ffffff'%2F%3E%3Ctext%20x%3D'165'%20y%3D'265'%20font-size%3D'16'%20fill%3D'%23ffffff'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3E%C3%96LDRUCK%3C%2Ftext%3E%3Ccircle%20cx%3D'420'%20cy%3D'175'%20r%3D'52'%20fill%3D'%23d62828'%20stroke%3D'%2311181f'%20stroke-width%3D'6'%2F%3E%3Crect%20x%3D'416'%20y%3D'148'%20width%3D'8'%20height%3D'30'%20rx%3D'4'%20fill%3D'%23ffffff'%2F%3E%3Ccircle%20cx%3D'420'%20cy%3D'180'%20r%3D'8'%20fill%3D'%23ffffff'%2F%3E%3Cpath%20d%3D'M394%2C194%20q8%2C-6%2016%2C0%20t16%2C0%20t16%2C0%20t16%2C0'%20stroke%3D'%23ffffff'%20fill%3D'none'%20stroke-width%3D'3'%2F%3E%3Ctext%20x%3D'420'%20y%3D'265'%20font-size%3D'16'%20fill%3D'%23ffffff'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3ETEMPERATUR%3C%2Ftext%3E%3Ccircle%20cx%3D'675'%20cy%3D'175'%20r%3D'52'%20fill%3D'%23ff9a00'%20stroke%3D'%2311181f'%20stroke-width%3D'6'%2F%3E%3Crect%20x%3D'647'%20y%3D'156'%20width%3D'56'%20height%3D'34'%20rx%3D'4'%20fill%3D'none'%20stroke%3D'%23ffffff'%20stroke-width%3D'4'%2F%3E%3Crect%20x%3D'655'%20y%3D'150'%20width%3D'8'%20height%3D'6'%20fill%3D'%23ffffff'%2F%3E%3Crect%20x%3D'687'%20y%3D'150'%20width%3D'8'%20height%3D'6'%20fill%3D'%23ffffff'%2F%3E%3Ctext%20x%3D'661'%20y%3D'180'%20font-size%3D'18'%20fill%3D'%23ffffff'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3E%E2%88%92%3C%2Ftext%3E%3Ctext%20x%3D'689'%20y%3D'180'%20font-size%3D'18'%20fill%3D'%23ffffff'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3E%2B%3C%2Ftext%3E%3Ctext%20x%3D'675'%20y%3D'265'%20font-size%3D'16'%20fill%3D'%23ffffff'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3ELADEKONTROLLE%3C%2Ftext%3E%3Ccircle%20cx%3D'930'%20cy%3D'175'%20r%3D'52'%20fill%3D'%23ff9a00'%20stroke%3D'%2311181f'%20stroke-width%3D'6'%2F%3E%3Cpath%20d%3D'M906%2C170%20q6%2C-14%2012%2C0%20t12%2C0%20t12%2C0%20t12%2C0'%20stroke%3D'%23ffffff'%20fill%3D'none'%20stroke-width%3D'4'%2F%3E%3Cline%20x1%3D'900'%20y1%3D'154'%20x2%3D'900'%20y2%3D'186'%20stroke%3D'%23ffffff'%20stroke-width%3D'4'%2F%3E%3Cline%20x1%3D'960'%20y1%3D'154'%20x2%3D'960'%20y2%3D'186'%20stroke%3D'%23ffffff'%20stroke-width%3D'4'%2F%3E%3Ctext%20x%3D'930'%20y%3D'265'%20font-size%3D'16'%20fill%3D'%23ffffff'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3EVORGL%C3%9CHEN%3C%2Ftext%3E%3Crect%20x%3D'40'%20y%3D'330'%20width%3D'1020'%20height%3D'82'%20rx%3D'10'%20fill%3D'%23f4f7fb'%20stroke%3D'%23dbe4ef'%2F%3E%3Ctext%20x%3D'60'%20y%3D'362'%20font-size%3D'16'%20fill%3D'%23d62828'%20text-anchor%3D'start'%20font-weight%3D'bold'%3E%C3%96LDRUCK%20(rot)%3C%2Ftext%3E%3Ctext%20x%3D'60'%20y%3D'388'%20font-size%3D'14'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3EZu%20wenig%20%C3%96l%20oder%20%C3%96lpumpe%20defekt%3C%2Ftext%3E%3Ctext%20x%3D'420'%20y%3D'362'%20font-size%3D'14'%20fill%3D'%230b2545'%20text-anchor%3D'start'%20font-weight%3D'bold'%3E%E2%86%92%20Motor%20SOFORT%20aus.%3C%2Ftext%3E%3Ctext%20x%3D'440'%20y%3D'388'%20font-size%3D'14'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E%C3%96lstand%20pr%C3%BCfen%2C%20nachf%C3%BCllen.%20Leuchtet%20sie%20wieder%3A%20nicht%20weiterfahren%3C%2Ftext%3E%3Crect%20x%3D'40'%20y%3D'422'%20width%3D'1020'%20height%3D'82'%20rx%3D'10'%20fill%3D'%23ffffff'%20stroke%3D'%23dbe4ef'%2F%3E%3Ctext%20x%3D'60'%20y%3D'454'%20font-size%3D'16'%20fill%3D'%23d62828'%20text-anchor%3D'start'%20font-weight%3D'bold'%3ETEMPERATUR%20(rot)%3C%2Ftext%3E%3Ctext%20x%3D'60'%20y%3D'480'%20font-size%3D'14'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3EMotor%20%C3%BCberhitzt%2C%20K%C3%BChlwasser%20fehlt%3C%2Ftext%3E%3Ctext%20x%3D'420'%20y%3D'454'%20font-size%3D'14'%20fill%3D'%230b2545'%20text-anchor%3D'start'%20font-weight%3D'bold'%3E%E2%86%92%20Gas%20weg%2C%20Motor%20aus.%3C%2Ftext%3E%3Ctext%20x%3D'440'%20y%3D'480'%20font-size%3D'14'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3ESeewasserfilter%20(Plastikt%C3%BCte%3F)%2C%20Seeventil%20offen%3F%20Impeller%2C%20Keilriemen%3C%2Ftext%3E%3Crect%20x%3D'40'%20y%3D'514'%20width%3D'1020'%20height%3D'82'%20rx%3D'10'%20fill%3D'%23f4f7fb'%20stroke%3D'%23dbe4ef'%2F%3E%3Ctext%20x%3D'60'%20y%3D'546'%20font-size%3D'16'%20fill%3D'%23b86e00'%20text-anchor%3D'start'%20font-weight%3D'bold'%3ELADEKONTROLLE%20(orange)%3C%2Ftext%3E%3Ctext%20x%3D'60'%20y%3D'572'%20font-size%3D'14'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3EBatterie%20wird%20nicht%20geladen%3C%2Ftext%3E%3Ctext%20x%3D'420'%20y%3D'546'%20font-size%3D'14'%20fill%3D'%230b2545'%20text-anchor%3D'start'%20font-weight%3D'bold'%3E%E2%86%92%20Keilriemen%20pr%C3%BCfen%2C%20Strom%20sparen.%3C%2Ftext%3E%3Ctext%20x%3D'440'%20y%3D'572'%20font-size%3D'14'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3EK%C3%BChlschrank%20und%20Plotter%20aus%2C%20Hafen%20anlaufen%3C%2Ftext%3E%3Crect%20x%3D'40'%20y%3D'606'%20width%3D'1020'%20height%3D'82'%20rx%3D'10'%20fill%3D'%23ffffff'%20stroke%3D'%23dbe4ef'%2F%3E%3Ctext%20x%3D'60'%20y%3D'638'%20font-size%3D'16'%20fill%3D'%23b86e00'%20text-anchor%3D'start'%20font-weight%3D'bold'%3EVORGL%C3%9CHEN%20(orange)%3C%2Ftext%3E%3Ctext%20x%3D'60'%20y%3D'664'%20font-size%3D'14'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3ENur%20Diesel%3A%20Motor%20w%C3%A4rmt%20vor%3C%2Ftext%3E%3Ctext%20x%3D'420'%20y%3D'638'%20font-size%3D'14'%20fill%3D'%230b2545'%20text-anchor%3D'start'%20font-weight%3D'bold'%3E%E2%86%92%20Kein%20Fehler%2C%20das%20ist%20normal.%3C%2Ftext%3E%3Ctext%20x%3D'440'%20y%3D'664'%20font-size%3D'14'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3EVor%20dem%20Start%20warten%2C%20bis%20sie%20ausgeht%2C%20dann%20starten%3C%2Ftext%3E%3Crect%20x%3D'40'%20y%3D'705'%20width%3D'1020'%20height%3D'120'%20rx%3D'12'%20fill%3D'%23fff5d6'%20stroke%3D'%23f0d98a'%2F%3E%3Ctext%20x%3D'60'%20y%3D'735'%20font-size%3D'18'%20fill%3D'%230b2545'%20text-anchor%3D'start'%20font-weight%3D'bold'%3E%F0%9F%92%A1%20Tipps%3C%2Ftext%3E%3Ctext%20x%3D'68'%20y%3D'765'%20font-size%3D'14'%20fill%3D'%231a1a1a'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E%E2%80%A2%20Bei%20der%20Boots%C3%BCbergabe%20fragen%3A%20%E2%80%9EWo%20ist%20das%20Motorpanel%2C%20wo%20der%20Hauptschalter%2C%20wo%20das%20Seeventil%20f%C3%BCr%20den%20Motor%3F%E2%80%9C%3C%2Ftext%3E%3Ctext%20x%3D'68'%20y%3D'789'%20font-size%3D'14'%20fill%3D'%231a1a1a'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E%E2%80%A2%20Hinten%20am%20Boot%20schauen%3A%20Kommt%20beim%20laufenden%20Motor%20Wasser%20aus%20dem%20Auspuff%3F%20Wenn%20nicht%2C%20ist%20die%20K%C3%BChlung%20kaputt%20%E2%86%92%20Motor%20aus.%3C%2Ftext%3E%3Ctext%20x%3D'68'%20y%3D'813'%20font-size%3D'14'%20fill%3D'%231a1a1a'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E%E2%80%A2%20Oft%20piept%20ein%20Summer%20zus%C3%A4tzlich%20zur%20Lampe.%20Piepen%20%3D%20sofort%20hinschauen.%3C%2Ftext%3E%3C%2Fsvg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<div class=\"co co-tip\"><div class=\"co-t\">Praxis-Tipp für Neulinge<\/div><ul>\n<li>Das <strong>Motorpanel<\/strong> sitzt meist im Cockpit beim Steuerrad, manchmal unter einer durchsichtigen Klappe. Beim Einschalten leuchten kurz <strong>alle<\/strong> Lampen. Das ist ein Lampentest und normal.<\/li>\n<li>Dazu piept oft ein <strong>Summer<\/strong>. Piepen während der Fahrt heißt: sofort aufs Panel schauen!<\/li>\n<li>Lass dir bei der Übergabe zeigen, wo der <strong>Motorraum<\/strong>, der <strong>Ölmessstab<\/strong>, das <strong>Seeventil<\/strong> und der <strong>Seewasserfilter<\/strong> sind. Genau das brauchst du, wenn eine Lampe angeht.<\/li>\n<\/ul><\/div>\n\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Alarm<\/th>\n<th>Ursache<\/th>\n<th>Sofortmaßnahme<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Öldruck<\/strong><\/td>\n<td>zu wenig Öl, Ölpumpe defekt<\/td>\n<td><strong>Motor sofort aus.<\/strong> Ölstand prüfen, nachfüllen, neu starten, beobachten. Geht die Lampe wieder an: nicht weiterfahren<\/td>\n<\/tr>\n<tr>\n<td><strong>Temperatur<\/strong> (Überhitzung)<\/td>\n<td>Seewasserfilter verstopft (<strong>Plastiktüte!<\/strong>), <strong>Impeller<\/strong> kaputt, Seeventil zu, Keilriemen gerissen<\/td>\n<td>Gas weg bzw. Motor aus. <strong>Seewasser-Ansaugung und Filter prüfen<\/strong>, dann Impeller und Keilriemen<\/td>\n<\/tr>\n<tr>\n<td><strong>Ladekontrolle<\/strong> (Batterie)<\/td>\n<td>Lichtmaschine lädt nicht, Keilriemen<\/td>\n<td>Keilriemen prüfen, Stromverbrauch reduzieren<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Diesel oder Benzin<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Diesel<\/th>\n<th>Benzin<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Zündung<\/td>\n<td>Selbstzünder (Kompression), keine Zündkerzen<\/td>\n<td>Zündkerzen<\/td>\n<\/tr>\n<tr>\n<td>Brandgefahr<\/td>\n<td>gering<\/td>\n<td><strong>hoch<\/strong>, Dämpfe explosiv<\/td>\n<\/tr>\n<tr>\n<td>Typisches Problem<\/td>\n<td><strong>Luft im System<\/strong> → entlüften. Verschmutzter Filter, Wasser im Diesel<\/td>\n<td>Feuchte Zündkerzen, Dämpfe<\/td>\n<\/tr>\n<tr>\n<td>Typisch auf<\/td>\n<td>Segelyachten, größere Motorboote<\/td>\n<td>Außenborder, Speedboote<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Feuer an Bord<\/h2>\n<ul>\n<li>Feuer braucht <strong>3 Dinge<\/strong>: Brennstoff, Sauerstoff, Hitze. Eines davon wegnehmen<\/li>\n<li><strong>Fett- oder Ölbrand nie mit Wasser löschen<\/strong> → Deckel drauf oder Löschdecke<\/li>\n<li><strong>Motorraumbrand:<\/strong> Motor aus, Kraftstoffhahn zu, die Luke <strong>nicht weit öffnen<\/strong> (sonst kommt Sauerstoff dazu). Den Löscher durch einen Spalt entleeren<\/li>\n<li>Das Boot so drehen, dass <strong>der Rauch von der Crew weggeht<\/strong><\/li>\n<li>Alle ziehen Rettungswesten an, notfalls MAYDAY<\/li>\n<\/ul>\n<h2>Tanken<\/h2>\n<ul>\n<li>Motor aus, nicht rauchen, Luken zu<\/li>\n<li>Danach lüften (Benziner), Spritzer aufwischen<\/li>\n<li><strong>Umweltschutz:<\/strong> Kein Öl, kein Kraftstoff und kein Müll ins Meer. Fäkalientank nur an der Absauganlage leeren<\/li>\n<\/ul>\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage (AC Nautik)<\/div><p>2 Stunden nach dem Start von Split Richtung Vis geht die <strong>Öldrucklampe<\/strong> an. Was tust du?\n→ Motor sofort abstellen, Ölstand prüfen, nachfüllen, neu starten und beobachten.<\/p><\/div>"},{"n":"10","t":"Kroatien-Recht & Notfall","h":"<div class=\"co co-abstract\"><div class=\"co-t\">Worum geht&#x27;s überhaupt? (Erklärung für Einsteiger)<\/div><p>Hier stehen die <strong>kroatischen Sonderregeln<\/strong>: wie schnell du nahe der Küste fahren darfst, wie weit du von Stränden wegbleiben musst, wo du nicht ankern darfst und welche Nummer du im Notfall anrufst.\nDiese Zahlen werden gern direkt abgefragt. <strong>Auswendig lernen lohnt sich.<\/strong><\/p>\n<p>Unbekannte Wörter? → 00a Bootssprache – Grundbegriffe<\/p><\/div>\n\n<h2>Zahlen, die sitzen müssen<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Was<\/th>\n<th>Wert<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Seenot-Notruf (MRCC Rijeka)<\/strong><\/td>\n<td><strong>195<\/strong> (oder 112)<\/td>\n<\/tr>\n<tr>\n<td>Notfunk<\/td>\n<td><strong>UKW Kanal 16<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Italienische Küstenwache<\/td>\n<td>1530<\/td>\n<\/tr>\n<tr>\n<td>Hoheitsgewässer<\/td>\n<td><strong>12 sm<\/strong> von der Basislinie/Küste<\/td>\n<\/tr>\n<tr>\n<td>Höchstgeschwindigkeit <strong>innerhalb 300 m von der Küste<\/strong><\/td>\n<td><strong>8 kn<\/strong>. <strong>Gleitfahrt<\/strong> also erst weiter draußen<\/td>\n<\/tr>\n<tr>\n<td>Im <strong>Hafen<\/strong><\/td>\n<td>nur langsam, ohne Wellenschlag (laut Kurs ca. <strong>2–3 kn<\/strong>)<\/td>\n<\/tr>\n<tr>\n<td>Mindestabstand zur Küste, Boot <strong>unter 15 m<\/strong><\/td>\n<td><strong>50 m<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Mindestabstand zur Küste, Boot <strong>15–30 m<\/strong><\/td>\n<td><strong>150 m<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Ankerverbot<\/strong><\/td>\n<td>innerhalb <strong>150 m von Naturstränden<\/strong> und wo es das Hafenamt verbietet<\/td>\n<\/tr>\n<tr>\n<td>Beiboot ohne eigene Papiere<\/td>\n<td>frei innerhalb <strong>500 m vom Mutterschiff<\/strong>. Weiter weg braucht ein Beiboot über 2,5 m bzw. über 5 kW eine eigene Registrierung<\/td>\n<\/tr>\n<tr>\n<td>SUP, Kajak, Jetski<\/td>\n<td>nur bis 300 m von der Küste, nur zwischen Sonnenauf- und Sonnenuntergang, nie in Badezonen<\/td>\n<\/tr>\n<tr>\n<td>Skipper B erlaubt<\/td>\n<td>Boote/Yachten bis <strong>30 BT<\/strong>, Funk inklusive (nur in Kroatien)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>Quelle der Abstands- und Tempo-Regeln: neue kroatische Sicherheitsverordnung 2025 (Pressmare, 26.04.2025).<\/em><\/p>\n<h2>Weitere Rechtsfragen, die vorkommen<\/h2>\n<ul>\n<li><strong>Gewerblich oder privat?<\/strong> Wer <strong>zahlende Gäste<\/strong> mitnimmt, betreibt gewerbliche Personenbeförderung. Dafür brauchst du eine gewerbliche Berechtigung, eine reine Kostenbeteiligung unter Freunden ausgenommen (AC Nautik)<\/li>\n<li><strong>Taucher-Markierung:<\/strong> Boje <strong>orange oder rot<\/strong> (mind. 30 cm) in der Mitte des Tauchgebiets oder <strong>Flagge A (weiß-blau)<\/strong> am Tauchboot. Abstand halten und langsam fahren. Gäste dürfen nur mit gültiger Tauchgenehmigung tauchen (AC Nautik)<\/li>\n<li><strong>Badezonen<\/strong> sind durch gelbe Bojen markiert. Mit dem Motor nicht hineinfahren<\/li>\n<li><strong>Papiere an Bord:<\/strong> Bootsschein bzw. Fahrterlaubnis, Befähigungsnachweis (dein Skipper B), Versicherung, bei Charter die Crewliste<\/li>\n<li><strong>Alkohol:<\/strong> Es gelten Grenzwerte wie im Straßenverkehr. <em>Ungeprüft: den genauen Promillewert im Kurs nachfragen<\/em><\/li>\n<li><strong>Zuständige Behörde:<\/strong> das Hafenamt (<strong>Lučka kapetanija<\/strong>) bzw. dessen Außenstellen (Ispostava)<\/li>\n<\/ul>\n<h2>Notfall-Ablauf (allgemein)<\/h2>\n<ol>\n<li>Ruhe bewahren, <strong>Rettungswesten an<\/strong><\/li>\n<li>Lage beurteilen: Ist Leben in Gefahr?<\/li>\n<li>Ja → <strong>MAYDAY<\/strong> auf Kanal 16 bzw. <strong>195<\/strong> anrufen<\/li>\n<li>\n<p>Dringend, aber keine Lebensgefahr → <strong>PAN PAN<\/strong><\/p>\n<\/li>\n<li>\n<p>Position bereithalten (GPS, Plotter)<\/p>\n<\/li>\n<li>Notsignale bereit, Rettungsinsel klar machen<\/li>\n<li><strong>Ein Schiff erst verlassen, wenn es wirklich sinkt.<\/strong> „Steig nach oben in die Rettungsinsel“, also erst im letzten Moment<\/li>\n<\/ol>\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage (AC Nautik)<\/div><p>Du hast kein Funkgerät. Welche Nummer rufst du in Kroatien an?\n→ <strong>195<\/strong> (MRCC Rijeka).<\/p><\/div>"},{"n":"12","t":"Ausrüstung, Flaggen & Praxis","h":"<div class=\"co co-abstract\"><div class=\"co-t\">Worum geht&#x27;s überhaupt? (Erklärung für Einsteiger)<\/div><p>Hier steht, was in den anderen Kapiteln gefehlt hat: <strong>Was muss an Bord sein? Welche Flaggen gibt es? Was mache ich bei Seekrankheit oder Unterkühlung? Wie läuft der Prüfungstag ab?<\/strong> Und eine Checkliste für deine erste Charter.<\/p>\n<p>Unbekannte Wörter? → 00a Bootssprache – Grundbegriffe<\/p><\/div>\n\n<h2>Sicherheitsausrüstung – was an Bord sein muss<\/h2>\n<p>Bei einem Charterboot ist die Ausrüstung schon an Bord. Du musst beim Übernehmen aber <strong>wissen, wo alles liegt, und prüfen, ob es vollständig ist<\/strong>.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ausrüstung<\/th>\n<th>Wofür<\/th>\n<th>Worauf achten<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Rettungswesten<\/strong><\/td>\n<td>für <strong>jede Person<\/strong> an Bord eine<\/td>\n<td>Passende Größe, Kinderwesten! Bei Seegang, nachts und für Nichtschwimmer <strong>anziehen<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Rettungsring<\/strong><\/td>\n<td>wird bei Mann über Bord geworfen<\/td>\n<td>griffbereit am Heck, mit Leine<\/td>\n<\/tr>\n<tr>\n<td><strong>Feuerlöscher<\/strong><\/td>\n<td>Brand an Bord<\/td>\n<td>Prüfdatum, Ort merken<\/td>\n<\/tr>\n<tr>\n<td><strong>Notsignale<\/strong> (Handfackeln, Raketen, Rauch)<\/td>\n<td>Notfall, Seenot<\/td>\n<td>Ablaufdatum!<\/td>\n<\/tr>\n<tr>\n<td><strong>Erste-Hilfe-Kasten<\/strong><\/td>\n<td>Verletzungen<\/td>\n<td>vollständig?<\/td>\n<\/tr>\n<tr>\n<td><strong>Anker mit Kette/Leine<\/strong><\/td>\n<td>Ankern, auch im Notfall bei Motorausfall<\/td>\n<td>Kette ausreichend lang<\/td>\n<\/tr>\n<tr>\n<td><strong>Lenzpumpe / Eimer<\/strong><\/td>\n<td>Wasser aus dem Boot schöpfen<\/td>\n<td>funktioniert?<\/td>\n<\/tr>\n<tr>\n<td><strong>Paddel / Riemen<\/strong><\/td>\n<td>kleines Boot ohne Motor bewegen<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Taschenlampe<\/strong><\/td>\n<td>nachts, Notfall<\/td>\n<td>Batterien<\/td>\n<\/tr>\n<tr>\n<td><strong>Funkgerät (UKW)<\/strong><\/td>\n<td>Notruf, Kommunikation<\/td>\n<td>Kanal 16 eingestellt<\/td>\n<\/tr>\n<tr>\n<td><strong>Seekarte<\/strong><\/td>\n<td>Navigation, auch wenn das GPS ausfällt<\/td>\n<td>für das Fahrgebiet<\/td>\n<\/tr>\n<tr>\n<td><strong>Fender und Festmacherleinen<\/strong><\/td>\n<td>Anlegen<\/td>\n<td>genug davon<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>Die genaue gesetzliche Pflichtliste hängt von Bootsgröße und Fahrtgebiet ab. Im Kurs nachfragen, welche Punkte geprüft werden (Daten fehlen für die vollständige amtliche Liste).<\/em><\/p>\n<h2>Flaggen – die wichtigsten<\/h2>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%201120%201015'%20width%3D'1120'%20height%3D'1015'%20font-family%3D'Segoe%20UI%2C%20Arial%2C%20sans-serif'%3E%3Crect%20width%3D'1120'%20height%3D'1015'%20fill%3D'%23ffffff'%2F%3E%3Ctext%20x%3D'560'%20y%3D'40'%20font-size%3D'26'%20fill%3D'%230b2545'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3EFlaggen%3A%20die%20du%20kennen%20musst%3C%2Ftext%3E%3Ctext%20x%3D'560'%20y%3D'66'%20font-size%3D'15'%20fill%3D'%23444'%20text-anchor%3D'middle'%20font-weight%3D'normal'%3EJede%20Flagge%20ist%20auch%20ein%20Buchstabe%20im%20Flaggenalphabet%20(das%20gleiche%20wie%20im%20Funk-ABC)%3C%2Ftext%3E%3Crect%20x%3D'20'%20y%3D'90'%20width%3D'1080'%20height%3D'102'%20rx%3D'10'%20fill%3D'%23f4f7fb'%20stroke%3D'%23dbe4ef'%2F%3E%3Crect%20x%3D'54'%20y%3D'106'%20width%3D'4'%20height%3D'72'%20fill%3D'%235b6b7a'%2F%3E%3Crect%20x%3D'60'%20y%3D'110'%20width%3D'45'%20height%3D'60'%20fill%3D'%23ffffff'%20stroke%3D'%23999'%2F%3E%3Cpath%20d%3D'M105
