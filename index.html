<style>
/* Layout: Handy-first Lern-App · oben Kapitelkopf, unten feste Navigation (Lernen / Karten / Quiz) wie ein Instrumentenpanel */
:root{

}

  --accent:#5fb3e6; --port:#ff5a6e; --stbd:#3fcf8e; --signal:#f2b705; --soft:#163044; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08141e; --surface:#10212f; --ink:#e3edf3; --muted:#9db2c2; --line:#24394b;
  --accent:#5fb3e6; --port:#ff5a6e; --stbd:#3fcf8e; --signal:#f2b705; --soft:#163044; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:2px solid var(--ink)}

.brand h1 span{color:var(--port)}.brand h1 b{color:var(--stbd)}

/* Kapitel-Liste */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);border-radius:999px;padding:7px 13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.toc button{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--ink);font:600 17px var(--body);cursor:pointer}
.toc .no{font-family:var(--mono);font-size:13px;color:var(--accent);min-width:24px}

.content pre{background:var(--ink);color:var(--bg);padding:14px;border-radius:10px;overflow-x:auto;font-size:13px;line-height:1.5}

.btn.ok{background:var(--stbd);color:#fff}.btn.no{background:var(--port);color:#fff}
.btn:focus-visible,button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
/* Karteikarten */
.card{perspective:1200px;margin:16px 0;cursor:pointer;min-height:400px}
.card-in{position:relative;min-height:400px;transition:transform .45s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:12px;border:2px solid var(--ink);background:var(--surface);overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--ink);color:var(--bg)}
.face .q{font-size:22px;font-weight:700;line-height:1.3}
.face .a{font-size:24px;font-weight:700;color:var(--signal)}
.face .e{font-size:16px;opacity:.9}
.face .hint{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:auto}
.face.back .hint{color:var(--soft)}
.row{display:flex;gap:10px}.row .btn{flex:1}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 0}

/* Quiz */
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;width:100%;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 17px var(--body);cursor:pointer}
.opt.right{border-color:var(--stbd);background:color-mix(in srgb,var(--stbd) 14%,var(--surface))}
.opt.wrong{border-color:var(--port);background:color-mix(in srgb,var(--port) 14%,var(--surface))}
.fb{padding:12px 14px;border-radius:10px;background:var(--soft);margin-bottom:12px}
.qtext{font-size:21px;font-weight:700;line-height:1.3;margin:10px 0 0}
.score{font-family:var(--display);font-size:64px;font-weight:700;line-height:1}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.stat{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{font-family:var(--display);font-size:30px;display:block;line-height:1}
/* Bottom-Nav */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ink);display:flex;justify-content:center;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.bot .in{display:flex;gap:6px;max-width:720px;width:100%}
nav.bot button{flex:1;border:0;background:transparent;color:var(--bg);opacity:.65;font:700 15px var(--body);padding:10px 4px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bot button svg{width:22px;height:22px}
nav.bot button[aria-current="page"]{opacity:1;background:color-mix(in srgb,var(--bg) 14%,transparent)}
.term{all:unset;cursor:help;border-bottom:2px dotted var(--accent);color:inherit}
.term:focus-visible{outline:3px solid var(--signal)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);color:var(--ink);border-top:3px solid var(--accent);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet .st{font-family:var(--display);font-size:24px;font-weight:700;margin:0 0 6px}
.sheet p{margin:0 0 12px;font-size:17px}
.fig.ext .missing{padding:16px;font-size:14px;color:#4f6576}
.zoom{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.85);overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) 10px 20px}
.zoom img{width:auto;max-width:none;height:auto;min-width:100%;background:#fff;border-radius:6px}
.zoom .x{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));background:#fff;color:#000;border:0;border-radius:99px;width:44px;height:44px;font-size:22px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.card-in,.bar i{transition:none}}

<script>
const DATA = {"ch":[{"n":"00","t":"Prüfung & Lernplan","h":"<div class=\"co co-danger\"><div class=\"co-t\">Das Wichtigste zuerst: Die Regeln ändern sich bald<\/div><p>Das kroatische Ministerium bereitet eine neue Verordnung vor. Danach musst du <strong>vor der Prüfung Pflicht-Fahrstunden mit einem Ausbilder<\/strong> machen. Bisher reicht die Theorieprüfung.<\/p>\n<ul>\n<li>Laut Nautička Patrola (22.07.2026) soll die Verordnung „dieses Jahr oder zu Beginn der nächsten Saison“ in Kraft treten. Vorher kommt noch die öffentliche Konsultation (e-Savjetovanje).<\/li>\n<li>Wer den Schein schon hat, bleibt verschont (Bestandsschutz).<\/li>\n<li><strong>Konsequenz: Die Prüfung so bald wie möglich machen.<\/strong> Vor der Buchung bei der Bootsschule bzw. beim Hafenamt nachfragen, ob die neue Regel schon gilt.<\/li>\n<\/ul><\/div>\n\n<div class=\"co co-tip\"><div class=\"co-t\">🖨 Zum Ausdrucken<\/div><p><strong><a href=\"Skipper-B-Druckblaetter.pdf\">Druckblätter als PDF öffnen – 24 Seiten A4<\/a><\/strong>: Törn von A bis Z, Faustformeln, Seekarte, Lichter, Signalkörper, Flaggen, Seezeichen, Schallsignale, Funk, Recht, Knoten mit Fotos, Prüfungstag.\nAuf dem Handy: antippen → das PDF öffnet sich → Teilen-Symbol → „Drucken“ (oder in „Dateien“ speichern).<\/p><\/div>\n\n<h2>So läuft die Prüfung ab (Stand 2026)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Punkt<\/th>\n<th>Fakt<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Form<\/td>\n<td><strong>Mündlich<\/strong>, rein theoretisch, vor einer <strong>dreiköpfigen Kommission<\/strong>. Jedes Mitglied prüft eigene Themen<\/td>\n<\/tr>\n<tr>\n<td>Dauer<\/td>\n<td>ca. 15–30 Minuten<\/td>\n<\/tr>\n<tr>\n<td>Praktisch<\/td>\n<td>Nur <strong>Seekartenarbeit<\/strong> (Position, Kurs, Distanz) und <strong>Knoten<\/strong> am Tisch. Keine Fahrprüfung<\/td>\n<\/tr>\n<tr>\n<td>Ergebnis<\/td>\n<td>Nur „bestanden“ / „nicht bestanden“, sofort. Wenn du durchfällst: Wiederholung beim nächsten Termin<\/td>\n<\/tr>\n<tr>\n<td>Wo<\/td>\n<td>Ministerium in Zagreb oder Hafenamt (Lučka kapetanija): Pula, Rijeka, Senj, Zadar, Šibenik, Split, Ploče, Dubrovnik<\/td>\n<\/tr>\n<tr>\n<td>Sprache<\/td>\n<td>Kroatisch, Englisch, teils Deutsch oder Italienisch (für Ausländer vorher beantragen). Über eine Bootsschule klären<\/td>\n<\/tr>\n<tr>\n<td>Gebühr<\/td>\n<td>Staatliche Gebühr Kat. B: 58,40 €, für Ausländer (EN/DE) <strong>108,83 €<\/strong>. Kurs zusätzlich ca. 150–350 €<\/td>\n<\/tr>\n<tr>\n<td>Unterlagen<\/td>\n<td>Antragsformular, 2 Passfotos (3 × 3,5 cm), Ausweiskopie, Kopie des Führerscheins (gilt als Erste-Hilfe-Nachweis), Zahlungsbeleg<\/td>\n<\/tr>\n<tr>\n<td>Alter<\/td>\n<td>ab 16<\/td>\n<\/tr>\n<tr>\n<td>Gültig<\/td>\n<td>unbefristet. Erlaubt Boote/Yachten bis <strong>30 BT<\/strong> (ca. 18–20 m), ohne PS-Grenze. <strong>UKW-Funkberechtigung ist enthalten<\/strong>, gilt aber nur für kroatische Gewässer<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"co co-info\"><div class=\"co-t\">Zu „geleakten Tests“<\/div><p>Es gibt <strong>keinen schriftlichen Test<\/strong> und <strong>keinen offiziellen Fragenkatalog<\/strong>, also kann auch nichts geleakt sein. Die Prüfer fragen frei aus ihrem eigenen Fragenpool. Die Bootsschulen sammeln, was immer wieder kommt. Daraus sind <a href=\"#\" data-ch=\"11\">Übungsfragen<\/a> gebaut, zusammen mit echten Beispielfragen der Schule AC Nautik und dem Erfahrungsbericht eines Kandidaten (Index.hr).<\/p><\/div>\n\n<div class=\"co co-tip\"><div class=\"co-t\">Totale Anfänger: zuerst hier<\/div><p><strong>00a Bootssprache – Grundbegriffe<\/strong>: alle Bootswörter in Alltagssprache, mit Bild. Jedes Kapitel beginnt außerdem mit einem Kasten „Worum geht's überhaupt?“.<\/p><\/div>\n\n<h2>Die 30 %, die 80 % der Prüfung ausmachen<\/h2>\n<p>Reihenfolge = Priorität. Was fett ist, kommt <strong>fast immer<\/strong>.<\/p>\n<ol>\n<li>\n<p><strong>Zuerst: die Fragenliste aus eurem Kurs<\/strong> mit Antworten zum Aufsagen → <a href=\"#\" data-ch=\"16\">Kursblatt-Fragen<\/a><\/p>\n<\/li>\n<li>\n<p><strong>Seekarte<\/strong>: Position ablesen/eintragen, <strong>Distanz auf der Breitenskala<\/strong>, Kartenzeichen → <a href=\"#\" data-ch=\"06\">Navigation &amp; Seekarte<\/a><\/p>\n<\/li>\n<li><strong>Lichterführung<\/strong>: Was siehst du nachts, wer ist das → <a href=\"#\" data-ch=\"01\">Lichterführung<\/a><\/li>\n<li><strong>Ausweichregeln<\/strong>: wer weicht wem → <a href=\"#\" data-ch=\"02\">Ausweichregeln<\/a><\/li>\n<li><strong>Seezeichen<\/strong>, vor allem <strong>Kardinalzeichen<\/strong>, und Lateral rot/grün → <a href=\"#\" data-ch=\"03\">Seezeichen<\/a><\/li>\n<li><strong>Notfall<\/strong>: <strong>MAYDAY-Meldung<\/strong>, <strong>Kanal 16<\/strong>, <strong>Tel. 195<\/strong>, Mann über Bord → <a href=\"#\" data-ch=\"05\">UKW-Funk<\/a> · <a href=\"#\" data-ch=\"10\">Kroatien-Recht &amp; Notfall<\/a><\/li>\n<li><strong>Windrose / Bura / Jugo / Maestral<\/strong> → <a href=\"#\" data-ch=\"07\">Wetter Adria<\/a><\/li>\n<li><strong>Knoten<\/strong>: Palstek, Webeleinstek, Klampe, Achter → <a href=\"#\" data-ch=\"08\">Knoten &amp; Seemannschaft<\/a><\/li>\n<li><strong>Motor-Warnlampen<\/strong>: Öldruck, Temperatur → <a href=\"#\" data-ch=\"09\">Motor &amp; Technik<\/a><\/li>\n<li>Schall- und Notsignale → <a href=\"#\" data-ch=\"04\">Schall- und Notsignale<\/a><\/li>\n<li><strong>Funk-ABC<\/strong> (buchstabieren) → <a href=\"#\" data-ch=\"05\">UKW-Funk<\/a><\/li>\n<li>Ausrüstung, Flaggen, Gesundheit, <strong>Prüfungstag<\/strong> → <a href=\"#\" data-ch=\"12\">Ausrüstung, Flaggen &amp; Praxis<\/a><\/li>\n<li><strong>Manöver<\/strong>: Anlegen, Ablegen, Ankern, Radeffekt → <a href=\"#\" data-ch=\"13\">Manöver<\/a><\/li>\n<li><strong>Seekarten-Übung<\/strong> mit Lösungen + Kompass-Rechnen → <a href=\"#\" data-ch=\"14\">Seekarten-Übung<\/a><\/li>\n<li>Fachwörter <strong>Englisch/Kroatisch<\/strong> (falls die Prüfung nicht auf Deutsch ist) → <a href=\"#\" data-ch=\"15\">Fachwörter DE-EN-HR<\/a><\/li>\n<\/ol>\n<h2>7-Tage-Lernplan (60–90 min pro Tag)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tag<\/th>\n<th>Thema<\/th>\n<th>Erledigt<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Lichter + Hierarchie „wer weicht wem“<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Ausweichregeln + Schallsignale<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Seezeichen (Kardinal auswendig!) + Feuerkennungen<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Seekarte: Position, Distanz, Kurs, Kompass-Rechnung. <strong>Musteraufgabe in Kapitel 14 nachrechnen, dann mit echter Karte üben<\/strong><\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Funk: MAYDAY auswendig aufsagen + Notsignale + Kroatien-Regeln<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Wetter + Knoten (Seil kaufen, je 20× knoten) + Motor + <strong>Manöver (Kapitel 13)<\/strong><\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><strong>Kursblatt-Fragen (Kapitel 16)<\/strong> laut aufsagen, dann <strong>Prüfer-Modus<\/strong> und <strong>Bilder-Quiz<\/strong> in der App, dann alle <a href=\"#\" data-ch=\"11\">Übungsfragen<\/a>. Was falsch war, nochmal<\/td>\n<td>☐<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Tipp:<\/strong> Die Prüfung ist mündlich, also <strong>laut antworten<\/strong> üben und nicht nur lesen. Am besten fragt dich jemand ab.<\/p>\n<h2>Nächste Schritte<\/h2>\n<ul>\n<li>[ ] Bootsschule mit Kurs + Prüfungstermin wählen (Wochenend-Pakete gibt es in Rijeka, Split, Zadar …) und dabei fragen: <strong>Gilt die neue Praxispflicht schon?<\/strong><\/li>\n<li>[ ] Prüfungssprache klären (Deutsch nicht überall)<\/li>\n<li>[ ] 2 Passfotos 3 × 3,5 cm machen<\/li>\n<li>[ ] Seil (ca. 1,5 m, 8–10 mm) für die Knoten besorgen<\/li>\n<li>[ ] Optional eine Lern-App, z. B. Nautly (Voditelj brodice B), oder ein Fragenkatalog-Buch („Das kroatische Küstenpatent – Fragenkatalog“)<\/li>\n<\/ul>\n<h2>Quellen<\/h2>\n<ul>\n<li>HRT, 22.06.2026: <a href=\"https://vijesti.hrt.hr/hrvatska/za-upravljanje-brodicom-vise-nece-biti-dovoljan-samo-ispit-12779728\">Za upravljanje brodicom više neće biti dovoljan samo ispit<\/a><\/li>\n<li>Nautička Patrola, 22.07.2026: <a href=\"https://www.nauticka-patrola.hr/paznja-evo-sto-donose-nove-odredbe-za-voditelje-brodica-i-skipere/\">Što donose nove odredbe za voditelje brodica<\/a><\/li>\n<li>Seamasterclass (06/2026, Preise Stand 31.10.2026): <a href=\"https://seamasterclass.com.hr/kako-poloziti-ispit-za-voditelja-brodice-b/\">Kako položiti ispit<\/a> · <a href=\"https://seamasterclass.com.hr/cesta-pitanja-voditelj-brodice-b-kategorije/\">FAQ<\/a><\/li>\n<li>Nautly: <a href=\"https://nautly.io/\">Croatian Boat Licence App<\/a><\/li>\n<li>AC Nautik: <a href=\"https://www.kuestenpatent-kroatien.at/ac-nautik-blog/pruefungsfragen-fuer-den-boat-skipper-b-sinn-oder-unsinn/\">Prüfungsfragen Boat Skipper B<\/a> · <a href=\"https://www.kuestenpatent-kroatien.at/ac-nautik-blog/bootsfuehrerschein-kroatien-pruefungsfragen/\">Prüfungsthemen<\/a><\/li>\n<li>Index.hr, 2019, Erfahrungsbericht: <a href=\"https://www.index.hr/clanak.aspx?id=2108504\">Indexov novinar postao voditelj brodice<\/a><\/li>\n<li>Bootsschule1: <a href=\"https://bootsschule1.de/blog/bootsfuehrerschein-kroatien/\">Bootsführerschein Kroatien<\/a><\/li>\n<\/ul>"},{"n":"00a","t":"Bootssprache – Grundbegriffe","h":"<div class=\"co co-tip\"><div class=\"co-t\">Für totale Anfänger: hier anfangen<\/div><p>Auf dem Boot hat fast alles einen eigenen Namen. Lies diese Seite einmal ganz durch, bevor du die Kapitel lernst, und schlag hier nach, wenn dir ein Wort unklar ist.<\/p><\/div>\n\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20900%20760'%20width%3D'900'%20height%3D'760'%20font-family%3D'Segoe%20UI%2C%20Arial%2C%20sans-serif'%3E%3Crect%20width%3D'900'%20height%3D'760'%20fill%3D'%23ffffff'%2F%3E%3Ctext%20x%3D'450.0'%20y%3D'40'%20font-size%3D'24'%20fill%3D'%230b2545'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3EBootssprache%3A%20Richtungen%20am%20Boot%3C%2Ftext%3E%3Ctext%20x%3D'450.0'%20y%3D'66'%20font-size%3D'15'%20fill%3D'%23444'%20text-anchor%3D'middle'%20font-weight%3D'normal'%3EImmer%20vom%20Boot%20aus%20gesehen%2C%20mit%20Blick%20nach%20vorne%3C%2Ftext%3E%3Cg%20transform%3D'translate(450%2C400)'%3E%3Cpath%20d%3D'M0%2C-210%20C95%2C-120%2090%2C90%2075%2C190%20L-75%2C190%20C-90%2C90%20-95%2C-120%200%2C-210%20Z'%20fill%3D'%23dbe8f0'%20stroke%3D'%230b2545'%20stroke-width%3D'4'%2F%3E%3Cline%20x1%3D'-95'%20y1%3D'0'%20x2%3D'95'%20y2%3D'0'%20stroke%3D'%230b2545'%20stroke-dasharray%3D'6%205'%20stroke-width%3D'2'%2F%3E%3Crect%20x%3D'-30'%20y%3D'60'%20width%3D'60'%20height%3D'60'%20rx%3D'6'%20fill%3D'%23fff'%20stroke%3D'%230b2545'%20stroke-width%3D'2'%2F%3E%3C%2Fg%3E%3Ctext%20x%3D'450'%20y%3D'495'%20font-size%3D'12'%20fill%3D'%230b2545'%20text-anchor%3D'middle'%20font-weight%3D'normal'%3ESteuerstand%3C%2Ftext%3E%3Ctext%20x%3D'450'%20y%3D'175'%20font-size%3D'18'%20fill%3D'%230b2545'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3EBUG%20%3D%20vorne%20(Spitze)%3C%2Ftext%3E%3Ctext%20x%3D'450'%20y%3D'622'%20font-size%3D'18'%20fill%3D'%230b2545'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3EHECK%20%3D%20hinten%3C%2Ftext%3E%3Crect%20x%3D'120'%20y%3D'360'%20width%3D'200'%20height%3D'80'%20rx%3D'10'%20fill%3D'%23d62828'%2F%3E%3Ctext%20x%3D'220'%20y%3D'392'%20font-size%3D'20'%20fill%3D'%23ffffff'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3EBACKBORD%3C%2Ftext%3E%3Ctext%20x%3D'220'%20y%3D'418'%20font-size%3D'14'%20fill%3D'%23ffffff'%20text-anchor%3D'middle'%20font-weight%3D'normal'%3E%3D%20links%20%C2%B7%20rotes%20Licht%3C%2Ftext%3E%3Crect%20x%3D'580'%20y%3D'360'%20width%3D'200'%20height%3D'80'%20rx%3D'10'%20fill%3D'%231b9e3e'%2F%3E%3Ctext%20x%3D'680'%20y%3D'392'%20font-size%3D'20'%20fill%3D'%23ffffff'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3ESTEUERBORD%3C%2Ftext%3E%3Ctext%20x%3D'680'%20y%3D'418'%20font-size%3D'14'%20fill%3D'%23ffffff'%20text-anchor%3D'middle'%20font-weight%3D'normal'%3E%3D%20rechts%20%C2%B7%20gr%C3%BCnes%20Licht%3C%2Ftext%3E%3Ctext%20x%3D'575'%20y%3D'348'%20font-size%3D'13'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3Equerab%20%3D%20genau%20seitlich%3C%2Ftext%3E%3Cline%20x1%3D'450'%20y1%3D'150'%20x2%3D'450'%20y2%3D'100'%20stroke%3D'%23555'%20stroke-width%3D'3'%2F%3E%3Cpolygon%20points%3D'450%2C88%20441%2C104%20459%2C104'%20fill%3D'%23555'%2F%3E%3Ctext%20x%3D'464'%20y%3D'110'%20font-size%3D'14'%20fill%3D'%23555'%20text-anchor%3D'start'%20font-weight%3D'normal'%3Evoraus%3C%2Ftext%3E%3Cline%20x1%3D'450'%20y1%3D'635'%20x2%3D'450'%20y2%3D'680'%20stroke%3D'%23555'%20stroke-width%3D'3'%2F%3E%3Cpolygon%20points%3D'450%2C692%20441%2C676%20459%2C676'%20fill%3D'%23555'%2F%3E%3Ctext%20x%3D'464'%20y%3D'680'%20font-size%3D'14'%20fill%3D'%23555'%20text-anchor%3D'start'%20font-weight%3D'normal'%3Eachteraus%20(nach%20hinten)%3C%2Ftext%3E%3Ctext%20x%3D'120'%20y%3D'140'%20font-size%3D'16'%20fill%3D'%231f5fbf'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3EWind%3C%2Ftext%3E%3Cline%20x1%3D'60'%20y1%3D'160'%20x2%3D'170'%20y2%3D'160'%20stroke%3D'%231f5fbf'%20stroke-width%3D'3'%2F%3E%3Cpolygon%20points%3D'182%2C160%20168%2C153%20168%2C167'%20fill%3D'%231f5fbf'%2F%3E%3Cline%20x1%3D'60'%20y1%3D'185'%20x2%3D'170'%20y2%3D'185'%20stroke%3D'%231f5fbf'%20stroke-width%3D'3'%2F%3E%3Cpolygon%20points%3D'182%2C185%20168%2C178%20168%2C192'%20fill%3D'%231f5fbf'%2F%3E%3Cline%20x1%3D'60'%20y1%3D'210'%20x2%3D'170'%20y2%3D'210'%20stroke%3D'%231f5fbf'%20stroke-width%3D'3'%2F%3E%3Cpolygon%20points%3D'182%2C210%20168%2C203%20168%2C217'%20fill%3D'%231f5fbf'%2F%3E%3Ctext%20x%3D'160'%20y%3D'250'%20font-size%3D'14'%20fill%3D'%231f5fbf'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3ELUV%20%3D%20die%20Seite%2C%3C%2Ftext%3E%3Ctext%20x%3D'160'%20y%3D'268'%20font-size%3D'13'%20fill%3D'%231f5fbf'%20text-anchor%3D'middle'%20font-weight%3D'normal'%3Eauf%20die%20der%20Wind%20trifft%3C%2Ftext%3E%3Ctext%20x%3D'740'%20y%3D'250'%20font-size%3D'14'%20fill%3D'%231f5fbf'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3ELEE%20%3D%20die%20windabgewandte%2C%3C%2Ftext%3E%3Ctext%20x%3D'740'%20y%3D'268'%20font-size%3D'13'%20fill%3D'%231f5fbf'%20text-anchor%3D'middle'%20font-weight%3D'normal'%3Egesch%C3%BCtzte%20Seite%3C%2Ftext%3E%3Ctext%20x%3D'450.0'%20y%3D'735'%20font-size%3D'15'%20fill%3D'%230b2545'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3EEselsbr%C3%BCcke%3A%20Fr%C3%BCher%20hing%20das%20Steuer-Ruder%20rechts%20am%20Boot%20%E2%86%92%20STEUERbord%20%3D%20rechts%3C%2Ftext%3E%3C%2Fsvg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<h2>Boot &amp; Richtungen<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Was heißt das?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Bug<\/strong><\/td>\n<td>Die vordere Spitze des Bootes.<\/td>\n<\/tr>\n<tr>\n<td><strong>Heck<\/strong><\/td>\n<td>Das hintere Ende des Bootes, dort ist meist der Motor.<\/td>\n<\/tr>\n<tr>\n<td><strong>Steuerbord<\/strong><\/td>\n<td>Die rechte Seite des Bootes, wenn du nach vorne schaust. Erkennbar am grünen Licht.<\/td>\n<\/tr>\n<tr>\n<td><strong>Backbord<\/strong><\/td>\n<td>Die linke Seite des Bootes, wenn du nach vorne schaust. Erkennbar am roten Licht.<\/td>\n<\/tr>\n<tr>\n<td><strong>querab<\/strong><\/td>\n<td>Genau seitlich vom Boot, also im rechten Winkel zur Fahrtrichtung.<\/td>\n<\/tr>\n<tr>\n<td><strong>achterlich<\/strong> (achteraus)<\/td>\n<td>Weiter nach hinten. „Achteraus“ heißt hinter dem Boot.<\/td>\n<\/tr>\n<tr>\n<td><strong>Luv<\/strong><\/td>\n<td>Die Seite, von der der Wind kommt.<\/td>\n<\/tr>\n<tr>\n<td><strong>Lee<\/strong><\/td>\n<td>Die Seite, die vom Wind abgewandt ist, also die geschützte Seite.<\/td>\n<\/tr>\n<tr>\n<td><strong>Bug (Segeln)<\/strong> (Backbordbug, Steuerbordbug)<\/td>\n<td>Beim Segeln: Kommt der Wind von rechts, fährt das Boot auf Steuerbordbug. Kommt er von links, auf Backbordbug.<\/td>\n<\/tr>\n<tr>\n<td><strong>Bilge<\/strong><\/td>\n<td>Der tiefste Raum ganz unten im Rumpf. Dort sammelt sich Wasser, Öl und bei Benzinern auch gefährlicher Benzindampf.<\/td>\n<\/tr>\n<tr>\n<td><strong>Klampe<\/strong><\/td>\n<td>Ein Metall-Beschlag mit zwei „Hörnern“ am Boot oder am Steg, an dem du die Leine festmachst.<\/td>\n<\/tr>\n<tr>\n<td><strong>Fender<\/strong><\/td>\n<td>Ein Gummi-Puffer, der zwischen Boot und Steg hängt, damit nichts zerkratzt.<\/td>\n<\/tr>\n<tr>\n<td><strong>Reling<\/strong><\/td>\n<td>Das Geländer rund ums Deck.<\/td>\n<\/tr>\n<tr>\n<td><strong>Leine<\/strong> (Tau, Schot)<\/td>\n<td>Seemännisch für Seil. „Schot“ ist die Leine, mit der man ein Segel einstellt.<\/td>\n<\/tr>\n<tr>\n<td><strong>Muring<\/strong> (Muringleine, Mooring)<\/td>\n<td>Eine Leine, die am Meeresgrund an einem Betonklotz befestigt ist. Im Hafen ziehst du sie hoch und machst damit den Bug fest, das Heck kommt an den Steg.<\/td>\n<\/tr>\n<tr>\n<td><strong>Vorstag<\/strong><\/td>\n<td>Das Drahtseil vom Mast nach vorne zum Bug. Dort hängt man z. B. den Ankerball auf.<\/td>\n<\/tr>\n<tr>\n<td><strong>Backskiste<\/strong><\/td>\n<td>Ein Stauraum unter den Sitzbänken im Cockpit. Dort liegen oft Leinen, Fender und der Ankerball.<\/td>\n<\/tr>\n<tr>\n<td><strong>Cockpit<\/strong><\/td>\n<td>Der offene Sitzbereich hinten an Deck, wo das Steuer ist.<\/td>\n<\/tr>\n<tr>\n<td><strong>Niedergang<\/strong> (Navigationstisch, Kartentisch)<\/td>\n<td>Die Treppe vom Cockpit hinunter in die Kajüte. Gleich daneben ist meist der Navigationstisch (Kartentisch) mit Seekarte und Funkgerät.<\/td>\n<\/tr>\n<tr>\n<td><strong>BT<\/strong> (BRT, GT)<\/td>\n<td>Bruttoraumzahl, ein Maß für die Größe (das Volumen) eines Schiffs, nicht für das Gewicht. 30 BT entspricht etwa einer Yacht von 18–20 m.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Navigation<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Was heißt das?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Seemeile<\/strong> (sm, NM)<\/td>\n<td>Das Längenmaß auf See: 1 Seemeile (sm) = 1852 m. Das ist genau eine Bogenminute auf der Breitenskala der Seekarte.<\/td>\n<\/tr>\n<tr>\n<td><strong>Knoten (Geschwindigkeit)<\/strong> (kn)<\/td>\n<td>Die Geschwindigkeit auf See: 1 Knoten (kn) = 1 Seemeile pro Stunde, also etwa 1,85 km/h. 10 kn sind etwa 18,5 km/h.<\/td>\n<\/tr>\n<tr>\n<td><strong>Breite (Koordinate)<\/strong> (Breitengrad, Breitenskala, Latitude)<\/td>\n<td>Wie weit nördlich vom Äquator du bist. Auf der Seekarte sind das die waagrechten Linien, abgelesen am seitlichen Rand.<\/td>\n<\/tr>\n<tr>\n<td><strong>Länge (Koordinate)<\/strong> (Längengrad, Längenskala, Longitude)<\/td>\n<td>Wie weit östlich (oder westlich) von Greenwich du bist. Auf der Karte sind das die senkrechten Linien, abgelesen am oberen oder unteren Rand.<\/td>\n<\/tr>\n<tr>\n<td><strong>Bogenminute<\/strong><\/td>\n<td>Ein Grad wird in 60 Minuten geteilt. Auf der Breitenskala ist 1 Minute genau 1 Seemeile lang.<\/td>\n<\/tr>\n<tr>\n<td><strong>Kurs<\/strong><\/td>\n<td>Die Richtung, in die du fährst, in Grad von 000° bis 360°. 000° ist Norden, 090° Osten, 180° Süden, 270° Westen.<\/td>\n<\/tr>\n<tr>\n<td><strong>Peilung<\/strong> (peilen)<\/td>\n<td>Die Richtung, in der du ein anderes Objekt siehst, zum Beispiel ein Schiff oder einen Leuchtturm. Bleibt die Peilung zu einem anderen Schiff gleich, droht ein Zusammenstoß.<\/td>\n<\/tr>\n<tr>\n<td><strong>Missweisung<\/strong> (Mw)<\/td>\n<td>Der Kompass zeigt nicht genau zum geografischen Nordpol, sondern zum magnetischen. Der Unterschied heißt Missweisung und steht in der Seekarte, in der Adria etwa 4–5°.<\/td>\n<\/tr>\n<tr>\n<td><strong>Ablenkung<\/strong> (Deviation, Abl)<\/td>\n<td>Eisen und Elektrik an Bord lenken den Kompass zusätzlich ein bisschen ab.<\/td>\n<\/tr>\n<tr>\n<td><strong>rechtweisend<\/strong> (rwK)<\/td>\n<td>Der „wahre“ Kurs bezogen auf geografisch Nord. So steht er in der Seekarte.<\/td>\n<\/tr>\n<tr>\n<td><strong>Zirkel<\/strong> (Kartenzirkel)<\/td>\n<td>Ein Werkzeug mit zwei Spitzen, mit dem du in der Seekarte Entfernungen abgreifst.<\/td>\n<\/tr>\n<tr>\n<td><strong>Kursdreieck<\/strong><\/td>\n<td>Ein Geodreieck für die Seekarte, mit dem du Kurse einzeichnest und abliest.<\/td>\n<\/tr>\n<tr>\n<td><strong>Tragweite<\/strong><\/td>\n<td>Bis zu welcher Entfernung ein Leuchtfeuer zu sehen ist, angegeben in Seemeilen.<\/td>\n<\/tr>\n<tr>\n<td><strong>Fahrwasser<\/strong><\/td>\n<td>Der Bereich, in dem Schiffe sicher fahren können, oft mit roten und grünen Tonnen markiert.<\/td>\n<\/tr>\n<tr>\n<td><strong>Hoheitsgewässer<\/strong><\/td>\n<td>Das Meer bis 12 sm vor der Küste, das noch zum Staatsgebiet gehört.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Seezeichen &amp; Lichter<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Was heißt das?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Tonne<\/strong> (Tonnen, Boje)<\/td>\n<td>Ein schwimmendes, am Grund verankertes Seezeichen. Es zeigt, wo du fahren darfst und wo Gefahr ist.<\/td>\n<\/tr>\n<tr>\n<td><strong>Lateralzeichen<\/strong><\/td>\n<td>Die roten und grünen Tonnen, die den Rand eines Fahrwassers markieren, wie Leitpfosten an der Straße.<\/td>\n<\/tr>\n<tr>\n<td><strong>Kardinalzeichen<\/strong> (Kardinaltonne)<\/td>\n<td>Die gelb-schwarzen Tonnen. Sie zeigen, auf welcher Himmelsrichtung (Nord, Ost, Süd, West) das sichere Wasser liegt.<\/td>\n<\/tr>\n<tr>\n<td><strong>Toppzeichen<\/strong><\/td>\n<td>Die Form ganz oben auf einer Tonne, z. B. zwei Kegel oder ein Ball. Damit erkennst du die Tonne auch ohne Farbe.<\/td>\n<\/tr>\n<tr>\n<td><strong>Leuchtfeuer<\/strong> (Feuer, Feuerkennung)<\/td>\n<td>Ein Leuchtturm oder eine Leuchttonne. Jedes blinkt in seinem eigenen Rhythmus (Feuerkennung), damit du es nachts erkennst.<\/td>\n<\/tr>\n<tr>\n<td><strong>Topplicht<\/strong><\/td>\n<td>Weißes Licht vorne oben am Mast. Es leuchtet nach vorne und zeigt an: „Ich fahre mit Motor“.<\/td>\n<\/tr>\n<tr>\n<td><strong>Seitenlicht<\/strong> (Seitenlichter)<\/td>\n<td>Rotes Licht links und grünes Licht rechts. Daran siehst du nachts, welche Seite eines Bootes du gerade siehst.<\/td>\n<\/tr>\n<tr>\n<td><strong>Hecklicht<\/strong><\/td>\n<td>Weißes Licht hinten. Siehst du nur dieses, fährt das Boot von dir weg.<\/td>\n<\/tr>\n<tr>\n<td><strong>Rundumlicht<\/strong> (Rundumlichter)<\/td>\n<td>Ein Licht, das in alle Richtungen (360°) leuchtet.<\/td>\n<\/tr>\n<tr>\n<td><strong>Signalkörper<\/strong><\/td>\n<td>Schwarze Bälle, Kegel und Zylinder, die Schiffe tagsüber aufhängen. Sie bedeuten dasselbe wie die Lichter in der Nacht.<\/td>\n<\/tr>\n<tr>\n<td><strong>Sektor<\/strong><\/td>\n<td>Ein „Tortenstück“ des Kreises, in das ein Licht strahlt. Das Topplicht leuchtet zum Beispiel 225° nach vorne.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Regeln<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Was heißt das?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>KVR<\/strong> (COLREG)<\/td>\n<td>Die internationalen Kollisionsverhütungsregeln, also die „Straßenverkehrsordnung“ auf See.<\/td>\n<\/tr>\n<tr>\n<td><strong>Kurshalter<\/strong><\/td>\n<td>Das Boot, das Vorrang hat. Es muss Kurs und Geschwindigkeit beibehalten, damit der andere berechenbar ausweichen kann.<\/td>\n<\/tr>\n<tr>\n<td><strong>Ausweichpflichtiger<\/strong> (ausweichen)<\/td>\n<td>Das Boot, das Platz machen muss, früh und deutlich.<\/td>\n<\/tr>\n<tr>\n<td><strong>Maschinenfahrzeug<\/strong><\/td>\n<td>Jedes Boot, das mit Motor fährt. Auch ein Segelboot, sobald der Motor läuft.<\/td>\n<\/tr>\n<tr>\n<td><strong>Manövrierunfähig<\/strong> (NUC)<\/td>\n<td>Ein Schiff, das nicht steuern kann, z. B. weil das Ruder kaputt ist (englisch: Not Under Command).<\/td>\n<\/tr>\n<tr>\n<td><strong>Manövrierbehindert<\/strong> (RAM)<\/td>\n<td>Ein Schiff, das wegen seiner Arbeit nicht ausweichen kann, z. B. ein Bagger, Kabelleger oder Taucherschiff.<\/td>\n<\/tr>\n<tr>\n<td><strong>Tiefgangbehindert<\/strong> (CBD)<\/td>\n<td>Ein großes Schiff, das wegen seines Tiefgangs nur in einer tiefen Rinne fahren kann.<\/td>\n<\/tr>\n<tr>\n<td><strong>Tiefgang<\/strong><\/td>\n<td>Wie tief das Boot unter Wasser reicht.<\/td>\n<\/tr>\n<tr>\n<td><strong>Hafenamt<\/strong> (Lučka kapetanija, Hafenkapitanat)<\/td>\n<td>Die kroatische Behörde für Schifffahrt in einem Hafen. Dort legst du die Prüfung ab.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Funk &amp; Notfall<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Was heißt das?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>UKW<\/strong> (VHF, Funkgerät)<\/td>\n<td>Das Seefunkgerät an Bord. Die Reichweite liegt bei etwa 20–30 sm, ähnlich wie bei einem Walkie-Talkie.<\/td>\n<\/tr>\n<tr>\n<td><strong>Kanal 16<\/strong><\/td>\n<td>Der Notruf- und Anrufkanal am Funkgerät. Den hören alle Schiffe und die Küstenwache mit.<\/td>\n<\/tr>\n<tr>\n<td><strong>DSC<\/strong><\/td>\n<td>Digitaler Notruf per Knopfdruck am Funkgerät. Er schickt automatisch deine Position und Kennung.<\/td>\n<\/tr>\n<tr>\n<td><strong>MMSI<\/strong><\/td>\n<td>Die 9-stellige „Telefonnummer“ deines Funkgeräts bzw. Bootes.<\/td>\n<\/tr>\n<tr>\n<td><strong>Rufzeichen<\/strong><\/td>\n<td>Der offizielle Funk-Name des Bootes, z. B. 9A1234.<\/td>\n<\/tr>\n<tr>\n<td><strong>MAYDAY<\/strong><\/td>\n<td>Das Funkwort für höchste Not: Lebensgefahr.<\/td>\n<\/tr>\n<tr>\n<td><strong>PAN PAN<\/strong><\/td>\n<td>Das Funkwort für einen dringenden Notfall ohne unmittelbare Lebensgefahr.<\/td>\n<\/tr>\n<tr>\n<td><strong>SÉCURITÉ<\/strong><\/td>\n<td>Das Funkwort für eine Sicherheitsmeldung, z. B. eine Wetterwarnung oder Treibgut.<\/td>\n<\/tr>\n<tr>\n<td><strong>MRCC<\/strong><\/td>\n<td>Die Seenotleitstelle, die Rettungen koordiniert. In Kroatien ist das MRCC Rijeka, Telefon 195.<\/td>\n<\/tr>\n<tr>\n<td><strong>EPIRB<\/strong> (PLB)<\/td>\n<td>Ein Notsender, der per Satellit deine Position meldet.<\/td>\n<\/tr>\n<tr>\n<td><strong>MOB<\/strong> (Mann über Bord)<\/td>\n<td>Mann über Bord: Jemand ist ins Wasser gefallen. Viele Plotter haben dafür eine eigene MOB-Taste, die die Position speichert.<\/td>\n<\/tr>\n<tr>\n<td><strong>Plotter<\/strong> (GPS)<\/td>\n<td>Ein Bildschirm mit Seekarte und GPS-Position, das Navi fürs Boot.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Wetter<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Was heißt das?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Beaufort<\/strong> (Bft)<\/td>\n<td>Die Skala für Windstärke von 0 (Stille) bis 12 (Orkan). Ab 6 Bft wird es für kleine Boote ungemütlich.<\/td>\n<\/tr>\n<tr>\n<td><strong>Bura<\/strong><\/td>\n<td>Ein kalter, sehr böiger Fallwind aus Nordost, der oft plötzlich kommt. Er ist der gefährlichste Wind der Adria.<\/td>\n<\/tr>\n<tr>\n<td><strong>Jugo<\/strong><\/td>\n<td>Ein warmer, feuchter Wind aus Südost. Er bringt Wolken, Regen und hohe Wellen.<\/td>\n<\/tr>\n<tr>\n<td><strong>Maestral<\/strong><\/td>\n<td>Ein angenehmer Sommerwind aus Nordwest, der nachmittags weht.<\/td>\n<\/tr>\n<tr>\n<td><strong>Böe<\/strong> (böig, Böen)<\/td>\n<td>Ein kurzer, plötzlicher Windstoß, der deutlich stärker ist als der normale Wind.<\/td>\n<\/tr>\n<tr>\n<td><strong>Seegang<\/strong> (Dünung)<\/td>\n<td>Die Wellen. Dünung sind lange Wellen, die von weit her kommen, auch ohne Wind vor Ort.<\/td>\n<\/tr>\n<tr>\n<td><strong>Luftdruck<\/strong> (Barometer, hPa)<\/td>\n<td>Fällt der Luftdruck schnell, kommt meist schlechtes Wetter oder Sturm. Gemessen wird er mit dem Barometer in hPa.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Technik<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Was heißt das?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Impeller<\/strong><\/td>\n<td>Ein kleines Gummi-Flügelrad in der Kühlwasserpumpe. Ist es kaputt, überhitzt der Motor.<\/td>\n<\/tr>\n<tr>\n<td><strong>Seeventil<\/strong><\/td>\n<td>Ein Absperrhahn im Rumpf, durch den Meerwasser zum Kühlen angesaugt wird. Er muss beim Motorstart offen sein.<\/td>\n<\/tr>\n<tr>\n<td><strong>Seewasserfilter<\/strong><\/td>\n<td>Ein Sieb vor der Kühlwasserpumpe, damit kein Dreck oder Plastik angesaugt wird.<\/td>\n<\/tr>\n<tr>\n<td><strong>Keilriemen<\/strong><\/td>\n<td>Ein Gummiriemen am Motor, der Pumpe und Lichtmaschine antreibt.<\/td>\n<\/tr>\n<tr>\n<td><strong>Lichtmaschine<\/strong><\/td>\n<td>Der Generator am Motor, der die Batterie lädt, wie beim Auto.<\/td>\n<\/tr>\n<tr>\n<td><strong>Außenborder<\/strong><\/td>\n<td>Ein Motor, der außen am Heck hängt, typisch bei kleinen Booten.<\/td>\n<\/tr>\n<tr>\n<td><strong>Schraube<\/strong> (Propeller)<\/td>\n<td>Der Propeller unter Wasser. Für Menschen im Wasser ist er lebensgefährlich.<\/td>\n<\/tr>\n<tr>\n<td><strong>auskuppeln<\/strong> (Leerlauf, Neutral)<\/td>\n<td>Den Gashebel in die Mitte stellen: Der Motor läuft, aber die Schraube dreht sich nicht.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Manöver<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Was heißt das?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Radeffekt<\/strong><\/td>\n<td>Die drehende Schraube schiebt das Heck seitlich weg, besonders beim Rückwärtsfahren. Bei rechtsdrehender Schraube zieht das Heck rückwärts nach Backbord.<\/td>\n<\/tr>\n<tr>\n<td><strong>Vorspring<\/strong> (Spring)<\/td>\n<td>Eine Leine, die vom Bug schräg nach hinten zum Steg läuft. Mit ihr kann man das Heck vom Steg wegdrehen (eindampfen).<\/td>\n<\/tr>\n<tr>\n<td><strong>eindampfen<\/strong><\/td>\n<td>Mit Motorkraft gegen eine festgemachte Leine fahren, damit sich das Boot dreht. Zum Beispiel beim Ablegen in die Vorspring.<\/td>\n<\/tr>\n<tr>\n<td><strong>Schwojkreis<\/strong> (schwojen)<\/td>\n<td>Der Kreis, in dem sich ein ankerndes Boot bei drehendem Wind um seinen Anker bewegt.<\/td>\n<\/tr>\n<tr>\n<td><strong>slippen<\/strong> (slipt)<\/td>\n<td>Der Anker hält nicht und rutscht über den Grund.<\/td>\n<\/tr>\n<tr>\n<td><strong>Marinero<\/strong><\/td>\n<td>Der Hafenhelfer in der Marina. Er zeigt dir den Platz und reicht dir die Muringleine.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"},{"n":"01","t":"Lichterführung","h":"<div class=\"co co-abstract\"><div class=\"co-t\">Worum geht&#x27;s überhaupt? (Erklärung für Einsteiger)<\/div><p>Auf dem Wasser gibt es keine Straßen und keine Ampeln. Nachts siehst du von anderen Booten oft nur ein paar farbige Lichtpunkte. Diese Lichter sind ein <strong>Code<\/strong>: Aus ihren Farben und ihrer Anordnung erkennst du,<\/p>\n<ul>\n<li><strong>was<\/strong> für ein Fahrzeug das ist (Motorboot, Segler, Fischer, großes Schiff …),<\/li>\n<li><strong>in welche Richtung<\/strong> es fährt (kommt es auf dich zu oder fährt es weg?),<\/li>\n<li><strong>ob es Vorrang hat<\/strong> oder ob es dir ausweichen muss.<\/li>\n<\/ul>\n<p>Tagsüber hängen Schiffe stattdessen schwarze Formen auf, die <strong>Signalkörper<\/strong> (Bälle, Kegel). Die bedeuten dasselbe.\n<strong>Das Wichtigste zuerst:<\/strong> rot = links, grün = rechts, weiß vorne oben = Motor.<\/p>\n<p>Unbekannte Wörter? → 00a Bootssprache – Grundbegriffe<\/p><\/div>\n\n<div class=\"co co-tip\"><div class=\"co-t\">Kommt fast immer<\/div><p>Der Prüfer zeigt ein Bild oder beschreibt Lichter, zum Beispiel: „Du siehst rot über weiß und ein grünes Licht. Was ist das, und was machst du?“<\/p><\/div>\n\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 660' width='720' height='660' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='720' height='660' fill='%23ffffff'/%3E%3Ctext x='360' y='36' font-size='22' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ELichtersektoren eines Maschinenfahrzeugs (Draufsicht)%3C/text%3E%3Cpath d='M360,330 L129.0,425.7 A250,250 0 1 1 591.0,425.7 Z' fill='%23ffd84d' fill-opacity='0.3' stroke='none' stroke-width='2'/%3E%3Cpath d='M360,330 L360.0,130.0 A200,200 0 0 1 544.8,406.5 Z' fill='%231b9e3e' fill-opacity='0.55' stroke='none' stroke-width='2'/%3E%3Cpath d='M360,330 L175.2,406.5 A200,200 0 0 1 360.0,130.0 Z' fill='%23d62828' fill-opacity='0.55' stroke='none' stroke-width='2'/%3E%3Cpath d='M360,330 L544.8,406.5 A200,200 0 0 1 175.2,406.5 Z' fill='%239aa5b1' fill-opacity='0.45' stroke='none' stroke-width='2'/%3E%3Cg transform='translate(360,330) rotate(0)'%3E%3Cpath d='M0,-56.0 C25.2,-28.0 22.4,28.0 19.599999999999998,53.199999999999996 L-19.599999999999998,53.199999999999996 C-22.4,28.0 -25.2,-28.0 0,-56.0 Z' fill='%230b2545'/%3E%3C/g%3E%3Ctext x='360' y='95' font-size='17' fill='%237a5c00' text-anchor='middle' font-weight='bold'%3ETopplicht WEISS %C2%B7 225%C2%B0%3C/text%3E%3Ctext x='360' y='116' font-size='13' fill='%237a5c00' text-anchor='middle' font-weight='normal'%3E(von vorne bis 22,5%C2%B0 achterlicher als querab)%3C/text%3E%3Ctext x='506.06526015770584' y='251.71299351409544' font-size='16' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3ESTEUERBORD%3C/text%3E%3Ctext x='506.06526015770584' y='271.71299351409544' font-size='15' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EGR%C3%9CN 112,5%C2%B0%3C/text%3E%3Ctext x='213.93473984229414' y='251.71299351409544' font-size='16' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EBACKBORD%3C/text%3E%3Ctext x='213.93473984229414' y='271.71299351409544' font-size='15' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EROT 112,5%C2%B0%3C/text%3E%3Ctext x='360' y='480' font-size='16' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EHecklicht WEISS %C2%B7 135%C2%B0%3C/text%3E%3Ctext x='360' y='620' font-size='16' fill='%230b2545' text-anchor='middle' font-weight='normal'%3EMerke: 225%C2%B0 %2B 135%C2%B0 = 360%C2%B0  %C2%B7  112,5%C2%B0 %2B 112,5%C2%B0 = 225%C2%B0%3C/text%3E%3Ctext x='360' y='642' font-size='15' fill='%23d62828' text-anchor='middle' font-weight='bold'%3ESiehst du ROT und GR%C3%9CN gleichzeitig %E2%86%92 das Fahrzeug kommt genau auf dich zu%21%3C/text%3E%3C/svg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<h2>Die 4 Grundlichter<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Licht<\/th>\n<th>Farbe<\/th>\n<th>Sektor<\/th>\n<th>Merke<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Topplicht (Masthead)<\/td>\n<td>weiß<\/td>\n<td>225° nach vorne<\/td>\n<td>nur <strong>Maschinen<\/strong>fahrzeuge<\/td>\n<\/tr>\n<tr>\n<td>Seitenlicht Steuerbord (rechts)<\/td>\n<td><strong>grün<\/strong><\/td>\n<td>112,5°<\/td>\n<td>„<strong>S<\/strong>teuerbord = <strong>g<\/strong>rün“ (S-G)<\/td>\n<\/tr>\n<tr>\n<td>Seitenlicht Backbord (links)<\/td>\n<td><strong>rot<\/strong><\/td>\n<td>112,5°<\/td>\n<td>„<strong>B<\/strong>ackbord = <strong>r<\/strong>ot“ wie roter <strong>Port<\/strong>wein (Port = Backbord)<\/td>\n<\/tr>\n<tr>\n<td>Hecklicht<\/td>\n<td>weiß<\/td>\n<td>135° nach hinten<\/td>\n<td>sieht der Überholer<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Tragweiten bei Booten unter 12 m:<\/strong> Topplicht 2 sm · Seitenlichter 1 sm · Hecklicht 2 sm. (12–20 m: Topplicht 3 sm, Seiten 2 sm, Heck 2 sm.)<\/p>\n<h2>Was siehst du von einem anderen Boot?<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Du siehst<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weiß + <strong>rot + grün<\/strong><\/td>\n<td>kommt <strong>genau auf dich zu<\/strong> → beide nach Steuerbord ausweichen<\/td>\n<\/tr>\n<tr>\n<td>Weiß + nur <strong>rot<\/strong><\/td>\n<td>du siehst seine Backbordseite, es kommt <strong>von rechts<\/strong> → <strong>DU musst ausweichen<\/strong> (Ampel rot = du handelst)<\/td>\n<\/tr>\n<tr>\n<td>Weiß + nur <strong>grün<\/strong><\/td>\n<td>du siehst seine Steuerbordseite, es kommt <strong>von links<\/strong> → du bist Kurshalter (Ampel grün = weiterfahren, aufpassen)<\/td>\n<\/tr>\n<tr>\n<td>Nur ein weißes Licht (tief)<\/td>\n<td>Hecklicht → du bist der <strong>Überholer<\/strong> (oder es ist ein Ankerlieger)<\/td>\n<\/tr>\n<tr>\n<td>Rot + grün <strong>ohne<\/strong> Topplicht<\/td>\n<td><strong>Segler<\/strong> kommt auf dich zu<\/td>\n<\/tr>\n<tr>\n<td>2 weiße Topplichter übereinander<\/td>\n<td>Maschinenfahrzeug ≥ 50 m (hinteres Topplicht höher) <strong>oder<\/strong> Schlepper<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Merksatz:<\/strong> <em>„Grün an grün, rot an rot – alles klar, keine Not.“<\/em> Wenn sich zwei Boote ihre gleichfarbigen Seitenlichter zeigen, fahren sie sicher aneinander vorbei.<\/p>\n<h2>Je nach Fahrzeug<\/h2>\n<ul>\n<li><strong>Maschinenfahrzeug &lt; 50 m:<\/strong> Topplicht + Seitenlichter + Hecklicht<\/li>\n<li><strong>Maschinenfahrzeug &lt; 12 m:<\/strong> darf statt Topp- und Hecklicht <strong>ein weißes Rundumlicht<\/strong> + Seitenlichter führen<\/li>\n<li><strong>Boot &lt; 7 m und &lt; 7 kn:<\/strong> ein weißes Rundumlicht reicht<\/li>\n<li><strong>Segler:<\/strong> Seitenlichter + Hecklicht, <strong>kein Topplicht<\/strong>. Unter 20 m auch als <strong>Dreifarbenlaterne<\/strong> im Masttopp<\/li>\n<li><strong>Segler unter Motor = Maschinenfahrzeug<\/strong> → Topplicht an. Am Tag: <strong>schwarzer Kegel, Spitze nach unten<\/strong><\/li>\n<li><strong>Ruderboot:<\/strong> weiße Taschenlampe bereithalten<\/li>\n<\/ul>\n<h2>Rundumlichter und Signalkörper (Tag)<\/h2>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 760' width='900' height='760' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='900' height='760' fill='%23ffffff'/%3E%3Ctext x='450.0' y='40' font-size='24' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ERundumlichter (Nacht) und Signalk%C3%B6rper (Tag)%3C/text%3E%3Ctext x='450.0' y='66' font-size='14' fill='%23555' text-anchor='middle' font-weight='normal'%3ELichter von oben nach unten gelesen %C2%B7 so sieht man sie senkrecht am Mast%3C/text%3E%3Ctext x='30' y='96' font-size='15' fill='%230b2545' text-anchor='start' font-weight='bold'%3EFahrzeug%3C/text%3E%3Ctext x='340' y='96' font-size='15' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ENacht%3C/text%3E%3Ctext x='450' y='96' font-size='15' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ETag%3C/text%3E%3Ctext x='520' y='96' font-size='15' fill='%230b2545' text-anchor='start' font-weight='bold'%3EMerkhilfe%3C/text%3E%3Crect x='15' y='110' width='870' height='62' fill='%23eef3fa'/%3E%3Ctext x='30' y='146.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3EAnkerlieger%3C/text%3E%3Crect x='315' y='114' width='50' height='54' rx='6' fill='%230b1a2e'/%3E%3Ccircle cx='340' cy='141.0' r='7.5' fill='%23ffffff'/%3E%3Cg transform='translate(450,141.0) scale(0.7) translate(-450,-141.0)'%3E%3Ccircle cx='450' cy='141.0' r='11' fill='%231a1a1a'/%3E%3C/g%3E%3Ctext x='520' y='146.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3E1 wei%C3%9Fes Rundumlicht %C2%B7 Tag: 1 Ball%3C/text%3E%3Ctext x='30' y='208.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3EMan%C3%B6vrierunf%C3%A4hig (NUC)%3C/text%3E%3Crect x='315' y='176' width='50' height='54' rx='6' fill='%230b1a2e'/%3E%3Ccircle cx='340' cy='194.5' r='7.5' fill='%23d62828'/%3E%3Ccircle cx='340' cy='211.5' r='7.5' fill='%23d62828'/%3E%3Cg transform='translate(450,193.5) scale(0.7) translate(-450,-193.5)'%3E%3Ccircle cx='450' cy='193.5' r='11' fill='%231a1a1a'/%3E%3C/g%3E%3Cg transform='translate(450,212.5) scale(0.7) translate(-450,-212.5)'%3E%3Ccircle cx='450' cy='212.5' r='11' fill='%231a1a1a'/%3E%3C/g%3E%3Ctext x='520' y='208.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3ERot-Rot = %E2%80%9ENot, nicht steuerbar%E2%80%9C%3C/text%3E%3Crect x='15' y='234' width='870' height='62' fill='%23eef3fa'/%3E%3Ctext x='30' y='270.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3EMan%C3%B6vrierbehindert (RAM)%3C/text%3E%3Crect x='315' y='238' width='50' height='54' rx='6' fill='%230b1a2e'/%3E%3Ccircle cx='340' cy='248.0' r='7.5' fill='%23d62828'/%3E%3Ccircle cx='340' cy='265.0' r='7.5' fill='%23ffffff'/%3E%3Ccircle cx='340' cy='282.0' r='7.5' fill='%23d62828'/%3E%3Cg transform='translate(450,246.0) scale(0.7) translate(-450,-246.0)'%3E%3Ccircle cx='450' cy='246.0' r='11' fill='%231a1a1a'/%3E%3C/g%3E%3Cg transform='translate(450,265.0) scale(0.7) translate(-450,-265.0)'%3E%3Cpolygon points='450,251.0 461,265.0 450,279.0 439,265.0' fill='%231a1a1a'/%3E%3C/g%3E%3Cg transform='translate(450,284.0) scale(0.7) translate(-450,-284.0)'%3E%3Ccircle cx='450' cy='284.0' r='11' fill='%231a1a1a'/%3E%3C/g%3E%3Ctext x='520' y='270.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3ERot-Wei%C3%9F-Rot %C2%B7 Tag: Ball-Rhombus-Ball%3C/text%3E%3Ctext x='30' y='332.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3ETiefgangbehindert (CBD)%3C/text%3E%3Crect x='315' y='300' width='50' height='54' rx='6' fill='%230b1a2e'/%3E%3Ccircle cx='340' cy='310.0' r='7.5' fill='%23d62828'/%3E%3Ccircle cx='340' cy='327.0' r='7.5' fill='%23d62828'/%3E%3Ccircle cx='340' cy='344.0' r='7.5' fill='%23d62828'/%3E%3Cg transform='translate(450,327.0) scale(0.7) translate(-450,-327.0)'%3E%3Crect x='441' y='313.0' width='18' height='28' fill='%231a1a1a'/%3E%3C/g%3E%3Ctext x='520' y='332.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3E3%C3%97 Rot %C2%B7 Tag: Zylinder%3C/text%3E%3Crect x='15' y='358' width='870' height='62' fill='%23eef3fa'/%3E%3Ctext x='30' y='394.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3EAuf Grund gelaufen%3C/text%3E%3Crect x='315' y='362' width='50' height='54' rx='6' fill='%230b1a2e'/%3E%3Ccircle cx='340' cy='380.5' r='7.5' fill='%23d62828'/%3E%3Ccircle cx='340' cy='397.5' r='7.5' fill='%23d62828'/%3E%3Cg transform='translate(450,370.0) scale(0.7) translate(-450,-370.0)'%3E%3Ccircle cx='450' cy='370.0' r='11' fill='%231a1a1a'/%3E%3C/g%3E%3Cg transform='tra 31a1a1a' text-anchor='start' font-weight='normal'%3ERot %C3%BCber Wei%C3%9F%3C/text%3E%3Ctext x='30' y='580.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3ELotsenfahrzeug%3C/text%3E%3Crect x='315' y='548' width='50' height='54' rx='6' fill='%230b1a2e'/%3E%3Ccircle cx='340' cy='566.5' r='7.5' fill='%23ffffff'/%3E%3Ccircle cx='340' cy='583.5' r='7.5' fill='%23d62828'/%3E%3Ctext x='520' y='580.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EWei%C3%9F %C3%BCber Rot = %E2%80%9ELotse im Boot%E2%80%9C %C2%B7 Tag: Flagge H%3C/text%3E%3Crect x='15' y='606' width='870' height='62' fill='%23eef3fa'/%3E%3Ctext x='30' y='642.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3ESegler (optional am Mast)%3C/text%3E%3Crect x='315' y='610' width='50' height='54' rx='6' fill='%230b1a2e'/%3E%3Ccircle cx='340' cy='628.5' r='7.5' fill='%23d62828'/%3E%3Ccircle cx='340' cy='645.5' r='7.5' fill='%231b9e3e'/%3E%3Ctext x='520' y='642.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3ERot %C3%BCber Gr%C3%BCn %C2%B7 unter Motor = Maschinenfahrzeug%3C/text%3E%3Ctext x='30' y='704.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3ESegler unter Motor (Tag)%3C/text%3E%3Cg transform='translate(450,699.0) scale(0.7) translate(-450,-699.0)'%3E%3Cpolygon points='450,711.0 462,689.0 438,689.0' fill='%231a1a1a'/%3E%3C/g%3E%3Ctext x='520' y='704.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3ETag: 1 Kegel Spitze nach unten%3C/text%3E%3C/svg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<h3>Wo hängen die Signalkörper in echt? (Bild)<\/h3>\n<p>Signalkörper sind schwarze Bälle, Kegel und Zylinder. Sie hängen <strong>vorne am Boot<\/strong>, dort, wo man sie von allen Seiten sieht. Bei Segelbooten ist das das <strong>Vorstag<\/strong>, das Drahtseil vom Mast zum Bug. Bei großen Schiffen hängen s ill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E%C3%BCbereinander%20am%20Mast%3C%2Ftext%3E%3Ctext%20x%3D'885'%20y%3D'241'%20font-size%3D'13'%20fill%3D'%23333'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E%3D%20man%C3%B6vrierunf%C3%A4hig%3C%2Ftext%3E%3Ctext%20x%3D'885'%20y%3D'259'%20font-size%3D'13'%20fill%3D'%23d62828'%20text-anchor%3D'start'%20font-weight%3D'bold'%3E%E2%86%92%20weich%20ihm%20aus!%3C%2Ftext%3E%3Ctext%20x%3D'820'%20y%3D'505'%20font-size%3D'14'%20fill%3D'%231a1a1a'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3EGro%C3%9Fe%20Schiffe%20h%C3%A4ngen%20Signalk%C3%B6rper%20an%20eine%20Rah%3C%2Ftext%3E%3Ctext%20x%3D'820'%20y%3D'525'%20font-size%3D'14'%20fill%3D'%231a1a1a'%20text-anchor%3D'middle'%20font-weight%3D'normal'%3E(Querstange)%20am%20Mast%2C%20gut%20sichtbar%20von%20allen%20Seiten.%3C%2Ftext%3E%3Crect%20x%3D'20'%20y%3D'575'%20width%3D'1060'%20height%3D'215'%20rx%3D'12'%20fill%3D'%23fff5d6'%20stroke%3D'%23f0d98a'%2F%3E%3Ctext%20x%3D'40'%20y%3D'605'%20font-size%3D'18'%20fill%3D'%230b2545'%20text-anchor%3D'start'%20font-weight%3D'bold'%3E%F0%9F%92%A1%20Tipps%20f%C3%BCr%20die%20Praxis%3C%2Ftext%3E%3Ctext%20x%3D'48'%20y%3D'635'%20font-size%3D'14'%20fill%3D'%231a1a1a'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E%E2%80%A2%20Wo%20liegt%20der%20Ball%20an%20Bord%3F%20Meist%20in%20der%20Backskiste%20(Stauraum%20unter%20der%20Cockpitbank)%20oder%20im%20Ankerkasten%20vorne.%20Bei%20der%20Boots%C3%BCbergabe%20zeigen%20lassen!%3C%2Ftext%3E%3Ctext%20x%3D'48'%20y%3D'666'%20font-size%3D'14'%20fill%3D'%231a1a1a'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E%E2%80%A2%20Er%20ist%20oft%20faltbar%3A%20zwei%20schwarze%20Kunststoff-Scheiben%2C%20die%20man%20ineinandersteckt.%20Zusammengeklappt%20sieht%20er%20wie%20ein%20flacher%20Teller%20aus.%3C%2Ftext%3E%3Ctext%20x%3D'48'%20y%3D'697'%20font-size%3D'14'%20fill%3D'%231a1a1a'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E%E2%80%A2%20Genauso%20gibt%20es%20den%20Kegel%20(Spitze%20nach%20unten)%20f%C3%BCr%20%E2%80%9ESegelboot%20f%C3%A4hrt%20mit%20Motor%E2%80%9C.%20Er%20wird%20auch%20ins%20Vorstag%20geh%C3%A4ngt.%3C%2Ftext%3E%3Ctext%20x%3D'48'%20y%3D'728'%20font-size%3D'14'%20fill%3D'%231a1a1a'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E%E2%80%A2%20In%20der%20Pr%C3%BCfung%20z%C3%A4hlt%3A%20Ball%20%3D%20vor%20Anker%2C%202%20B%C3%A4lle%20%3D%20man%C3%B6vrierunf%C3%A4hig%2C%203%20B%C3%A4lle%20%3D%20auf%20Grund%20gelaufen.%3C%2Ftext%3E%3Ctext%20x%3D'48'%20y%3D'759'%20font-size%3D'14'%20fill%3D'%231a1a1a'%20text-anchor%3D'start'%20font-weight%3D'normal'%3E%E2%80%A2%20Drau%C3%9Fen%20erkennst%20du%20Signalk%C3%B6rper%20am%20besten%20mit%20dem%20Fernglas.%20Bei%20gro%C3%9Fen%20Schiffen%20sind%20die%20B%C3%A4lle%20ca.%2060%20cm%20gro%C3%9F.%3C%2Ftext%3E%3C%2Fsvg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<p><strong>So sehen Signalkörper in echt aus (Fotos):<\/strong> Sie sind schwarz und hängen dort, wo man sie von allen Seiten gut sieht, meist <strong>vorne am Vorstag<\/strong> oder <strong>am Mast<\/strong>. Auf Yachten nimmt man meist einen <strong>zusammenklappbaren Ankerball<\/strong> (etwa 30 cm). Er liegt oft in der Backskiste oder im Ankerkasten.<\/p>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0\"><figure class=\"fig ext\" style=\"margin:0\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Ankerball_P5272654_jm.JPG/500px-Ankerball_P5272654_jm.JPG\" alt=\"Ankerball in der Takelage: hoch oben im Vorschiff, damit man ihn von allen Seiten sieht\" loading=\"lazy\" referrerpolicy=\"no-referrer\" style=\"aspect-ratio:4/3;object-fit:contain;background:#eef3f7\"><figcaption style=\"text-align:left;font-family:inherit;font-size:13px;color:#24384a;line-height:1.35\"><b>Ankerball<\/b> in der Takelage: hoch oben im Vorschiff, damit man ihn von allen Seiten sieht<br><span style=\"font-size:10.5px;color:#6b7c8c\">Foto: Joachim Müllerchen, CC BY-SA 3.0 · Wikimedia Commons<\/span><\/figcaption><\/figure><figure class=\"fig ext\" style=\"margin:0\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/US_Navy_080730-N-7571S-010_Quartermaster_Seaman_Andrew_Dobrzykowski_lowers_day_shapes_Ball%2C_Diamond%2C_Ball_signaling_the_end_of_restricted_maneuvering.jpg/500px-US_Navy_080730-N-7571S-010_Quartermaster_Seaman_Andrew_Dobrzykowski_lowers_day_shapes_Ball%2C_Diamond%2C_Ball_signaling_the_end_of_restricted_maneuvering.jpg\" alt=\"Ball – Rhombus – Ball (manövrierbehindert): so groß sind die Signalkörper auf großen Schiffen\" loading=\"lazy\" referrerpolicy=\"no-referrer\" style=\"aspect-ratio:4/3;object-fit:contain;background:#eef3f7\"><figcaption style=\"text-align:left;font-family:inherit;font-size:13px;color:#24384a;line-height:1.35\"><b>Ball – Rhombus – Ball<\/b> (manövrierbehindert): so groß sind die Signalkörper auf großen Schiffen<br><span style=\"font-size:10.5px;color:#6b7c8c\">Foto: U.S. Navy, gemeinfrei · Wikimedia Commons<\/span><\/figcaption><\/figure><figure class=\"fig ext\" style=\"margin:0\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/61/Hamenfischer_10_%28RaBoe%29.jpg/500px-Hamenfischer_10_%28RaBoe%29.jpg\" alt=\"2 Kegel, Spitzen zusammen = Fischer bei der Arbeit. Hängt am Mast, oft als Netz-Körper\" loading=\"lazy\" referrerpolicy=\"no-referrer\" style=\"aspect-ratio:4/3;object-fit:contain;background:#eef3f7\"><figcaption style=\"text-align:left;font-family:inherit;font-size:13px;color:#24384a;line-height:1.35\"><b>2 Kegel, Spitzen zusammen<\/b> = Fischer bei der Arbeit. Hängt am Mast, oft als Netz-Körper<br><span style=\"font-size:10.5px;color:#6b7c8c\">Foto: Ra Boe, CC BY-SA 3.0 · Wikimedia Commons<\/span><\/figcaption><\/figure><figure class=\"fig ext\" style=\"margin:0\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/04/Bou%C3%A9e_de_chasse_sous_marine.jpg/500px-Bou%C3%A9e_de_chasse_sous_marine.jpg\" alt=\"Taucher-/Harpunierboje: orange mit Fähnchen. Darunter ist ein Mensch im Wasser → großer Abstand\" loading=\"lazy\" referrerpolicy=\"no-referrer\" style=\"aspect-ratio:4/3;object-fit:contain;background:#eef3f7\"><figcaption style=\"text-align:left;font-family:inherit;font-size:13px;color:#24384a;line-height:1.35\"><b>Taucher-/Harpunierboje<\/b>: orange mit Fähnchen. Darunter ist ein Mensch im Wasser → großer Abstand<br><span style=\"font-size:10.5px;color:#6b7c8c\">Foto: Calcineur, CC BY-SA 3.0 · Wikimedia Commons<\/span><\/figcaption><\/figure><\/div>\n\n<div class=\"co co-tip\"><div class=\"co-t\">Praxis-Tipp für Neulinge<\/div><ul>\n<li>Auf der Charteryacht liegt der <strong>Ankerball<\/strong> meist in der <strong>Backskiste<\/strong> (Stauraum unter der Cockpitbank) oder im Ankerkasten vorne. Bei der Übergabe zeigen lassen!<\/li>\n<li>Beim Ankern ziehst du ihn mit einer dünnen Leine ins Vorstag hoch, beim Ankerauf nimmst du ihn wieder runter.<\/li>\n<li>Draußen sieht man die Bälle am besten mit dem <strong>Fernglas<\/strong>. Achte bei großen Schiffen auf den Bereich rund um den vorderen Mast.<\/li>\n<\/ul><\/div>\n\n<p><strong>Eselsbrücken:<\/strong><\/p>\n<ul>\n<li><strong>Rot-Rot<\/strong> = „Ich kann nicht“ (manövrierunfähig, z. B. Ruder kaputt)<\/li>\n<li><strong>Rot-Weiß-Rot<\/strong> = „Ich arbeite“ (Bagger, Kabelleger, Taucher-Arbeiten)<\/li>\n<li><strong>Grün über Weiß<\/strong> = Trawler, <strong>Rot über Weiß<\/strong> = anderer Fischer → <em>„Rot über Weiß – Fischer auf der Reis'“<\/em><\/li>\n<li><strong>Weiß über Rot<\/strong> = Lotse<\/li>\n<li><strong>3 × Rot<\/strong> = großer Tanker, tiefgangbehindert<\/li>\n<li><strong>Ankerlieger:<\/strong> 1 weißes Rundumlicht vorne, am Tag <strong>1 schwarzer Ball<\/strong><\/li>\n<\/ul>\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage<\/div><p>Nachts siehst du <strong>zwei rote Rundumlichter übereinander<\/strong> und darunter ein grünes Seitenlicht.\n→ Manövrierunfähiges Fahrzeug, das noch Fahrt macht. Du siehst seine Steuerbordseite. <strong>Du weichst aus<\/strong>, denn es steht über allen anderen.<\/p><\/div>"},{"n":"02","t":"Ausweichregeln","h":"<div class=\"co co-abstract\"><div class=\"co-t\">Worum geht&#x27;s überhaupt? (Erklärung für Einsteiger)<\/div><p>Das ist die „Vorfahrt“ auf dem Wasser. Weil es keine Fahrspuren gibt, regeln die <strong>Kollisionsverhütungsregeln (KVR)<\/strong>, wer ausweicht, wenn sich zwei Boote nahe kommen.<\/p>\n<ul>\n<li>Eines der Boote muss <strong>ausweichen<\/strong>, das andere ist der <strong>Kurshalter<\/strong>. Der Kurshalter fährt einfach gerade weiter, damit er berechenbar bleibt.<\/li>\n<li>Ausweichen heißt meistens: <strong>nach rechts<\/strong> drehen und <strong>hinter<\/strong> dem anderen vorbeifahren.<\/li>\n<li>Es gibt eine <strong>Rangordnung<\/strong>: Ein Motorboot ist am wendigsten und muss deshalb fast allen anderen ausweichen.<\/li>\n<\/ul>\n<p>Unbekannte Wörter? → 00a Bootssprache – Grundbegriffe<\/p><\/div>\n\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 900' width='1000' height='900' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='1000' height='900' fill='%23ffffff'/%3E%3Ctext x='500.0' y='38' font-size='24' fill='%230b2545' text-anchor='middle' font-weight='bold'%3EAusweichregeln (KVR/COLREG) %E2%80%93 die 4 Grundsituationen%3C/text%3E%3Ctext x='500.0' y='62' font-size='14' fill='%23444' text-anchor='middle' font-weight='normal'%3EOrange = muss ausweichen  %C2%B7  Blau = Kurshalter (Kurs %2B Geschwindigkeit beibehalten)%3C/text%3E%3Crect x='20' y='80' width='470' height='380' rx='14' fill='%23f4f7fb' stroke='%23c9d5e6'/%3E%3Ctext x='255.0' y='110' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3E1 %C2%B7 Entgegenkommend (Regel 14)%3C/text%3E%3Cg transform='translate(255,385) rotate(0)'%3E%3Cpath d='M0,-36.0 C16.2,-18.0 14.4,18.0 12.6,34.2 L-12.6,34.2 C-14.4,18.0 -16.2,-18.0 0,- fY='5' orient='auto'%3E%3Cpath d='M0,0 L10,5 L0,10 z' fill='%23e07a00'/%3E%3C/marker%3E%3C/defs%3E%3Cpath d='M660,340 C665,300 720,290 830,290' fill='none' stroke='%23e07a00' stroke-width='3' stroke-dasharray='8 6' marker-end='url(%23ce07a00)'/%3E%3Ctext x='745' y='128' font-size='14' fill='%231a1a1a' text-anchor='middle' font-weight='normal'%3EWer den anderen an SEINER Steuerbordseite (rechts)%3C/text%3E%3Ctext x='745' y='146' font-size='14' fill='%231a1a1a' text-anchor='middle' font-weight='normal'%3Esieht, weicht aus %E2%80%93 und f%C3%A4hrt HINTER ihm vorbei.%3C/text%3E%3Ctext x='745' y='440' font-size='15' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3E%E2%80%9ERechts vor links%E2%80%9C wie im Stra%C3%9Fenverkehr%3C/text%3E%3Crect x='20' y='480' width='470' height='400' rx='14' fill='%23f4f7fb' stroke='%23c9d5e6'/%3E%3Ctext x='255.0' y='510' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3E3 %C2%B7 %C3%9Cberholen (Regel 13)%3C/text%3E%3Cpath d='M255,610 L393.6,667.4 A150,150 0 0 1 116.4,667.4 Z' fill='%23e07a00' fill-opacity='0.18' stroke='%23e07a00' stroke-width='2'/%3E%3Cg transform='translate(255,610) rotate(0)'%3E%3Cpath d='M0,-36.0 C16.2,-18.0 14.4,18.0 12.6,34.2 L-12.6,34.2 C-14.4,18.0 -16.2,-18.0 0,-36.0 Z' fill='%231f5fbf'/%3E%3C/g%3E%3Cg transform='translate(295,780) rotate(0)'%3E%3Cpath d='M0,-36.0 C16.2,-18.0 14.4,18.0 12.6,34.2 L-12.6,34.2 C-14.4,18.0 -16.2,-18.0 0,-36.0 Z' fill='%23e07a00'/%3E%3C/g%3E%3Cdefs%3E%3Cmarker id='ce07a00' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'%3E%3Cpath d='M0,0 L10,5 L0,10 z' fill='%23e07a00'/%3E%3C/marker%3E%3C/defs%3E%3Cpath d='M295,735 C325,670 330,610 325,550' fill='none' stroke='%23e07a00' stroke-width='3' stroke-dasharray='8 6' marker-end='url(%23ce07a00)'/%3E%3Ctext x='255' y='830' font-size='14' fill='%231a1a1a' text-anchor='middle' font-weight='normal'%3EDer %C3%9CBERHOLER weicht IMMER aus %E2%80%93 egal ob Segler,%3C/text%3E%3Ctext x='255' y='850' font-size='14' fill='%231a1a1a' text-anchor='middle' font-weight='normal'%3EMotorboot oder Fischer. %C3%9Cberholer = kommt aus dem%3C/text%3E%3Ctext x='255' y='870' font-size='14' fill='%231a1a1a' text-anchor='middle' font-weight='normal'%3EHecklicht-Sektor (mehr als 22,5%C2%B0 achterlicher als querab).%3C/text%3E%3Crect x='510' y='480' width='470' height='400' rx='14' fill='%23f4f7fb' stroke='%23c9d5e6'/%3E%3Ctext x='745.0' y='510' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3E4 %C2%B7 Zwei Segelboote (Regel 12)%3C/text%3E%3Ctext x='745' y='530' font-size='15' text-anchor='middle'%3EWind %E2%86%93 von oben%3C/text%3E%3Cdefs%3E%3Cmarker id='m555' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'%3E%3Cpath d='M0,0 L10,5 L0,10 z' fill='%23555'/%3E%3C/marker%3E%3C/defs%3E%3Cline x1='745' y1='538' x2='745' y2='570' stroke='%23555' stroke-width='3' marker-end='url(%23m555)'/%3E%3Cg transform='translate(640,690) rotate(45)'%3E%3Cpath d='M0,-32.0 C14.4,-16.0 12.8,16.0 11.200000000000001,30.400000000000002 L-11.200000000000001,30.400000000000002 C-12.8,16.0 -14.4,-16.0 0,-32.0 Z' fill='%23e07a00'/%3E%3C/g%3E%3Cg transform='translate(850,690) rotate(-45)'%3E%3Cpath d='M0,-32.0 C14.4,-16.0 12.8,16.0 11.200000000000001,30.400000000000002 L-11.200000000000001,30.400000000000002 C-12.8,16.0 -14.4,-16.0 0,-32.0 Z' fill='%231f5fbf'/%3E%3C/g%3E%3Ctext x='640' y='760' font-size='13' fill='%231a1a1a' text-anchor='middle' font-weight='normal'%3EWind von Backbord%3C/text%3E%3Ctext x='640' y='778' font-size='13' fill='%23e07a00' text-anchor='middle' font-weight='bold'%3E= Backbordbug %E2%86%92 weicht%3C/text%3E%3Ctext x='850' y='760' font-size='13' fill='%231a1a1a' text-anchor='middle' font-weight='normal'%3EWind von Steuerbord%3C/text%3E%3Ctext x='850' y='778' font-size='13' fill='%231f5fbf' text-anchor='middle' font-weight='bold'%3E= Steuerbordbug%3C/text%3E%3Ctext x='745' y='820' font-size='14' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EVerschiedene Bugs: Backbordbug weicht Steuerbordbug%3C/text%3E%3Ctext x='745' y='842' font-size='14' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EGleicher Bug: Luv (windzugewandt) weicht Lee%3C/text%3E%3Ctext x='745' y='864' font-size='12' fill='%23555' text-anchor='middle' font-weight='normal'%3EBug = Seite, von der der Wind kommt (Gro%C3%9Fbaum steht gegen%C3%BCber)%3C/text%3E%3C/svg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<h2>Die 4 Grundsituationen<\/h2>\n<ol>\n<li><strong>Entgegenkommend (Regel 14):<\/strong> Zwei Maschinenfahrzeuge fahren genau aufeinander zu → <strong>beide drehen nach Steuerbord<\/strong> (rechts) und passieren sich Backbord an Backbord.<\/li>\n<li><strong>Kreuzend (Regel 15):<\/strong> Wer den anderen <strong>an seiner Steuerbordseite<\/strong> (rechts) hat, weicht aus und fährt <strong>hinter ihm<\/strong> durch, nicht vor seinem Bug. Wie „rechts vor links“ im Straßenverkehr.<\/li>\n<li><strong>Überholen (Regel 13):<\/strong> Der <strong>Überholer weicht immer aus<\/strong>, egal wer er ist. Überholer ist, wer aus dem Hecklichtsektor kommt (mehr als 22,5° achterlicher als querab).<\/li>\n<li><strong>Zwei Segler (Regel 12):<\/strong><\/li>\n<li>Verschiedene Bugs: <strong>Backbordbug weicht Steuerbordbug<\/strong><\/li>\n<li>Gleicher Bug: <strong>Luv weicht Lee<\/strong> (wer näher am Wind ist, weicht)<\/li>\n<li>Bug = die Seite, von der der Wind kommt. Der Großbaum steht auf der anderen Seite.<\/li>\n<\/ol>\n<h2>Wer weicht wem?<\/h2>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 560' width='760' height='560' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='760' height='560' fill='%23ffffff'/%3E%3Ctext x='380.0' y='40' font-size='22' fill='%230b2545' text-anchor='middle' font-weight='bold'%3EWer weicht wem%3F (Regel 18) %E2%80%93 von oben nach unten%3C/text%3E%3Crect x='200.0' y='70' width='360' height='58' rx='8' fill='%237f1d1d'/%3E%3Ctext x='380.0' y='96' font-size='17' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EMan%C3%B6vrierunf%C3%A4hig (NUC)%3C/text%3E%3Ctext x='380.0' y='116' font-size='13' fill='%23ffe9c7' text-anchor='middle' font-weight='normal'%3ERot-Rot%3C/text%3E%3Crect x='170.0' y='140' width='420' height='58' rx='8' fill='%23a12c2c'/%3E%3Ctext x='380.0' y='166' font-size='17' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EMan%C3%B6vrierbehindert (RAM)%3C/text%3E%3Ctext x='380.0' y='186' font-size='13' fill='%23ffe9c7' text-anchor='middle' font-weight='normal'%3ERot-Wei%C3%9F-Rot%3C/text%3E%3Crect x='140.0' y='210' width='480' height='58' rx='8' fill='%23c0392b'/%3E%3Ctext x='380.0' y='236' font-size='17' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3ETiefgangbehindert (CBD)%3C/text%3E%3Ctext x='380.0' y='256' font-size='13' fill='%23ffe9c7' text-anchor='middle' font-weight='normal'%3E3%C3%97 Rot%3C/text%3E%3Crect x='110.0' y='280' width='540' height='58' rx='8' fill='%23d35400'/%3E%3Ctext x='380.0' y='306' font-size='17' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EFischendes Fahrzeug%3C/text%3E%3Ctext x='380.0' y='326' font-size='13' fill='%23ffe9c7' text-anchor='middle' font-weight='normal'%3EGr%C3%BCn/Wei%C3%9F bzw. Rot/Wei%C3%9F%3C/text%3E%3Crect x='80.0' y='350' width='600' height='58' rx='8' fill='%232471a3'/%3E%3Ctext x='380.0' y='376' font-size='17' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3ESegelfahrzeug (nur unter Segel%21)%3C/text%3E%3Ctext x='380.0' y='396' font-size='13' fill='%23ffe9c7' text-anchor='middle' font-weight='normal'%3ERot/Gr%C3%BCn %2B Heck%3C/text%3E%3Crect x='50.0' y='420' width='660' height='58' rx='8' fill='%231f4e79'/%3E%3Ctext x='380.0' y='446' font-size='17' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EMaschinenfahrzeug%3C/text%3E%3Ctext x='380.0' y='466' font-size='13' fill='%23ffe9c7' text-anchor='middle' font-weight='normal'%3ETopplicht %2B Seiten %2B Heck%3C/text%3E%3Ctext x='380.0' y='510' font-size='14' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EJeder weicht allen %C3%9CBER ihm aus. Merksatz: %E2%80%9ENot, Arbeit, Tiefgang, Fischer, Segel, Motor%E2%80%9C%3C/text%3E%3Ctext x='380.0' y='532' font-size='13' fill='%23555' text-anchor='middle' font-weight='normal'%3EAusnahmen: Der %C3%9Cberholer weicht immer %C2%B7 Im engen Fahrwasser behindern Boote %26lt; 20 m die Gro%C3%9Fen nicht%3C/text%3E%3C/svg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<p>Merksatz von oben nach unten: <strong>„Not – Arbeit – Tiefgang – Fischer – Segel – Motor“<\/strong><\/p>\n<ul>\n<li>Motorboot weicht: Segler, Fischer, Tiefgangbehinderten, Manövrierbehinderten, Manövrierunfähigen<\/li>\n<li>Segler weicht: Fischer, Tiefgangbehinderten, Manövrierbehinderten, Manövrierunfähigen<\/li>\n<li><strong>Achtung:<\/strong> Ein Fischer muss <strong>wirklich fischen<\/strong> (Netz oder Leinen draußen). Ein Sportangler mit Rute gilt nicht als „Fischer“.<\/li>\n<li>Ein <strong>Segler mit laufendem Motor<\/strong> ist ein Maschinenfahrzeug.<\/li>\n<\/ul>\n<h2>Die Regeln drumherum (werden gern gefragt)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Regel<\/th>\n<th>Inhalt in 1 Satz<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5 Ausguck<\/td>\n<td>Immer Ausguck halten, mit Augen <strong>und<\/strong> Ohren<\/td>\n<\/tr>\n<tr>\n<td>6 Sichere Geschwindigkeit<\/td>\n<td>So schnell, dass du rechtzeitig stoppen bzw. ausweichen kannst (Sicht, Verkehr, Wind)<\/td>\n<\/tr>\n<tr>\n<td><strong>7 Kollisionsgefahr<\/strong><\/td>\n<td><strong>Peilung bleibt gleich und der Abstand nimmt ab → Kollisionskurs!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>8 Manöver<\/td>\n<td><strong>Früh, deutlich, groß<\/strong> ausweichen (z. B. 30° oder mehr), damit es der andere sieht. Notfalls Fahrt raus<\/td>\n<\/tr>\n<tr>\n<td>9 Enges Fahrwasser<\/td>\n<td><strong>Rechts halten.<\/strong> Boote unter 20 m und Segler dürfen die Großen nicht behindern<\/td>\n<\/tr>\n<tr>\n<td>17 Kurshalter<\/td>\n<td>Kurs <strong>und<\/strong> Geschwindigkeit beibehalten. Wenn der andere nicht reagiert: selbst ausweichen (nicht nach Backbord!)<\/td>\n<\/tr>\n<tr>\n<td>19 Verminderte Sicht<\/td>\n<td>Langsam fahren, Schallsignale geben, Radar/Ausguck. Bei Nebel gibt es <strong>kein<\/strong> Kurshalter-Recht<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"co co-tip\"><div class=\"co-t\">Peilungstrick (Regel 7)<\/div><p>Peile ein anderes Schiff über eine feste Stelle an deinem Boot an, zum Beispiel eine Relingstütze. <strong>Wandert es nicht aus<\/strong> und wird größer, seid ihr auf Kollisionskurs. Dann handeln!<\/p><\/div>\n\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage<\/div><p>Du fährst mit dem Motorboot. Von <strong>Backbord<\/strong> (links) kommt ein Segler mit Kurs, der deinen kreuzt. Wer weicht?\n→ <strong>Du.<\/strong> Maschine weicht Segel, egal von welcher Seite er kommt.<\/p><\/div>"},{"n":"03","t":"Seezeichen","h":"<div class=\"co co-abstract\"><div class=\"co-t\">Worum geht&#x27;s überhaupt? (Erklärung für Einsteiger)<\/div><p>Seezeichen sind die <strong>Verkehrsschilder auf dem Wasser<\/strong>: bunte Tonnen (schwimmende, verankerte Bojen), Stangen und Leuchttürme. Sie zeigen dir,<\/p>\n<ul>\n<li><strong>wo das Fahrwasser ist<\/strong>, also der sichere Weg (rot und grün, wie Leitpfosten),<\/li>\n<li><strong>wo eine Gefahr liegt<\/strong> (Felsen, Untiefe, Wrack) und auf welcher Seite du vorbeifahren musst (gelb-schwarz).<\/li>\n<\/ul>\n<p>Nachts blinken viele davon in einem bestimmten Rhythmus. So erkennst du sie auch im Dunkeln.<\/p>\n<p>Unbekannte Wörter? → 00a Bootssprache – Grundbegriffe<\/p><\/div>\n\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 1060' width='1100' height='1060' font-family='Segoe UI, Arial, sa fen<\/strong>. Beim Auslaufen ist es umgekehrt: rot bleibt rechts<\/li>\n<li>Merke: „<strong>Rot<\/strong> wie der rote <strong>Port<\/strong>wein, <strong>Port<\/strong> = Backbord, links“<\/li>\n<\/ul>\n<h2>Kardinalzeichen – schwarz-gelb, die Prüfungs-Favoriten<\/h2>\n<p><strong>Grundregel:<\/strong> Das Zeichen ist nach der Himmelsrichtung benannt, auf der das <strong>sichere Wasser<\/strong> liegt.\n→ An einer <strong>Nord<\/strong>tonne fährst du <strong>nördlich<\/strong> vorbei.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Zeichen<\/th>\n<th>Toppzeichen<\/th>\n<th>Farbe<\/th>\n<th>Licht (weiß)<\/th>\n<th>Eselsbrücke<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Nord<\/strong><\/td>\n<td>▲▲ beide Spitzen oben<\/td>\n<td>schwarz über gelb<\/td>\n<td>ununterbrochen funkelnd<\/td>\n<td>„zeigt nach oben = Norden“<\/td>\n<\/tr>\n<tr>\n<td><strong>Ost<\/strong><\/td>\n<td>◆ Spitzen auseinander<\/td>\n<td>schwarz-gelb-schwarz<\/td>\n<td><strong>3<\/strong> Blitze<\/td>\n<td>„wie ein <strong>E<\/strong>i“ (East)<\/td>\n<\/tr>\n<tr>\n<td><strong>Süd<\/strong><\/td>\n<td>▼▼ beide Spitzen unten<\/td>\n<td>gelb über schwarz<\/td>\n<td><strong>6<\/strong> Blitze + 1 lang<\/td>\n<td>„zeigt nach unten = Süden“<\/td>\n<\/tr>\n<tr>\n<td><strong>West<\/strong><\/td>\n<td>⧗ Spitzen zusammen<\/td>\n<td>gelb-schwarz-gelb<\/td>\n<td><strong>9<\/strong> Blitze<\/td>\n<td>„Wespentaille = <strong>W<\/strong>est“<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Uhr-Trick:<\/strong> 3 Uhr = Ost, 6 Uhr = Süd, 9 Uhr = West, 12 Uhr = Nord (ununterbrochen).\n<strong>Farbtrick:<\/strong> Schwarz liegt dort, wohin die Kegelspitzen zeigen (N: oben schwarz, S: unten schwarz, O: oben und unten, W: Mitte).<\/p>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%201120%20895'%20width%3D'1120'%20height%3D'895'%20font-family%3D'Segoe%20UI%2C%20Arial%2C%20sans-serif'%3E%3Crect%20width%3D'112
