 sm pro Stunde%3C/text%3E%3Ctext x='230' y='904' font-size='13' fill='%23333' text-anchor='middle' font-weight='normal'%3EBeispiel: 6 kn, 15 sm %E2%86%92 15 : 6 = 2,5 h = 2 h 30 min%3C/text%3E%3Ctext x='230' y='924' font-size='13' fill='%23333' text-anchor='middle' font-weight='normal'%3EMinuten-Trick: Weg = Fahrt %C3%97 Minuten : 60%3C/text%3E%3Crect x='500' y='660' width='480' height='290' rx='12' fill='%23f4f7fb' stroke='%23c9d5e6'/%3E%3Ctext x='740' y='690' font-size='17' fill='%230b2545' text-anchor='middle' font-weight='bold'%3E%E2%91%A3 Kompass-Kurse umrechnen%3C/text%3E%3Crect x='520' y='710' width='120' height='64' rx='8' fill='%230b2545'/%3E%3Ctext x='580' y='740' font-size='20' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EKK%3C/text%3E%3Ctext x='580' y='762' font-size='11' fill='%23cfe0f5' text-anchor='middle' font-weight='normal'%3EKompasskurs%3C/text%3E%3Cpolygon points='644,734 676,742 644,750' fill='%23d62828'/%3E%3Ctext x='660' y='800' font-size='15' fill='%23d62828' text-anchor='middle' font-weight='bold'%3E%2B Abl%3C/text%3E%3Crect x='680' y='710' width='120' height='64' rx='8' fill='%230b2545'/%3E%3Ctext x='740' y='740' font-size='20' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EMgK%3C/text%3E%3Ctext x='740' y='762' font-size='11' fill='%23cfe0f5' text-anchor='middle' font-weight='normal'%3Emissweisend%3C/text%3E%3Cpolygon points='804,734 836,742 804,750' fill='%23d62828'/%3E%3Ctext x='820' y='800' font-size='15' fill='%23d62828' text-anchor='middle' font-weight='bold'%3E%2B Mw%3C/text%3E%3Crect x='840' y='710' width='120' height='64' rx='8' fill='%230b2545'/%3E%3Ctext x='900' y='740' font-size='20' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3ErwK%3C/text%3E%3Ctext x='900' y='762' font-size='11' fill='%23cfe0f5' text-anchor='middle' font-weight='normal'%3Erechtweisend = Karte%3C/text%3E%3Ctext x='580' y='822' font-size='12' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EAbl = Ablenkung (Deviation, Boot)%3C/text%3E%3Ctext x='580' y='840' font-size='12' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EMw = Missweisung (Variation, steht in der Kompassrose der Karte)%3C/text%3E%3Ctext x='740' y='870' font-size='13' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EKarte %E2%86%92 Kompass: Rechnung r%C3%BCckw%C3%A4rts, Vorzeichen umdrehen%3C/text%3E%3Ctext x='740' y='892' font-size='13' fill='%23333' text-anchor='middle' font-weight='normal'%3EOst (E) = Plus %C2%B7 West (W) = Minus  %C2%B7 Adria: Mw ca. %2B4%E2%80%935%C2%B0 E%3C/text%3E%3Ctext x='740' y='916' font-size='13' fill='%23333' text-anchor='middle' font-weight='normal'%3EBeispiel: rwK 090%C2%B0 aus der Karte, Mw %2B4%C2%B0 %E2%86%92 MgK = 086%C2%B0%3C/text%3E%3C/svg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<h2>Die Grundzahlen<\/h2>\n<ul>\n<li><strong>1 Seemeile (sm, NM) = 1852 m = 1 Bogenminute (1') Breite<\/strong><\/li>\n<li><strong>1 Knoten (kn) = 1 sm pro Stunde<\/strong> ≈ 1,85 km/h<\/li>\n<li>1 Kabellänge = 0,1 sm ≈ 185 m<\/li>\n<li>Die Tiefen auf kroatischen Karten sind in <strong>Metern<\/strong> angegeben<\/li>\n<li><strong>12 sm<\/strong> von der Küste = Grenze der Hoheitsgewässer<\/li>\n<\/ul>\n<h2>Position ablesen<\/h2>\n<ol>\n<li><strong>Breite (Latitude, N)<\/strong>: Waagrechte Linie durch den Punkt, Wert am <strong>senkrechten<\/strong> Kartenrand ablesen<\/li>\n<li><strong>Länge (Longitude, E)<\/strong>: Senkrechte Linie, Wert am <strong>waagrechten<\/strong> Rand ablesen<\/li>\n<li>Immer zuerst die Breite nennen, dann die Länge: <code>43°30,5' N 016°26,0' E<\/code><\/li>\n<li>Kroatien liegt ungefähr bei <strong>42–45,5° N<\/strong> und <strong>13–19,5° E<\/strong><\/li>\n<\/ol>\n<h2>Distanz messen<\/h2>\n<ol>\n<li>Zirkel auf Punkt A und Punkt B setzen<\/li>\n<li>Den Zirkel an die <strong>Breitenskala (seitlich)<\/strong> anlegen, auf <strong>gleicher Höhe<\/strong> wie die Strecke (Mercator-Karte!)<\/li>\n<li>Minuten zählen. <strong>Jede Minute ist eine Seemeile<\/strong><\/li>\n<li>❌ <strong>Nie<\/strong> an der Längenskala oben oder unten messen<\/li>\n<\/ol>\n<h2>Kurs bestimmen<\/h2>\n<ol>\n<li>Kursdreieck an die Linie A→B legen<\/li>\n<li>Parallel zur nächsten Kompassrose schieben oder das Kursdreieck auf einen Meridian legen<\/li>\n<li>Den Kurs in Grad ablesen (000°–360°, dreistellig sprechen: „null-neun-null“)<\/li>\n<\/ol>\n<h2>Kompass-Rechnung<\/h2>\n<p><code>KK + Abl = MgK<\/code> → <code>MgK + Mw = rwK<\/code> (Ost = plus, West = minus)\n- <strong>rwK<\/strong> = rechtweisend, so steht es in der Karte\n- <strong>Mw<\/strong> = Missweisung, steht in der Kompassrose der Karte. In der Adria ca. <strong>4–5° Ost<\/strong>\n- <strong>Abl<\/strong> = Ablenkung durch Eisen und Elektrik an Bord (Deviationstabelle)\n- Von der Karte zum Steuerkompass: rückwärts rechnen<\/p>\n<h2>Weg – Zeit – Fahrt<\/h2>\n<ul>\n<li>Weg = Fahrt × Zeit<\/li>\n<li><strong>Beispiel:<\/strong> 12 sm bei 6 kn → 2 h<\/li>\n<li><strong>Minuten-Formel:<\/strong> Weg = Fahrt × Minuten ÷ 60. Also 20 min bei 9 kn = 3 sm<\/li>\n<li><strong>Treibstoff-Drittelregel:<\/strong> ⅓ hin, ⅓ zurück, ⅓ Reserve<\/li>\n<\/ul>\n<h2>Farben und Zeichen der Seekarte<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Was du siehst<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Gelb/beige<\/td>\n<td>Land<\/td>\n<\/tr>\n<tr>\n<td>Grün<\/td>\n<td>trockenfallend (bei Ebbe; in der Adria kaum relevant)<\/td>\n<\/tr>\n<tr>\n<td>Blau<\/td>\n<td><strong>flaches Wasser<\/strong> → Vorsicht<\/td>\n<\/tr>\n<tr>\n<td>Weiß<\/td>\n<td>tiefes Wasser<\/td>\n<\/tr>\n<tr>\n<td>Zahl im Wasser (z. B. 12)<\/td>\n<td>Wassertiefe in Metern<\/td>\n<\/tr>\n<tr>\n<td><code>+<\/code> oder <code>*<\/code><\/td>\n<td>Unterwasserfelsen bzw. Felsen, der bei Niedrigwasser sichtbar wird<\/td>\n<\/tr>\n<tr>\n<td>Wrack-Symbol<\/td>\n<td>Wrack (gefährlich oder nicht)<\/td>\n<\/tr>\n<tr>\n<td>Anker-Symbol<\/td>\n<td>Ankerplatz<\/td>\n<\/tr>\n<tr>\n<td>durchgestrichener Anker<\/td>\n<td>Ankerverbot<\/td>\n<\/tr>\n<tr>\n<td>Wellenlinie (oft magenta)<\/td>\n<td>Unterwasserkabel oder -leitung → <strong>nicht ankern<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Magenta-Tropfen mit Kennung<\/td>\n<td>Leuchtfeuer<\/td>\n<\/tr>\n<tr>\n<td>Buchstaben S, M, R, G …<\/td>\n<td>Grundart: Sand, Schlamm, Fels, Kies → für Ankern wichtig (Sand/Schlamm hält gut)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"co co-warning\"><div class=\"co-t\">Lücke<\/div><p>Kroatische Karten (HHI) haben teils kroatische Abkürzungen, z. B. die in einer AC-Nautik-Frage genannte „šk m 45“. Die Abkürzungen auf der Übungskarte im Kurs durchgehen. <strong>Daten fehlen<\/strong> für eine vollständige Liste.<\/p><\/div>"}, {"n": "07", "t": "Wetter Adria", "h": "<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 900' width='900' height='900' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='900' height='900' fill='%23ffffff'/%3E%3Ctext x='450.0' y='40' font-size='22' fill='%230b2545' text-anchor='middle' font-weight='bold'%3EWindrose der Adria %E2%80%93 Namen werden in der Pr%C3%BCfung gefragt%21%3C/text%3E%3Ctext x='450.0' y='64' font-size='14' fill='%23444' text-anchor='middle' font-weight='normal'%3EWind wird immer nach der Richtung benannt, AUS der er kommt%3C/text%3E%3Ccircle cx='450' cy='450' r='120' fill='%23eef3fa' stroke='%239fb3cc' stroke-width='2'/%3E%3Cline x1='450' y1='160' x2='450' y2='322' stroke='%234a6fa5' stroke-width='7'/%3E%3Cpolygon points='450,350 437,323 463,323' fill='%234a6fa5'/%3E%3Ctext x='450' y='396' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3EN%3C/text%3E%3Ctext x='450' y='105' font-size='18' fill='%234a6fa5' text-anchor='middle' font-weight='bold'%3ETRAMONTANA%3C/text%3E%3Ctext x='450' y='123' font-size='12' fill='%23333' text-anchor='middle' font-weight='normal'%3Ekalt, klar, kr%C3%A4ftig%3C/text%3E%3Cline x1='655' y1='245' x2='541' y2='359' stroke='%230b2545' stroke-width='7'/%3E%3Cpolygon points='521,379 531,351 549,369' fill='%230b2545'/%3E%3Ctext x='492' y='414' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ENO%3C/text%3E%3Ctext x='694' y='206' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3EBURA%3C/text%3E%3Ctext x='694' y='224' font-size='12' fill='%23333' text-anchor='middle' font-weight='normal'%3EFallwind, extrem b%C3%B6ig, kalt, trocken%3C/text%3E%3Cline x1='740' y1='450' x2='578' y2='450' stroke='%234a6fa5' stroke-width='7'/%3E%3Cpolygon points='550,450 577,437 577,463' fill='%234a6fa5'/%3E%3Ctext x='510' y='456' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3EO%3C/text%3E%3Ctext x='795' y='450' font-size='18' fill='%234a6fa5' text-anchor='middle' font-weight='bold'%3ELEVANAT%3C/text%3E%3Ctext x='795' y='468' font-size='12' fill='%23333' text-anchor='middle' font-weight='normal'%3Efeucht, oft Regen%3C/text%3E%3Cline x1='655' y1='655' x2='541' y2='541' stroke='%23d62828' stroke-width='7'/%3E%3Cpolygon points='521,521 549,531 531,549' fill='%23d62828'/%3E%3Ctext x='492' y='498' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ESO%3C/text%3E%3Ctext x='694' y='694' font-size='18' fill='%23d62828' text-anchor='middle' font-weight='bold'%3EJUGO%3C/text%3E%3Ctext x='694' y='712' font-size='12' fill='%23333' text-anchor='middle' font-weight='normal'%3Ewarm, feucht, hohe Wellen, Regen%3C/text%3E%3Cline x1='450' y1='740' x2='450' y2='578' stroke='%23c05621' stroke-width='7'/%3E%3Cpolygon points='450,550 463,577 437,577' fill='%23c05621'/%3E%3Ctext x='450' y='516' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ES%3C/text%3E%3Ctext x='450' y='795' font-size='18' fill='%23c05621' text-anchor='middle' font-weight='bold'%3EO%C5%A0TRO%3C/text%3E%3Ctext x='450' y='813' font-size='12' fill='%23333' text-anchor='middle' font-weight='normal'%3Ewarm, kurz %26amp; stark%3C/text%3E%3Cline x1='245' y1='655' x2='359' y2='541' stroke='%237f1d1d' stroke-width='7'/%3E%3Cpolygon points='379,521 369,549 351,531' fill='%237f1d1d'/%3E%3Ctext x='408' y='498' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ESW%3C/text%3E%3Ctext x='206' y='694' font-size='18' fill='%237f1d1d' text-anchor='middle' font-weight='bold'%3ELEBI%C4%86 (Garbin)%3C/text%3E%3Ctext x='206' y='712' font-size='12' fill='%23333' text-anchor='middle' font-weight='normal'%3Egef%C3%A4hrlicher Sturmwind, Gewitter%3C/text%3E%3Cline x1='160' y1='450' x2='322' y2='450' stroke='%234a6fa5' stroke-width='7'/%3E%3Cpolygon points='350,450 323,463 323,437' fill='%234a6fa5'/%3E%3Ctext x='390' y='456' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3EW%3C/text%3E%3Ctext x='105' y='450' font-size='18' fill='%234a6fa5' text-anchor='middle' font-weight='bold'%3EPULENAT%3C/text%3E%3Ctext x='105' y='468' font-size='12' fill='%23333' text-anchor='middle' font-weight='normal'%3Ekurz, oft Gewitter%3C/text%3E%3Cline x1='245' y1='245' x2='359' y2='359' stroke='%231b9e3e' stroke-width='7'/%3E%3Cpolygon points='379,379 351,369 369,351' fill='%231b9e3e'/%3E%3Ctext x='408' y='414' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ENW%3C/text%3E%3Ctext x='206' y='206' font-size='18' fill='%231b9e3e' text-anchor='middle' font-weight='bold'%3EMAESTRAL%3C/text%3E%3Ctext x='206' y='224' font-size='12' fill='%23333' text-anchor='middle' font-weight='normal'%3ESch%C3%B6nwetter-Thermik, nachmittags%3C/text%3E%3Ctext x='450.0' y='860' font-size='13' fill='%230b2545' text-anchor='middle' font-weight='bold'%3EDie 3 Pr%C3%BCfungs-Stars: BURA (NO, Fallwind, B%C3%B6en bis Orkan) %C2%B7 JUGO (SO, Schlechtwetter, Seegang) %C2%B7 MAESTRAL (NW, Sommer-Thermik)%3C/text%3E%3C/svg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<h2>Die 3 Winde, die du perfekt können musst<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Wind<\/th>\n<th>Aus<\/th>\n<th>Typisch<\/th>\n<th>Gefahr / Anzeichen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>BURA<\/strong><\/td>\n<td><strong>NO<\/strong><\/td>\n<td>Kalter, trockener <strong>Fallwind<\/strong> von den Bergen, extrem <strong>böig<\/strong>, klare Sicht, oft bei Hochdruck<\/td>\n<td>Kommt <strong>plötzlich<\/strong>. Anzeichen: <strong>Wolkenkappe über dem Gebirge<\/strong> (Velebit, Biokovo). Am stärksten im Velebit-Kanal, Kvarner, bei Senj. Im Sommer Böen bis 9–10 Bft möglich, meist 1–3 Tage<\/td>\n<\/tr>\n<tr>\n<td><strong>JUGO<\/strong><\/td>\n<td><strong>SO<\/strong><\/td>\n<td>Warm, feucht, bewölkt, Regen, <strong>baut sich über Tage auf<\/strong>, langer hoher Seegang<\/td>\n<td><strong>Fallender Luftdruck<\/strong>, diesige Sicht, Dünung aus Süden. Im Süden am stärksten, im Herbst und Winter heftiger<\/td>\n<\/tr>\n<tr>\n<td><strong>MAESTRAL<\/strong><\/td>\n<td><strong>NW<\/strong><\/td>\n<td>Thermischer <strong>Schönwetterwind<\/strong> im Sommer, ab Mittag, 3–5 Bft, abends ruhig<\/td>\n<td>Ungefährlich. Bleibt er an einem Sommertag aus, kann das Wetter umschlagen<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Merke:<\/strong> Wind wird immer nach der Richtung benannt, <strong>aus der er kommt<\/strong>.\n<strong>Burin<\/strong> = schwacher nächtlicher Landwind aus NO im Sommer.<\/p>\n<h2>Die ganze Windrose (Kroatisch)<\/h2>\n<p>N <strong>Tramontana<\/strong> · NO <strong>Bura<\/strong> · O <strong>Levanat<\/strong> · SO <strong>Jugo<\/strong> · S <strong>Oštro<\/strong> · SW <strong>Lebić (Garbin)<\/strong> · W <strong>Pulenat<\/strong> · NW <strong>Maestral<\/strong><\/p>\n<p>Tipp: Die Rose im Uhrzeigersinn ab Nord 5× laut aufsagen, dann mit geschlossenen Augen auf eine leere Skizze schreiben.<\/p>\n<h2>Beaufort-Skala – das Nötigste<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Bft<\/th>\n<th>kn<\/th>\n<th>Bezeichnung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>&lt; 1<\/td>\n<td>Stille<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>7–10<\/td>\n<td>schwach<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>11–16<\/td>\n<td>mäßig – angenehm<\/td>\n<\/tr>\n<tr>\n<td><strong>6<\/strong><\/td>\n<td><strong>22–27<\/strong><\/td>\n<td><strong>Starkwind – für kleine Boote kritisch, im Hafen bleiben<\/strong><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>34–40<\/td>\n<td>Sturm<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>&gt; 64<\/td>\n<td>Orkan<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Woher kommt der Wetterbericht?<\/h2>\n<ul>\n<li><strong>Küstenfunkstellen<\/strong> Rijeka, Split und Dubrovnik Radio senden mehrmals täglich Seewetter auf Kroatisch und Englisch (UKW)<\/li>\n<li><strong>NAVTEX<\/strong> (Station bei Split)<\/li>\n<li>Hafenämter senden eine <strong>Dauer-Wetterschleife auf UKW<\/strong>, je nach Gebiet auf Kanal 67, 69 oder 73 (<em>ungeprüft, im Kurs bestätigen lassen<\/em>)<\/li>\n<li>Internet: DHMZ (meteo.hr), Seewetter Adria<\/li>\n<li><strong>Barometer:<\/strong> Fällt der Druck schnell, z. B. mehrere hPa in 3 Stunden, kommt Sturm<\/li>\n<\/ul>\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage<\/div><p>Über dem Velebit hängt eine dichte, stehende Wolkenwalze. Was erwartest du?\n→ <strong>Bura.<\/strong> Sofort einen geschützten Hafen oder Ankerplatz suchen, aber keinen offen nach NO.<\/p><\/div>"}, {"n": "08", "t": "Knoten & Seemannschaft", "h": "<div class=\"co co-tip\"><div class=\"co-t\">Knoten werden in der Prüfung **vorgeführt**<\/div><p>Ein Kandidat musste den <strong>Palstek<\/strong> (kroatisch <em>vrzni čvor<\/em>) erst im Gang üben, weil er ihn nicht konnte (Index.hr). → Kauf dir ein Seil und knote jeden Knoten <strong>20× mit geschlossenen Augen<\/strong>. Animationen dazu findest du auf animatedknots.com.<\/p><\/div>\n\n<h2>Die 6 Knoten, die reichen<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Knoten<\/th>\n<th>Wofür<\/th>\n<th>Kurzanleitung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Palstek<\/strong> (Bowline)<\/td>\n<td><strong>Feste Schlinge<\/strong>, die sich nicht zuzieht. Festmachen am Poller, Rettungsschlinge<\/td>\n<td>Kleines Auge legen („der See“). Das Ende kommt von unten durch („der Fisch kommt aus dem See“), läuft hinter der stehenden Part herum („um den Baum“) und wieder zurück ins Auge („zurück in den See“). Festziehen<\/td>\n<\/tr>\n<tr>\n<td><strong>Webeleinstek<\/strong> (Clove hitch)<\/td>\n<td>Fender an der Reling, schnelles Festmachen an Pfahl/Stange<\/td>\n<td>2 Törns übereinander, das Ende unter dem zweiten Törn durchstecken<\/td>\n<\/tr>\n<tr>\n<td><strong>Klampenschlag<\/strong> (Cleat hitch)<\/td>\n<td>Festmachen an der <strong>Klampe<\/strong>, Standard im Hafen<\/td>\n<td>1 Rundtörn um die Klampe, dann 2–3 Achter darüber, zum Schluss ein Kopfschlag (verdrehte Schlinge)<\/td>\n<\/tr>\n<tr>\n<td><strong>Achtknoten<\/strong> (Figure eight)<\/td>\n<td><strong>Stopperknoten<\/strong> am Ende der Schot<\/td>\n<td>Eine Schlinge legen, das Ende um die stehende Part herum und von oben durch die Schlinge. Sieht aus wie eine 8<\/td>\n<\/tr>\n<tr>\n<td><strong>Kreuzknoten<\/strong> (Reef knot)<\/td>\n<td>2 <strong>gleich dicke<\/strong> Leinen verbinden, Reffen<\/td>\n<td>„Rechts über links, links über rechts“<\/td>\n<\/tr>\n<tr>\n<td><strong>Schotstek<\/strong> (Sheet bend)<\/td>\n<td>2 <strong>unterschiedlich dicke<\/strong> Leinen verbinden<\/td>\n<td>Bucht in die dicke Leine legen, die dünne Leine von unten durch, einmal herum und unter sich selbst durch<\/td>\n<\/tr>\n<tr>\n<td>Rundtörn + 2 halbe Schläge<\/td>\n<td>Festmachen an Ring oder Poller unter Last<\/td>\n<td>2× herum, dann 2 halbe Schläge um die stehende Part<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Seemannschaft – häufige Fragen<\/h2>\n<p><strong>Bootsbegriffe:<\/strong> Bug = vorne · Heck = hinten · <strong>Steuerbord = rechts<\/strong> · <strong>Backbord = links<\/strong> (in Fahrtrichtung) · Luv = dem Wind zugewandt · Lee = vom Wind abgewandt · Bilge = tiefster Raum im Rumpf · Fender = Puffer gegen Anschlagen<\/p>\n<p><strong>Ankern:<\/strong>\n- Gegen den Wind ankern\n- Anker fieren und <strong>rückwärts eingraben<\/strong> (langsam Fahrt achteraus)\n- <strong>Kettenlänge: mindestens 3–5 × Wassertiefe<\/strong>, bei Leine oder viel Wind mehr\n- Guter Grund: <strong>Sand, Schlamm<\/strong>. Schlecht: Seegras, Fels\n- In Kroatien ist Ankern innerhalb <strong>150 m von Naturstränden verboten<\/strong> (siehe <a href=\"#\" data-ch=\"10\">Kroatien-Recht &amp; Notfall<\/a>)\n- Ankerlieger: tagsüber <strong>schwarzer Ball<\/strong>, nachts <strong>weißes Rundumlicht<\/strong><\/p>\n<p><strong>Anlegen mit Muring (Mooring):<\/strong> Römisch-katholisch anlegen = <strong>mit dem Heck zum Steg<\/strong>. Die <strong>Muringleine<\/strong> vom Steg zum Bug führen und dort belegen. Vorsicht: Leine nicht in die Schraube bringen.<\/p>\n<p><strong>Mann über Bord (MOB):<\/strong>\n1. Laut <strong>„Mann über Bord!“<\/strong> rufen\n2. <strong>Rettungsring<\/strong> werfen\n3. <strong>Einen Ausguck bestimmen<\/strong>, der nur auf die Person zeigt und sie nicht aus den Augen lässt\n4. <strong>MOB-Taste<\/strong> am GPS/Plotter drücken\n5. Mit dem Motorboot: Ruder <strong>zur Seite der Person<\/strong> legen, damit <strong>Heck und Schraube von ihr wegdrehen<\/strong>. Zurückfahren, <strong>gegen den Wind<\/strong> anfahren\n6. Nahe bei der Person <strong>auskuppeln<\/strong> (Leerlauf), damit die Schraube steht\n7. Wenn nötig MAYDAY (Kanal 16)<\/p>\n<p><strong>Rettungsmittel:<\/strong> Rettungswesten für alle an Bord, Rettungsring, Feuerlöscher, Notsignale, Erste-Hilfe-Kasten, Lenzpumpe/Eimer, Taschenlampe, Paddel, Anker.<\/p>"}, {"n": "09", "t": "Motor & Technik", "h": "<h2>Checkliste vor dem Start (oft gefragt)<\/h2>\n<ol>\n<li><strong>Ölstand<\/strong> prüfen (Peilstab)<\/li>\n<li><strong>Kühlwasser-Seeventil offen?<\/strong><\/li>\n<li>Kraftstoff reicht? → <strong>Drittelregel<\/strong>: ⅓ hin, ⅓ zurück, ⅓ Reserve<\/li>\n<li><strong>Batterie-Hauptschalter<\/strong> an<\/li>\n<li>Keilriemen gespannt, keine Risse?<\/li>\n<li><strong>Bilge<\/strong> trocken, kein Kraftstoff- oder Ölgeruch?<\/li>\n<li><strong>Benzinmotor:<\/strong> Motorraum <strong>mehrere Minuten lüften<\/strong> (Gebläse). <strong>Benzindämpfe sind schwerer als Luft<\/strong>, sammeln sich in der Bilge und können explodieren<\/li>\n<li>Schalthebel auf <strong>Neutral<\/strong>, dann starten<\/li>\n<li>Nach dem Start: <strong>Kommt Kühlwasser aus dem Auspuff?<\/strong> Wenn nicht, sofort Motor aus<\/li>\n<\/ol>\n<h2>Warnlampen und was du tust<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Alarm<\/th>\n<th>Ursache<\/th>\n<th>Sofortmaßnahme<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Öldruck<\/strong><\/td>\n<td>zu wenig Öl, Ölpumpe defekt<\/td>\n<td><strong>Motor sofort aus.<\/strong> Ölstand prüfen, nachfüllen, neu starten, beobachten. Geht die Lampe wieder an: nicht weiterfahren<\/td>\n<\/tr>\n<tr>\n<td><strong>Temperatur<\/strong> (Überhitzung)<\/td>\n<td>Seewasserfilter verstopft (<strong>Plastiktüte!<\/strong>), <strong>Impeller<\/strong> kaputt, Seeventil zu, Keilriemen gerissen<\/td>\n<td>Gas weg bzw. Motor aus. <strong>Seewasser-Ansaugung und Filter prüfen<\/strong>, dann Impeller und Keilriemen<\/td>\n<\/tr>\n<tr>\n<td><strong>Ladekontrolle<\/strong> (Batterie)<\/td>\n<td>Lichtmaschine lädt nicht, Keilriemen<\/td>\n<td>Keilriemen prüfen, Stromverbrauch reduzieren<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Diesel oder Benzin<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Diesel<\/th>\n<th>Benzin<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Zündung<\/td>\n<td>Selbstzünder (Kompression), keine Zündkerzen<\/td>\n<td>Zündkerzen<\/td>\n<\/tr>\n<tr>\n<td>Brandgefahr<\/td>\n<td>gering<\/td>\n<td><strong>hoch<\/strong>, Dämpfe explosiv<\/td>\n<\/tr>\n<tr>\n<td>Typisches Problem<\/td>\n<td><strong>Luft im System<\/strong> → entlüften. Verschmutzter Filter, Wasser im Diesel<\/td>\n<td>Feuchte Zündkerzen, Dämpfe<\/td>\n<\/tr>\n<tr>\n<td>Typisch auf<\/td>\n<td>Segelyachten, größere Motorboote<\/td>\n<td>Außenborder, Speedboote<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Feuer an Bord<\/h2>\n<ul>\n<li>Feuer braucht <strong>3 Dinge<\/strong>: Brennstoff, Sauerstoff, Hitze. Eines davon wegnehmen<\/li>\n<li><strong>Fett- oder Ölbrand nie mit Wasser löschen<\/strong> → Deckel drauf oder Löschdecke<\/li>\n<li><strong>Motorraumbrand:<\/strong> Motor aus, Kraftstoffhahn zu, die Luke <strong>nicht weit öffnen<\/strong> (sonst kommt Sauerstoff dazu). Den Löscher durch einen Spalt entleeren<\/li>\n<li>Das Boot so drehen, dass <strong>der Rauch von der Crew weggeht<\/strong><\/li>\n<li>Alle ziehen Rettungswesten an, notfalls MAYDAY<\/li>\n<\/ul>\n<h2>Tanken<\/h2>\n<ul>\n<li>Motor aus, nicht rauchen, Luken zu<\/li>\n<li>Danach lüften (Benziner), Spritzer aufwischen<\/li>\n<li><strong>Umweltschutz:<\/strong> Kein Öl, kein Kraftstoff und kein Müll ins Meer. Fäkalientank nur an der Absauganlage leeren<\/li>\n<\/ul>\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage (AC Nautik)<\/div><p>2 Stunden nach dem Start von Split Richtung Vis geht die <strong>Öldrucklampe<\/strong> an. Was tust du?\n→ Motor sofort abstellen, Ölstand prüfen, nachfüllen, neu starten und beobachten.<\/p><\/div>"}, {"n": "10", "t": "Kroatien-Recht & Notfall", "h": "<h2>Zahlen, die sitzen müssen<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Was<\/th>\n<th>Wert<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Seenot-Notruf (MRCC Rijeka)<\/strong><\/td>\n<td><strong>195<\/strong> (oder 112)<\/td>\n<\/tr>\n<tr>\n<td>Notfunk<\/td>\n<td><strong>UKW Kanal 16<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Italienische Küstenwache<\/td>\n<td>1530<\/td>\n<\/tr>\n<tr>\n<td>Hoheitsgewässer<\/td>\n<td><strong>12 sm<\/strong> von der Basislinie/Küste<\/td>\n<\/tr>\n<tr>\n<td>Höchstgeschwindigkeit <strong>innerhalb 300 m von der Küste<\/strong><\/td>\n<td><strong>8 kn<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Mindestabstand zur Küste, Boot <strong>unter 15 m<\/strong><\/td>\n<td><strong>50 m<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Mindestabstand zur Küste, Boot <strong>15–30 m<\/strong><\/td>\n<td><strong>150 m<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Ankerverbot<\/strong><\/td>\n<td>innerhalb <strong>150 m von Naturstränden<\/strong> und wo es das Hafenamt verbietet<\/td>\n<\/tr>\n<tr>\n<td>Beiboot ohne eigene Papiere<\/td>\n<td>frei innerhalb <strong>500 m vom Mutterschiff<\/strong>. Weiter weg braucht ein Beiboot über 2,5 m bzw. über 5 kW eine eigene Registrierung<\/td>\n<\/tr>\n<tr>\n<td>SUP, Kajak, Jetski<\/td>\n<td>nur bis 300 m von der Küste, nur zwischen Sonnenauf- und Sonnenuntergang, nie in Badezonen<\/td>\n<\/tr>\n<tr>\n<td>Skipper B erlaubt<\/td>\n<td>Boote/Yachten bis <strong>30 BT<\/strong>, Funk inklusive (nur in Kroatien)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>Quelle der Abstands- und Tempo-Regeln: neue kroatische Sicherheitsverordnung 2025 (Pressmare, 26.04.2025).<\/em><\/p>\n<h2>Weitere Rechtsfragen, die vorkommen<\/h2>\n<ul>\n<li><strong>Gewerblich oder privat?<\/strong> Wer <strong>zahlende Gäste<\/strong> mitnimmt, betreibt gewerbliche Personenbeförderung. Dafür brauchst du eine gewerbliche Berechtigung, eine reine Kostenbeteiligung unter Freunden ausgenommen (AC Nautik)<\/li>\n<li><strong>Taucherflagge A (weiß-blau):<\/strong> Abstand halten und langsam fahren. Gäste dürfen nur mit gültiger Tauchgenehmigung tauchen (AC Nautik)<\/li>\n<li><strong>Badezonen<\/strong> sind durch gelbe Bojen markiert. Mit dem Motor nicht hineinfahren<\/li>\n<li><strong>Papiere an Bord:<\/strong> Bootsschein bzw. Fahrterlaubnis, Befähigungsnachweis (dein Skipper B), Versicherung, bei Charter die Crewliste<\/li>\n<li><strong>Alkohol:<\/strong> Es gelten Grenzwerte wie im Straßenverkehr. <em>Ungeprüft: den genauen Promillewert im Kurs nachfragen<\/em><\/li>\n<li><strong>Zuständige Behörde:<\/strong> das Hafenamt (<strong>Lučka kapetanija<\/strong>) bzw. dessen Außenstellen (Ispostava)<\/li>\n<\/ul>\n<h2>Notfall-Ablauf (allgemein)<\/h2>\n<ol>\n<li>Ruhe bewahren, <strong>Rettungswesten an<\/strong><\/li>\n<li>Lage beurteilen: Ist Leben in Gefahr?<\/li>\n<li>Ja → <strong>MAYDAY<\/strong> auf Kanal 16 bzw. <strong>195<\/strong> anrufen<\/li>\n<li>Dringend, aber keine Lebensgefahr → <strong>PAN PAN<\/strong><\/li>\n<li>Position bereithalten (GPS, Plotter)<\/li>\n<li>Notsignale bereit, Rettungsinsel klar machen<\/li>\n<li><strong>Ein Schiff erst verlassen, wenn es wirklich sinkt.<\/strong> „Steig nach oben in die Rettungsinsel“, also erst im letzten Moment<\/li>\n<\/ol>\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage (AC Nautik)<\/div><p>Du hast kein Funkgerät. Welche Nummer rufst du in Kroatien an?\n→ <strong>195<\/strong> (MRCC Rijeka).<\/p><\/div>"}], "q": [{"c": "Lichter", "q": "Welche Farbe hat das Seitenlicht an Steuerbord?", "a": "Grün", "w": ["Rot", "Weiß", "Gelb"], "e": "Steuerbord = grün, Backbord = rot."}, {"c": "Lichter", "q": "Wie groß ist der Sektor des Topplichts?", "a": "225°", "w": ["112,5°", "135°", "360°"], "e": "Von vorne bis 22,5° achterlicher als querab auf beiden Seiten."}, {"c": "Lichter", "q": "Wie groß ist der Sektor des Hecklichts?", "a": "135°", "w": ["225°", "112,5°", "180°"], "e": "225° + 135° = 360°."}, {"c": "Lichter", "q": "Du siehst nachts ein weißes Licht und darüber nichts, darunter Rot UND Grün. Was ist das?", "a": "Ein Fahrzeug kommt genau auf dich zu", "w": ["Ein Ankerlieger", "Ein Fischer", "Ein Fahrzeug fährt von dir weg"], "e": "Siehst du beide Seitenlichter, ist es direkt voraus auf Gegenkurs."}, {"c": "Lichter", "q": "Du siehst ein Topplicht und nur ein ROTES Seitenlicht. Was tust du (beide Maschinenfahrzeuge)?", "a": "Ich muss ausweichen – er kommt von rechts", "w": ["Kurs halten", "Nach Backbord ausweichen", "Nichts, er weicht aus"], "e": "Rot sehen = Ampel rot = du handelst. Er ist an deiner Steuerbordseite."}, {"c": "Lichter", "q": "Was bedeuten zwei rote Rundumlichter senkrecht übereinander?", "a": "Manövrierunfähig", "w": ["Vor Anker", "Lotsenfahrzeug", "Fischer"], "e": "Rot-Rot = ‚ich kann nicht‘. Am Tag: 2 schwarze Bälle."}, {"c": "Lichter", "q": "Was bedeutet Rot-Weiß-Rot senkrecht (Rundumlichter)?", "a": "Manövrierbehindert (z. B. Bagger)", "w": ["Manövrierunfähig", "Tiefgangbehindert", "Auf Grund gelaufen"], "e": "Am Tag: Ball – Rhombus – Ball."}, {"c": "Lichter", "q": "Grün über Weiß (Rundumlichter) zeigt …", "a": "einen Trawler (schleppt Netz)", "w": ["einen Lotsen", "einen Segler", "einen Ankerlieger"], "e": "Rot über Weiß = anderer Fischer."}, {"c": "Lichter", "q": "Weiß über Rot (Rundumlichter) zeigt …", "a": "ein Lotsenfahrzeug", "w": ["einen Fischer", "ein manövrierunfähiges Schiff", "einen Schlepper"], "e": "‚Weiß über Rot – Lotse im Boot‘."}, {"c": "Lichter", "q": "Drei rote Rundumlichter senkrecht bedeuten …", "a": "tiefgangbehindert", "w": ["auf Grund gelaufen", "manövrierunfähig", "Taucherarbeiten"], "e": "Am Tag: schwarzer Zylinder."}, {"c": "Lichter", "q": "Welches Signal zeigt ein Ankerlieger am Tag?", "a": "Einen schwarzen Ball", "w": ["Einen schwarzen Kegel", "Zwei Bälle", "Einen Zylinder"], "e": "Nachts: weißes Rundumlicht."}, {"c": "Lichter", "q": "Ein Segelboot fährt unter Motor. Was zeigt es am Tag?", "a": "Schwarzer Kegel, Spitze nach unten", "w": ["Schwarzer Ball", "Zwei Kegel", "Nichts"], "e": "Unter Motor gilt es als Maschinenfahrzeug."}, {"c": "Lichter", "q": "Welche Lichter führt ein Segler unter Segeln (unter 20 m)?", "a": "Seitenlichter + Hecklicht (oder Dreifarbenlaterne)", "w": ["Topplicht + Seitenlichter", "Nur ein weißes Rundumlicht", "Rot über Weiß"], "e": "Ein Segler hat KEIN Topplicht."}, {"c": "Lichter", "q": "Tragweite der Seitenlichter bei einem Boot unter 12 m?", "a": "1 sm", "w": ["2 sm", "3 sm", "5 sm"], "e": "Topplicht 2 sm, Hecklicht 2 sm."}, {"c": "Ausweichen", "q": "Zwei Motorboote auf direktem Gegenkurs. Was tun?", "a": "Beide weichen nach Steuerbord aus", "w": ["Beide nach Backbord", "Der Größere hält Kurs", "Der von links weicht"], "e": "Regel 14 – Backbord an Backbord passieren."}, {"c": "Ausweichen", "q": "Zwei Motorboote kreuzen. Wer weicht aus?", "a": "Wer den anderen an seiner Steuerbordseite sieht", "w": ["Wer den anderen an Backbord sieht", "Das schnellere Boot", "Das größere Boot"], "e": "Regel 15 – wie ‚rechts vor links‘."}, {"c": "Ausweichen", "q": "Wer weicht beim Überholen aus?", "a": "Immer der Überholer", "w": ["Immer das langsamere Boot", "Der Segler", "Der Motorbootfahrer"], "e": "Regel 13 gilt für alle, auch für Segler."}, {"c": "Ausweichen", "q": "Zwei Segler, verschiedene Bugs. Wer weicht?", "a": "Der mit Wind von Backbord (Backbordbug)", "w": ["Der mit Wind von Steuerbord", "Der in Lee", "Der Schnellere"], "e": "Backbordbug weicht Steuerbordbug."}, {"c": "Ausweichen", "q": "Zwei Segler, gleicher Bug. Wer weicht?", "a": "Der Luv-Segler", "w": ["Der Lee-Segler", "Der Größere", "Keiner"], "e": "Luv weicht Lee."}, {"c": "Ausweichen", "q": "Du fährst Motorboot, ein Segler unter Segeln kreuzt von Backbord. Wer weicht?", "a": "Du (Motorboot)", "w": ["Der Segler", "Wer von rechts kommt", "Keiner"], "e": "Maschine weicht Segel."}, {"c": "Ausweichen", "q": "Woran erkennst du Kollisionsgefahr?", "a": "Die Peilung bleibt gleich und der Abstand nimmt ab", "w": ["Die Peilung ändert sich schnell", "Das Schiff wird kleiner", "Es zeigt Rot und Grün"], "e": "Regel 7 – stehende Peilung."}, {"c": "Ausweichen", "q": "Wie soll ein Ausweichmanöver sein?", "a": "Früh, deutlich und groß", "w": ["Spät und klein", "Nur Geschwindigkeit ändern", "Immer nach Backbord"], "e": "Regel 8 – damit der andere es erkennt."}, {"c": "Ausweichen", "q": "Wo fährst du in einem engen Fahrwasser?", "a": "Rechts (Steuerbordseite)", "w": ["Links", "In der Mitte", "Egal"], "e": "Regel 9."}, {"c": "Ausweichen", "q": "Was muss ein Kurshalter tun?", "a": "Kurs und Geschwindigkeit beibehalten", "w": ["Sofort stoppen", "Nach Backbord drehen", "Schallsig let tab = "lernen";
function go(t, arg){
  tab = t;
  document.querySelectorAll("nav.bot button").forEach(b => { if(b.dataset.tab===t) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if (t === "lernen") arg == null ? renderToc() : renderChapter(arg);
  if (t === "karten") renderCardsStart();
  if (t === "quiz") renderQuizStart();
  window.scrollTo(0,0);
}
document.querySelectorAll("nav.bot button").forEach(b => b.onclick = () => go(b.dataset.tab));

function renderToc(){
  const known = store.get("known", {});
  const k = Object.keys(known).filter(i => known[i]).length;
  $("#hdrInfo").textContent = "Voditelj brodice";
  view.innerHTML = `
    <h2>Die 30 %, die du zum Bestehen brauchst</h2>
    <p>Mündliche Prüfung vor 3 Prüfern, ca. 20 Minuten, plus Seekarte und Knoten. Lies ein Kapitel, dann trainier mit <b>Karten</b> und <b>Quiz</b>.</p>

      <div class="stat"><b>${DATA.q.length}</b><span class="lbl">Fragen</span></div>
      <div class="stat"><b>${k}</b><span class="lbl">Karten gewusst</span></div>
      <div class="stat"><b>${store.get("best",0)}%</b><span class="lbl">Bestes Quiz</span></div>
    </div>
    <div class="bar"><i style="width:${Math.round(k/DATA.q.length*100)}%"></i></div>
    <div class="toc">${DATA.ch.map((c,i) => `<button data-i="${i}"><span class="no">${c.n}</span>${esc(c.t)}</button>`).join("")}</div>`;
  view.querySelectorAll(".toc button").forEach(b => b.onclick = () => go("lernen", +b.dataset.i));
}
function renderChapter(i){
  const c = DATA.ch[i];
  $("#hdrInfo").textContent = `Kapitel ${c.n} / ${DATA.ch[DATA.ch.length-1].n}`;
  store.set("lastCh", i);
  view.innerHTML = `
    <div class="chips">${DATA.ch.map((x,j)=>`<button data-i="${j}" aria-pressed="${j===i}">${x.n} ${esc(x.t.split(" ")[0])}</button>`).join("")}</div>
    <h2>${esc(c.t)}</h2>${c.h}
    <div class="pager">
      <button class="btn ghost" id="prev" ${i===0?"hidden":""}>← Zurück</button>
      ${i < DATA.ch.length-1 ? `<button class="btn" id="next">Weiter: ${esc(DATA.ch[i+1].t)} →</button>` : `<button class="btn" id="toQuiz">Zum Quiz →</button>`}
    </div>`;
  view.querySelectorAll(".chips button").forEach(b => b.onclick = () => go("lernen", +b.dataset.i));
  const act = view.querySelector('.chips [aria-pressed="true"]'); if (act) act.scrollIntoView({inline:"center",block:"nearest"});
  $("#prev") && ($("#prev").onclick = () => go("lernen", i-1));
  $("#next") && ($("#next").onclick = () => go("lernen", i+1));
  $("#toQuiz") && ($("#toQuiz").onclick = () => go("quiz"));
  view.querySelectorAll("a[data-ch]").forEach(a => a.onclick = e => { e.preventDefault(); const j = DATA.ch.findIndex(x => x.n === a.dataset.ch); if (j>=0) go("lernen", j); });
  view.querySelectorAll(".fig img").forEach(img => img.onclick = () => zoom(img.src));
}
function zoom(src){
  const z = document.createElement("div"); z.className = "zoom";
  z.innerHTML = `<button class="x" aria-label="Schließen">×</button><img src="${src}" alt="Grafik groß">`;
  z.querySelector(".x").onclick = () => z.remove();
  document.body.appendChild(z);
}

let deck = [], di = 0;
function catPicker(id){
  return `<div class="chips" id="${id}"><button data-c="" aria-pressed="true">Alle</button>${cats.map(c=>`<button data-c="${esc(c)}" aria-pressed="false">${esc(c)}</button>`).join("")}</div>`;
}
function bindPicker(id, cb){
  let sel = "";
  view.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => {
    sel = b.dataset.c; view.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute("aria-pressed", x===b)); cb && cb(sel);
  });
  return () => sel;
}
function renderCardsStart(){
  $("#hdrInfo").textContent = "Karteikarten";
  const known = store.get("known", {});
  view.innerHTML = `<h2>Karteikarten</h2>
    <p>Frage lesen, <b>laut antworten</b>, Karte antippen zum Umdrehen. Karten mit „Nochmal“ kommen wieder dran.</p>
    <span class="lbl">Thema</span>${catPicker("cp")}
    <div class="row" style="margin-top:14px"><button class="btn" id="startAll">Alle mischen</button><button class="btn ghost" id="startNew">Nur noch nicht gewusste</button></div>
    <p class="lbl" style="margin-top:14px">${Object.values(known).filter(Boolean).length} von ${DATA.q.length} als gewusst markiert</p>
    <button class="btn ghost" id="reset">Fortschritt zurücksetzen</button>`;
  const getCat = bindPicker("cp");
  const start = onlyNew => {
    const k = store.get("known", {});
    deck = shuffle(DATA.q.filter(q => (!getCat() || q.c === getCat()) && (!onlyNew || !k[q.id])));
    di = 0; deck.length ? renderCard() : (view.innerHTML = `<h2>Alles gewusst! 🎉</h2><p>In diesem Thema hast du alle Karten. Wechsle zum Quiz.</p><button class="btn" onclick="go('quiz')">Zum Quiz</button>`);
  };
  $("#startAll").onclick = () => start(false);
  $("#startNew").onclick = () => start(true);
  $("#reset").onclick = e => { if (e.target.dataset.sure) { store.set("known", {}); renderCardsStart(); } else { e.target.dataset.sure = 1; e.target.textContent = "Wirklich zurücksetzen? Nochmal tippen"; } };
}
function renderCard(){
  const q = deck[di];
  view.innerHTML = `<p class="lbl" style="margin-top:16px">${esc(q.c)} · Karte ${di+1} / ${deck.length}</p>
    <div class="bar"><i style="width:${di/deck.length*100}%"></i></div>
    <div class="card" id="card" role="button" tabindex="0" aria-label="Karte umdrehen">
      <div class="card-in">
        <div class="face"><div class="q">${esc(q.q)}</div><div class="hint">Antippen zum Umdrehen</div></div>
        <div class="face back"><div class="a">${esc(q.a)}</div>${q.e?`<div class="e">${esc(q.e)}</div>`:""}<div class="hint">Wusstest du es?</div></div>
      </div>
    </div>
    <div class="row"><button class="btn no" id="again">Nochmal</button><button class="btn ok" id="knew">Gewusst</button></div>`;
  const card = $("#card");
  const flip = () => card.classList.toggle("flip");
  card.onclick = flip; card.onkeydown = e => { if (e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); } };
  const next = ok => {
    const k = store.get("known", {}); k[q.id] = ok; store.set("known", k);
    if (!ok) deck.push(q);
    di++; di < deck.length ? renderCard() : (view.innerHTML = `<h2>Stapel durch ✔</h2><p>Stark. Jetzt das Quiz probieren – das ist näher an der Prüfung.</p><div class="row"><button class="btn ghost" id="more">Neuer Stapel</button><button class="btn" id="tq">Zum Quiz</button></div>`, $("#more").onclick=renderCardsStart, $("#tq").onclick=()=>go("quiz"));
  };
  $("#again").onclick = () => next(false);
  $("#knew").onclick = () => next(true);
}

/* ---------- QUIZ ---------- */
let qz = [], qi = 0, qright = 0, qwrong = [];
function renderQuizStart(){
  $("#hdrInfo").textContent = "Quiz";
  const miss = store.get("miss", []);
  view.innerHTML = `<h2>Quiz</h2>
    <p>Multiple Choice mit Erklärung. In der echten Prüfung musst du frei antworten, also erst im Kopf antworten und dann tippen.</p>
    <span class="lbl">Thema</span>${catPicker("qp")}
    <span class="lbl">Anzahl</span>
    <div class="chips" id="np"><button data-n="10" aria-pressed="true">10</button><button data-n="20" aria-pressed="false">20</button><button data-n="999" aria-pressed="false">Alle</button></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="qs">Quiz starten</button></div>
    ${miss.length ? `<div class="row" style="margin-top:10px"><button class="btn ghost" id="qm">Meine Fehler wiederholen (${miss.length})</button></div>` : ""}
    <div class="stats" style="margin-top:18px"><div class="stat"><b>${store.get("best",0)}%</b><span class="lbl">Bestes Ergebnis</span></div><div class="stat"><b>${store.get("runs",0)}</b><span class="lbl">Durchgänge</span></div></div>`;
  const getCat = bindPicker("qp");
  let n = 10;
  view.querySelectorAll("#np button").forEach(b => b.onclick = () => { n = +b.dataset.n; view.querySelectorAll("#np button").forEach(x => x.setAttribute("aria-pressed", x===b)); });
  $("#qs").onclick = () => startQuiz(shuffle(DATA.q.filter(q => !getCat() || q.c === getCat())).slice(0, n));
  $("#qm") && ($("#qm").onclick = () => startQuiz(shuffle(DATA.q.filter(q => miss.includes(q.id)))));
}
function startQuiz(list){ qz = list; qi = 0; qright = 0; qwrong = []; renderQ(); }
function renderQ(){
  const q = qz[qi];
  const opts = shuffle([q.a, ...q.w]);
  view.innerHTML = `<p class="lbl" style="margin-top:16px">${esc(q.c)} · Frage ${qi+1} / ${qz.length} · ${qright} richtig</p>
    <div class="bar"><i style="width:${qi/qz.length*100}%"></i></div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-o="${i}">${esc(o)}</button>`).join("")}</div>
    <div id="after"></div>`;
  view.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (view.querySelector(".opt.right")) return;
    const ok = opts[+b.dataset.o] === q.a;
    view.querySelectorAll(".opt").forEach(x => { if (opts[+x.dataset.o] === q.a) x.classList.add("right"); x.disabled = true; });
    if (!ok) { b.classList.add("wrong"); qwrong.push(q.id); } else qright++;
    const miss = new Set(store.get("miss", [])); ok ? miss.delete(q.id) : miss.add(q.id); store.set("miss", [...miss]);
    $("#after").innerHTML = `<div class="fb"><b>${ok ? "Richtig." : "Falsch. Richtig ist: " + esc(q.a)}</b>${q.e ? "<br>" + esc(q.e) : ""}</div>
      <button class="btn" id="nx" style="width:100%">${qi < qz.length-1 ? "Nächste Frage →" : "Ergebnis anzeigen"}</button>`;
    $("#nx").onclick = () => { qi++; qi < qz.length ? renderQ() : renderResult(); };
    $("#nx").scrollIntoView({block:"nearest", behavior:"smooth"});
  });
}
function renderResult(){
  const pct = Math.round(qright / qz.length * 100);
  store.set("runs", store.get("runs",0) + 1);
  if (pct > store.get("best",0)) store.set("best", pct);
  const verdict = pct >= 90 ? "Prüfungsreif in diesem Bereich." : pct >= 70 ? "Gut. Die Fehler noch einmal anschauen." : "Noch üben: Kapitel lesen, dann nochmal.";
  view.innerHTML = `<p class="lbl" style="margin-top:20px">Ergebnis</p>
    <div class="score" style="color:${pct>=70?'var(--stbd)':'var(--port)'}">${pct}%</div>
    <p><b>${qright} von ${qz.length}</b> richtig. ${verdict}</p>
    ${qwrong.length ? `<h3>Falsch beantwortet</h3><div class="tw"><table><tr><th>Frage</th><th>Richtig</th></tr>${qwrong.map(id=>{const q=DATA.q[id];return `<tr><td>${esc(q.q)}</td><td><b>${esc(q.a)}</b></td></tr>`}).join("")}</table></div>` : ""}
    <div class="row" style="margin-top:16px"><button class="btn ghost" id="b1">Neues Quiz</button>${qwrong.length?`<button class="btn" id="b2">Fehler wiederholen</button>`:""}</div>`;
  $("#b1").onclick = renderQuizStart;
  $("#b2") && ($("#b2").onclick = () => startQuiz(shuffle(qwrong.map(id => DATA.q[id]))));
}

go("lernen");
</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>
</body></html>
