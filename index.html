/* Karteikarten */

<script>
const DATA = {"ch": [{"n": "00", "t": "Prüfung & Lernplan", "h": "<div class=\"co co-danger\"><div class=\"co-t\">Das Wichtigste zuerst: Die Regeln ändern sich bald<\/div><p>Das kroatische Ministerium bereitet eine neue Verordnung vor. Danach musst du <strong>vor der Prüfung Pflicht-Fahrstunden mit einem Ausbilder<\/strong> machen. Bisher reicht die Theorieprüfung.\n- Laut Nautička Patrola (22.07.2026) soll die Verordnung „dieses Jahr oder zu Beginn der nächsten Saison“ in Kraft treten. Vorher kommt noch die öffentliche Konsultation (e-Savjetovanje).\n- Wer den Schein schon hat, bleibt verschont (Bestandsschutz).\n- <strong>Konsequenz: Die Prüfung so bald wie möglich machen.<\/strong> Vor der Buchung bei der Bootsschule bzw. beim Hafenamt nachfragen, ob die neue Regel schon gilt.<\/p><\/div>\n\n<h2>So läuft die Prüfung ab (Stand 2026)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Punkt<\/th>\n<th>Fakt<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Form<\/td>\n<td><strong>Mündlich<\/strong>, rein theoretisch, vor einer <strong>dreiköpfigen Kommission<\/strong>. Jedes Mitglied prüft eigene Themen<\/td>\n<\/tr>\n<tr>\n<td>Dauer<\/td>\n<td>ca. 15–30 Minuten<\/td>\n<\/tr>\n<tr>\n<td>Praktisch<\/td>\n<td>Nur <strong>Seekartenarbeit<\/strong> (Position, Kurs, Distanz) und <strong>Knoten<\/strong> am Tisch. Keine Fahrprüfung<\/td>\n<\/tr>\n<tr>\n<td>Ergebnis<\/td>\n<td>Nur „bestanden“ / „nicht bestanden“, sofort. Wenn du durchfällst: Wiederholung beim nächsten Termin<\/td>\n<\/tr>\n<tr>\n<td>Wo<\/td>\n<td>Ministerium in Zagreb oder Hafenamt (Lučka kapetanija): Pula, Rijeka, Senj, Zadar, Šibenik, Split, Ploče, Dubrovnik<\/td>\n<\/tr>\n<tr>\n<td>Sprache<\/td>\n<td>Kroatisch, Englisch, teils Deutsch oder Italienisch (für Ausländer vorher beantragen). Über eine Bootsschule klären<\/td>\n<\/tr>\n<tr>\n<td>Gebühr<\/td>\n<td>Staatliche Gebühr Kat. B: 58,40 €, für Ausländer (EN/DE) <strong>108,83 €<\/strong>. Kurs zusätzlich ca. 150–350 €<\/td>\n<\/tr>\n<tr>\n<td>Unterlagen<\/td>\n<td>Antragsformular, 2 Passfotos (3 × 3,5 cm), Ausweiskopie, Kopie des Führerscheins (gilt als Erste-Hilfe-Nachweis), Zahlungsbeleg<\/td>\n<\/tr>\n<tr>\n<td>Alter<\/td>\n<td>ab 16<\/td>\n<\/tr>\n<tr>\n<td>Gültig<\/td>\n<td>unbefristet. Erlaubt Boote/Yachten bis <strong>30 BT<\/strong> (ca. 18–20 m), ohne PS-Grenze. <strong>UKW-Funkberechtigung ist enthalten<\/strong>, gilt aber nur für kroatische Gewässer<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"co co-info\"><div class=\"co-t\">Zu „geleakten Tests“<\/div><p>Es gibt <strong>keinen schriftlichen Test<\/strong> und <strong>keinen offiziellen Fragenkatalog<\/strong>, also kann auch nichts geleakt sein. Die Prüfer fragen frei aus ihrem eigenen Fragenpool. Die Bootsschulen sammeln, was immer wieder kommt. Daraus sind <a href=\"#\" data-ch=\"11\">Übungsfragen<\/a> gebaut, zusammen mit echten Beispielfragen der Schule AC Nautik und dem Erfahrungsbericht eines Kandidaten (Index.hr).<\/p><\/div>\n\n<h2>Die 30 %, die 80 % der Prüfung ausmachen<\/h2>\n<p>Reihenfolge = Priorität. Was fett ist, kommt <strong>fast immer<\/strong>.<\/p>\n<ol>\n<li><strong>Seekarte<\/strong>: Position ablesen/eintragen, <strong>Distanz auf der Breitenskala<\/strong>, Kartenzeichen → <a href=\"#\" data-ch=\"06\">Navigation &amp; Seekarte<\/a><\/li>\n<li><strong>Lichterführung<\/strong>: Was siehst du nachts, wer ist das → <a href=\"#\" data-ch=\"01\">Lichterführung<\/a><\/li>\n<li><strong>Ausweichregeln<\/strong>: wer weicht wem → <a href=\"#\" data-ch=\"02\">Ausweichregeln<\/a><\/li>\n<li><strong>Seezeichen<\/strong>, vor allem <strong>Kardinalzeichen<\/strong>, und Lateral rot/grün → <a href=\"#\" data-ch=\"03\">Seezeichen<\/a><\/li>\n<li><strong>Notfall<\/strong>: <strong>MAYDAY-Meldung<\/strong>, <strong>Kanal 16<\/strong>, <strong>Tel. 195<\/strong>, Mann über Bord → <a href=\"#\" data-ch=\"05\">UKW-Funk<\/a> · <a href=\"#\" data-ch=\"10\">Kroatien-Recht &amp; Notfall<\/a><\/li>\n<li><strong>Windrose / Bura / Jugo / Maestral<\/strong> → <a href=\"#\" data-ch=\"07\">Wetter Adria<\/a><\/li>\n<li><strong>Knoten<\/strong>: Palstek, Webeleinstek, Klampe, Achter → <a href=\"#\" data-ch=\"08\">Knoten &amp; Seemannschaft<\/a><\/li>\n<li><strong>Motor-Warnlampen<\/strong>: Öldruck, Temperatur → <a href=\"#\" data-ch=\"09\">Motor &amp; Technik<\/a><\/li>\n<li>Schall- und Notsignale → <a href=\"#\" data-ch=\"04\">Schall- und Notsignale<\/a><\/li>\n<\/ol>\n<h2>7-Tage-Lernplan (60–90 min pro Tag)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tag<\/th>\n<th>Thema<\/th>\n<th>Erledigt<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Lichter + Hierarchie „wer weicht wem“<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Ausweichregeln + Schallsignale<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Seezeichen (Kardinal auswendig!) + Feuerkennungen<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Seekarte: Position, Distanz, Kurs, Kompass-Rechnung. <strong>Mit echter Karte üben<\/strong><\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Funk: MAYDAY auswendig aufsagen + Notsignale + Kroatien-Regeln<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Wetter + Knoten (Seil kaufen, je 20× knoten) + Motor<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Alle <a href=\"#\" data-ch=\"11\">Übungsfragen<\/a> laut beantworten. Was falsch war, nochmal<\/td>\n<td>☐<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Tipp:<\/strong> Die Prüfung ist mündlich, also <strong>laut antworten<\/strong> üben und nicht nur lesen. Am besten fragt dich jemand ab.<\/p>\n<h2>Nächste Schritte<\/h2>\n<ul>\n<li>[ ] Bootsschule mit Kurs + Prüfungstermin wählen (Wochenend-Pakete gibt es in Rijeka, Split, Zadar …) und dabei fragen: <strong>Gilt die neue Praxispflicht schon?<\/strong><\/li>\n<li>[ ] Prüfungssprache klären (Deutsch nicht überall)<\/li>\n<li>[ ] 2 Passfotos 3 × 3,5 cm machen<\/li>\n<li>[ ] Seil (ca. 1,5 m, 8–10 mm) für die Knoten besorgen<\/li>\n<li>[ ] Optional eine Lern-App, z. B. Nautly (Voditelj brodice B), oder ein Fragenkatalog-Buch („Das kroatische Küstenpatent – Fragenkatalog“)<\/li>\n<\/ul>\n<h2>Quellen<\/h2>\n<ul>\n<li>HRT, 22.06.2026: <a href=\"https://vijesti.hrt.hr/hrvatska/za-upravljanje-brodicom-vise-nece-biti-dovoljan-samo-ispit-12779728\">Za upravljanje brodicom više neće biti dovoljan samo ispit<\/a><\/li>\n<li>Nautička Patrola, 22.07.2026: <a href=\"https://www.nauticka-patrola.hr/paznja-evo-sto-donose-nove-odredbe-za-voditelje-brodica-i-skipere/\">Što donose nove odredbe za voditelje brodica<\/a><\/li>\n<li>Seamasterclass (06/2026, Preise Stand 31.10.2026): <a href=\"https://seamasterclass.com.hr/kako-poloziti-ispit-za-voditelja-brodice-b/\">Kako položiti ispit<\/a> · <a href=\"https://seamasterclass.com.hr/cesta-pitanja-voditelj-brodice-b-kategorije/\">FAQ<\/a><\/li>\n<li>Nautly: <a href=\"https://nautly.io/\">Croatian Boat Licence App<\/a><\/li>\n<li>AC Nautik: <a href=\"https://www.kuestenpatent-kroatien.at/ac-nautik-blog/pruefungsfragen-fuer-den-boat-skipper-b-sinn-oder-unsinn/\">Prüfungsfragen Boat Skipper B<\/a> · <a href=\"https://www.kuestenpatent-kroatien.at/ac-nautik-blog/bootsfuehrerschein-kroatien-pruefungsfragen/\">Prüfungsthemen<\/a><\/li>\n<li>Index.hr, 2019, Erfahrungsbericht: <a href=\"https://www.index.hr/clanak.aspx?id=2108504\">Indexov novinar postao voditelj brodice<\/a><\/li>\n<li>Bootsschule1: <a href=\"https://bootsschule1.de/blog/bootsfuehrerschein-kroatien/\">Bootsführerschein Kroatien<\/a><\/li>\n<\/ul>"}, {"n": "01", "t": "Lichterführung", "h": "<div class=\"co co-tip\"><div class=\"co-t\">Kommt fast immer<\/div><p>Der Prüfer zeigt ein Bild oder beschreibt Lichter, zum Beispiel: „Du siehst rot über weiß und ein grünes Licht. Was ist das, und was machst du?“<\/p><\/div>\n\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 660' width='720' height='660' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='720' height='660' fill='%23ffffff'/%3E%3Ctext x='360' y='36' font-size='22' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ELichtersektoren eines Maschinenfahrzeugs (Draufsicht)%3C/text%3E%3Cpath d='M360,330 L129.0,425.7 A250,250 0 1 1 591.0,425.7 Z' fill='%23ffd84d' fill-opacity='0.3' stroke='none' stroke-width='2'/%3E%3Cpath d='M360,330 L360.0,130.0 A200,200 0 0 1 544.8,406.5 Z' fill='%231b9e3e' fill-opacity='0.55' stroke='none' stroke-width='2'/%3E%3Cpath d='M360,330 L175.2,406.5 A200,200 0 0 1 360.0,130.0 Z' fill='%23d62828' fill-opacity='0.55' stroke='none' stroke-width='2'/%3E%3Cpath d='M360,330 L544.8,406.5 A200,200 0 0 1 175.2,406.5 Z' fill='%239aa5b1' fill-opacity='0.45' stroke='none' stroke-width='2'/%3E%3Cg transform='translate(360,330) rotate(0)'%3E%3Cpath d='M0,-56.0 C25.2,-28.0 22.4,28.0 19.599999999999998,53.199999999999996 L-19.599999999999998,53.199999999999996 C-22.4,28.0 -25.2,-28.0 0,-56.0 Z' fill='%230b2545'/%3E%3C/g%3E%3Ctext x='360' y='95' font-size='17' fill='%237a5c00' text-anchor='middle' font-weight='bold'%3ETopplicht WEISS %C2%B7 225%C2%B0%3C/text%3E%3Ctext x='360' y='116' font-size='13' fill='%237a5c00' text-anchor='middle' font-weight='normal'%3E(von vorne bis 22,5%C2%B0 achterlicher als querab)%3C/text%3E%3Ctext x='506.06526015770584' y='251.71299351409544' font-size='16' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3ESTEUERBORD%3C/text%3E%3Ctext x='506.06526015770584' y='271.71299351409544' font-size='15' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EGR%C3%9CN 112,5%C2%B0%3C/text%3E%3Ctext x='213.93473984229414' y='251.71299351409544' font-size='16' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EBACKBORD%3C/text%3E%3Ctext x='213.93473984229414' y='271.71299351409544' font-size='15' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EROT 112,5%C2%B0%3C/text%3E%3Ctext x='360' y='480' font-size='16' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EHecklicht WEISS %C2%B7 135%C2%B0%3C/text%3E%3Ctext x='360' y='620' font-size='16' fill='%230b2545' text-anchor='middle' font-weight='normal'%3EMerke: 225%C2%B0 %2B 135%C2%B0 = 360%C2%B0  %C2%B7  112,5%C2%B0 %2B 112,5%C2%B0 = 225%C2%B0%3C/text%3E%3Ctext x='360' y='642' font-size='15' fill='%23d62828' text-anchor='middle' font-weight='bold'%3ESiehst du ROT und GR%C3%9CN gleichzeitig %E2%86%92 das Fahrzeug kommt genau auf dich zu%21%3C/text%3E%3C/svg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<h2>Die 4 Grundlichter<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Licht<\/th>\n<th>Farbe<\/th>\n<th>Sektor<\/th>\n<th>Merke<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Topplicht (Masthead)<\/td>\n<td>weiß<\/td>\n<td>225° nach vorne<\/td>\n<td>nur <strong>Maschinen<\/strong>fahrzeuge<\/td>\n<\/tr>\n<tr>\n<td>Seitenlicht Steuerbord (rechts)<\/td>\n<td><strong>grün<\/strong><\/td>\n<td>112,5°<\/td>\n<td>„<strong>S<\/strong>teuerbord = <strong>g<\/strong>rün“ (S-G)<\/td>\n<\/tr>\n<tr>\n<td>Seitenlicht Backbord (links)<\/td>\n<td><strong>rot<\/strong><\/td>\n<td>112,5°<\/td>\n<td>„<strong>B<\/strong>ackbord = <strong>r<\/strong>ot“ wie roter <strong>Port<\/strong>wein (Port = Backbord)<\/td>\n<\/tr>\n<tr>\n<td>Hecklicht<\/td>\n<td>weiß<\/td>\n<td>135° nach hinten<\/td>\n<td>sieht der Überholer<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Tragweiten bei Booten unter 12 m:<\/strong> Topplicht 2 sm · Seitenlichter 1 sm · Hecklicht 2 sm. (12–20 m: Topplicht 3 sm, Seiten 2 sm, Heck 2 sm.)<\/p>\n<h2>Was siehst du von einem anderen Boot?<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Du siehst<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weiß + <strong>rot + grün<\/strong><\/td>\n<td>kommt <strong>genau auf dich zu<\/strong> → beide nach Steuerbord ausweichen<\/td>\n<\/tr>\n<tr>\n<td>Weiß + nur <strong>rot<\/strong><\/td>\n<td>du siehst seine Backbordseite, es kommt <strong>von rechts<\/strong> → <strong>DU musst ausweichen<\/strong> (Ampel rot = du handelst)<\/td>\n<\/tr>\n<tr>\n<td>Weiß + nur <strong>grün<\/strong><\/td>\n<td>du siehst seine Steuerbordseite, es kommt <strong>von links<\/strong> → du bist Kurshalter (Ampel grün = weiterfahren, aufpassen)<\/td>\n<\/tr>\n<tr>\n<td>Nur ein weißes Licht (tief)<\/td>\n<td>Hecklicht → du bist der <strong>Überholer<\/strong> (oder es ist ein Ankerlieger)<\/td>\n<\/tr>\n<tr>\n<td>Rot + grün <strong>ohne<\/strong> Topplicht<\/td>\n<td><strong>Segler<\/strong> kommt auf dich zu<\/td>\n<\/tr>\n<tr>\n<td>2 weiße Topplichter übereinander<\/td>\n<td>Maschinenfahrzeug ≥ 50 m (hinteres Topplicht höher) <strong>oder<\/strong> Schlepper<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Merksatz:<\/strong> <em>„Grün an grün, rot an rot – alles klar, keine Not.“<\/em> Wenn sich zwei Boote ihre gleichfarbigen Seitenlichter zeigen, fahren sie sicher aneinander vorbei.<\/p>\n<h2>Je nach Fahrzeug<\/h2>\n<ul>\n<li><strong>Maschinenfahrzeug &lt; 50 m:<\/strong> Topplicht + Seitenlichter + Hecklicht<\/li>\n<li><strong>Maschinenfahrzeug &lt; 12 m:<\/strong> darf statt Topp- und Hecklicht <strong>ein weißes Rundumlicht<\/strong> + Seitenlichter führen<\/li>\n<li><strong>Boot &lt; 7 m und &lt; 7 kn:<\/strong> ein weißes Rundumlicht reicht<\/li>\n<li><strong>Segler:<\/strong> Seitenlichter + Hecklicht, <strong>kein Topplicht<\/strong>. Unter 20 m auch als <strong>Dreifarbenlaterne<\/strong> im Masttopp<\/li>\n<li><strong>Segler unter Motor = Maschinenfahrzeug<\/strong> → Topplicht an. Am Tag: <strong>schwarzer Kegel, Spitze nach unten<\/strong><\/li>\n<li><strong>Ruderboot:<\/strong> weiße Taschenlampe bereithalten<\/li>\n<\/ul>\n<h2>Rundumlichter und Signalkörper (Tag)<\/h2>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 760' width='900' height='760' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='900' height='760' fill='%23ffffff'/%3E%3Ctext x='450.0' y='40' font-size='24' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ERundumlichter (Nacht) und Signalk%C3%B6rper (Tag)%3C/text%3E%3Ctext x='450.0' y='66' font-size='14' fill='%23555' text-anchor='middle' font-weight='normal'%3ELichter von oben nach unten gelesen %C2%B7 so sieht man sie senkrecht am Mast%3C/text%3E%3Ctext x='30' y='96' font-size='15' fill='%230b2545' text-anchor='start' font-weight='bold'%3EFahrzeug%3C/text%3E%3Ctext x='340' y='96' font-size='15' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ENacht%3C/text%3E%3Ctext x='450' y='96' font-size='15' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ETag%3C/text%3E%3Ctext x='520' y='96' font-size='15' fill='%230b2545' text-anchor='start' font-weight='bold'%3EMerkhilfe%3C/text%3E%3Crect x='15' y='110' width='870' height='62' fill='%23eef3fa'/%3E%3Ctext x='30' y='146.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3EAnkerlieger%3C/text%3E%3Crect x='315' y='114' width='50' height='54' rx='6' fill='%230b1a2e'/%3E%3Ccircle cx='340' cy='141.0' r='7.5' fill='%23ffffff'/%3E%3Cg transform='translate(450,141.0) scale(0.7) translate(-450,-141.0)'%3E%3Ccircle cx='450' cy='141.0' r='11' fill='%231a1a1a'/%3E%3C/g%3E%3Ctext x='520' y='146.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3E1 wei%C3%9Fes Rundumlicht %C2%B7 Tag: 1 Ball%3C/text%3E%3Ctext x='30' y='208.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3EMan%C3%B6vrierunf%C3%A4hig (NUC)%3C/text%3E%3Crect x='315' y='176' width='50' height='54' rx='6' fill='%230b1a2e'/%3E%3Ccircle cx='340' cy='194.5' r='7.5' fill='%23d62828'/%3E%3Ccircle cx='340' cy='211.5' r='7.5' fill='%23d62828'/%3E%3Cg transform='translate(450,193.5) scale(0.7) translate(-450,-193.5)'%3E%3Ccircle cx='450' cy='193.5' r='11' fill='%231a1a1a'/%3E%3C/g%3E%3Cg transform='translate(450,212.5) scale(0.7) translate(-450,-212.5)'%3E%3Ccircle cx='450' cy='212.5' r='11' fill='%231a1a1a'/%3E%3C/g%3E%3Ctext x='520' y='208.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3ERot-Rot = %E2%80%9ENot, nicht steuerbar%E2%80%9C%3C/text%3E%3Crect x='15' y='234' width='870' height='62' fill='%23eef3fa'/%3E%3Ctext x='30' y='270.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3EMan%C3%B6vrierbehindert (RAM)%3C/text%3E%3Crect x='315' y='238' width='50' height='54' rx='6' fill='%230b1a2e'/%3E%3Ccircle cx='340' cy='248.0' r='7.5' fill='%23d62828'/%3E%3Ccircle cx='340' cy='265.0' r='7.5' fill='%23ffffff'/%3E%3Ccircle cx='340' cy='282.0' r='7.5' fill='%23d62828'/%3E%3Cg transform='translate(450,246.0) scale(0.7) translate(-450,-246.0)'%3E%3Ccircle cx='450' cy='246.0' r='11' fill='%231a1a1a'/%3E%3C/g%3E%3Cg transform='translate(450,265.0) scale(0.7) translate(-450,-265.0)'%3E%3Cpolygon points='450,251.0 461,265.0 450,279.0 439,265.0' fill='%231a1a1a'/%3E%3C/g%3E%3Cg transform='translate(450,284.0) scale(0.7) translate(-450,-284.0)'%3E%3Ccircle cx='450' cy='284.0' r='11' fill='%231a1a1a'/%3E%3C/g%3E%3Ctext x='520' y='270.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3ERot-Wei%C3%9F-Rot %C2%B7 Tag: Ball-Rhombus-Ball%3C/text%3E%3Ctext x='30' y='332.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3ETiefgangbehindert (CBD)%3C/text%3E%3Crect x='315' y='300' width='50' height='54' rx='6' fill='%230b1a2e'/%3E%3Ccircle cx='340' cy='310.0' r='7.5' fill='%23d62828'/%3E%3Ccircle cx='340' cy='327.0' r='7.5' fill='%23d62828'/%3E%3Ccircle cx='340' cy='344.0' r='7.5' fill='%23d62828'/%3E%3Cg transform='translate(450,327.0) scale(0.7) translate(-450,-327.0)'%3E%3Crect x='441' y='313.0' width='18' height='28' fill='%231a1a1a'/%3E%3C/g%3E%3Ctext x='520' y='332.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3E3%C3%97 Rot %C2%B7 Tag: Zylinder%3C/text%3E%3Crect x='15' y='358' width='870' height='62' fill='%23eef3fa'/%3E%3Ctext x='30' y='394.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3EAuf Grund gelaufen%3C/text%3E%3Crect x='315' y='362' width='50' height='54' rx='6' fill='%230b1a2e'/%3E%3Ccircle cx='340' cy='380.5' r='7.5' fill='%23d62828'/%3E%3Ccircle cx='340' cy='397.5' r='7.5' fill='%23d62828'/%3E%3Cg transform='translate(450,370.0) scale(0.7) translate(-450,-370.0)'%3E%3Ccircle cx='450' cy='370.0' r='11' fill='%231a1a1a'/%3E%3C/g%3E%3Cg transform='translate(450,389.0) scale(0.7) translate(-450,-389.0)'%3E%3Ccircle cx='450' cy='389.0' r='11' fill='%231a1a1a'/%3E%3C/g%3E%3Cg transform='translate(450,408.0) scale(0.7) translate(-450,-408.0)'%3E%3Ccircle cx='450' cy='408.0' r='11' fill='%231a1a1a'/%3E%3C/g%3E%3Ctext x='520' y='394.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3ERot-Rot %2B zus%C3%A4tzlich Ankerlicht(er) %C2%B7 Tag: 3 B%C3%A4lle%3C/text%3E%3Ctext x='30' y='456.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3EFischer (Trawler, schleppt Netz)%3C/text%3E%3Crect x='315' y='424' width='50' height='54' rx='6' fill='%230b1a2e'/%3E%3Ccircle cx='340' cy='442.5' r='7.5' fill='%231b9e3e'/%3E%3Ccircle cx='340' cy='459.5' r='7.5' fill='%23ffffff'/%3E%3Cg transform='translate(450,441.5) scale(0.7) translate(-450,-441.5)'%3E%3Cpolygon points='450,453.5 462,431.5 438,431.5' fill='%231a1a1a'/%3E%3C/g%3E%3Cg transform='translate(450,460.5) scale(0.7) translate(-450,-460.5)'%3E%3Cpolygon points='450,448.5 462,470.5 438,470.5' fill='%231a1a1a'/%3E%3C/g%3E%3Ctext x='520' y='456.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EGr%C3%BCn %C3%BCber Wei%C3%9F %C2%B7 Tag: 2 Kegel Spitze an Spitze%3C/text%3E%3Crect x='15' y='482' width='870' height='62' fill='%23eef3fa'/%3E%3Ctext x='30' y='518.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3EFischer (andere, z. B. Leinen)%3C/text%3E%3Crect x='315' y='486' width='50' height='54' rx='6' fill='%230b1a2e'/%3E%3Ccircle cx='340' cy='504.5' r='7.5' fill='%23d62828'/%3E%3Ccircle cx='340' cy='521.5' r='7.5' fill='%23ffffff'/%3E%3Cg transform='translate(450,503.5) scale(0.7) translate(-450,-503.5)'%3E%3Cpolygon points='450,515.5 462,493.5 438,493.5' fill='%231a1a1a'/%3E%3C/g%3E%3Cg transform='translate(450,522.5) scale(0.7) translate(-450,-522.5)'%3E%3Cpolygon points='450,510.5 462,532.5 438,532.5' fill='%231a1a1a'/%3E%3C/g%3E%3Ctext x='520' y='518.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3ERot %C3%BCber Wei%C3%9F%3C/text%3E%3Ctext x='30' y='580.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3ELotsenfahrzeug%3C/text%3E%3Crect x='315' y='548' width='50' height='54' rx='6' fill='%230b1a2e'/%3E%3Ccircle cx='340' cy='566.5' r='7.5' fill='%23ffffff'/%3E%3Ccircle cx='340' cy='583.5' r='7.5' fill='%23d62828'/%3E%3Ctext x='520' y='580.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EWei%C3%9F %C3%BCber Rot = %E2%80%9ELotse im Boot%E2%80%9C %C2%B7 Tag: Flagge H%3C/text%3E%3Crect x='15' y='606' width='870' height='62' fill='%23eef3fa'/%3E%3Ctext x='30' y='642.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3ESegler (optional am Mast)%3C/text%3E%3Crect x='315' y='610' width='50' height='54' rx='6' fill='%230b1a2e'/%3E%3Ccircle cx='340' cy='628.5' r='7.5' fill='%23d62828'/%3E%3Ccircle cx='340' cy='645.5' r='7.5' fill='%231b9e3e'/%3E%3Ctext x='520' y='642.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3ERot %C3%BCber Gr%C3%BCn %C2%B7 unter Motor = Maschinenfahrzeug%3C/text%3E%3Ctext x='30' y='704.0' font-size='15' fill='%231a1a1a' text-anchor='start' font-weight='bold'%3ESegler unter Motor (Tag)%3C/text%3E%3Cg transform='translate(450,699.0) scale(0.7) translate(-450,-699.0)'%3E%3Cpolygon points='450,711.0 462,689.0 438,689.0' fill='%231a1a1a'/%3E%3C/g%3E%3Ctext x='520' y='704.0' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3ETag: 1 Kegel Spitze nach unten%3C/text%3E%3C/svg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<p><strong>Eselsbrücken:<\/strong>\n- <strong>Rot-Rot<\/strong> = „Ich kann nicht“ (manövrierunfähig, z. B. Ruder kaputt)\n- <strong>Rot-Weiß-Rot<\/strong> = „Ich arbeite“ (Bagger, Kabelleger, Taucher-Arbeiten)\n- <strong>Grün über Weiß<\/strong> = Trawler, <strong>Rot über Weiß<\/strong> = anderer Fischer → <em>„Rot über Weiß – Fischer auf der Reis'“<\/em>\n- <strong>Weiß über Rot<\/strong> = Lotse\n- <strong>3 × Rot<\/strong> = großer Tanker, tiefgangbehindert\n- <strong>Ankerlieger:<\/strong> 1 weißes Rundumlicht vorne, am Tag <strong>1 schwarzer Ball<\/strong><\/p>\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage<\/div><p>Nachts siehst du <strong>zwei rote Rundumlichter übereinander<\/strong> und darunter ein grünes Seitenlicht.\n→ Manövrierunfähiges Fahrzeug, das noch Fahrt macht. Du siehst seine Steuerbordseite. <strong>Du weichst aus<\/strong>, denn es steht über allen anderen.<\/p><\/div>"}, {"n": "02", "t": "Ausweichregeln", "h": "<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 900' width='1000' height='900' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='1000' height='900' fill='%23ffffff'/%3E%3Ctext x='500.0' y='38' font-size='24' fill='%230b2545' text-anchor='middle' font-weight='bold'%3EAusweichregeln (KVR/COLREG) %E2%80%93 die 4 Grundsituationen%3C/text%3E%3Ctext x='500.0' y='62' font-size='14' fill='%23444' text-anchor='middle' font-weight='normal'%3EOrange = muss ausweichen  %C2%B7  Blau = Kurshalter (Kurs %2B Geschwindigkeit beibehalten)%3C/text%3E%3Crect x='20' y='80' width='470' height='380' rx='14' fill='%23f4f7fb' stroke='%23c9d5e6'/%3E%3Ctext x='255.0' y='110' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3E1 %C2%B7 Entgegenkommend (Regel 14)%3C/text%3E%3Cg transform='translate(255,385) rotate(0)'%3E%3Cpath d='M0,-36.0 C16.2,-18.0  id='ce07a00' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'%3E%3Cpath d='M0,0 L10,5 L0,10 z' fill='%23e07a00'/%3E%3C/marker%3E%3C/defs%3E%3Cpath d='M660,340 C665,300 720,290 830,290' fill='none' stroke='%23e07a00' stroke-width='3' stroke-dasharray='8 6' marker-end='url(%23ce07a00)'/%3E%3Ctext x='745' y='128' font-size='14' fill='%231a1a1a' text-anchor='middle' font-weight='normal'%3EWer den anderen an SEINER Steuerbordseite (rechts)%3C/text%3E%3Ctext x='745' y='146' font-size='14' fill='%231a1a1a' text-anchor='middle' font-weight='normal'%3Esieht, weicht aus %E2%80%93 und f%C3%A4hrt HINTER ihm vorbei.%3C/text%3E%3Ctext x='745' y='440' font-size='15' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3E%E2%80%9ERechts vor links%E2%80%9C wie im Stra%C3%9Fenverkehr%3C/text%3E%3Crect x='20' y='480' width='470' height='400' rx='14' fill='%23f4f7fb' stroke='%23c9d5e6'/%3E%3Ctext x='255.0' y='510' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3E3 %C2%B7 %C3%9Cberholen (Regel 13)%3C/text%3E%3Cpath d='M255,610 L393.6,667.4 A150,150 0 0 1 116.4,667.4 Z' fill='%23e07a00' fill-opacity='0.18' stroke='%23e07a00' stroke-width='2'/%3E%3Cg transform='translate(255,610) rotate(0)'%3E%3Cpath d='M0,-36.0 C16.2,-18.0 14.4,18.0 12.6,34.2 L-12.6,34.2 C-14.4,18.0 -16.2,-18.0 0,-36.0 Z' fill='%231f5fbf'/%3E%3C/g%3E%3Cg transform='translate(295,780) rotate(0)'%3E%3Cpath d='M0,-36.0 C16.2,-18.0 14.4,18.0 12.6,34.2 L-12.6,34.2 C-14.4,18.0 -16.2,-18.0 0,-36.0 Z' fill='%23e07a00'/%3E%3C/g%3E%3Cdefs%3E%3Cmarker id='ce07a00' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'%3E%3Cpath d='M0,0 L10,5 L0,10 z' fill='%23e07a00'/%3E%3C/marker%3E%3C/defs%3E%3Cpath d='M295,735 C325,670 330,610 325,550' fill='none' stroke='%23e07a00' stroke-width='3' stroke-dasharray='8 6' marker-end='url(%23ce07a00)'/%3E%3Ctext x='255' y='830' font-size='14' fill='%231a1a1a' text-anchor='middle' font-weight='normal'%3EDer %C3%9CBERHOLER weicht IMMER aus %E2%80%93 egal ob Segler,%3C/text%3E%3Ctext x='255' y='850' font-size='14' fill='%231a1a1a' text-anchor='middle' font-weight='normal'%3EMotorboot oder Fischer. %C3%9Cberholer = kommt aus dem%3C/text%3E%3Ctext x='255' y='870' font-size='14' fill='%231a1a1a' text-anchor='middle' font-weight='normal'%3EHecklicht-Sektor (mehr als 22,5%C2%B0 achterlicher als querab).%3C/text%3E%3Crect x='510' y='480' width='470' height='400' rx='14' fill='%23f4f7fb' stroke='%23c9d5e6'/%3E%3Ctext x='745.0' y='510' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3E4 %C2%B7 Zwei Segelboote (Regel 12)%3C/text%3E%3Ctext x='745' y='530' font-size='15' text-anchor='middle'%3EWind %E2%86%93 von oben%3C/text%3E%3Cdefs%3E%3Cmarker id='m555' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'%3E%3Cpath d='M0,0 L10,5 L0,10 z' fill='%23555'/%3E%3C/marker%3E%3C/defs%3E%3Cline x1='745' y1='538' x2='745' y2='570' stroke='%23555' stroke-width='3' marker-end='url(%23m555)'/%3E%3Cg transform='translate(640,690) rotate(45)'%3E%3Cpath d='M0,-32.0 C14.4,-16.0 12.8,16.0 11.200000000000001,30.400000000000002 L-11.200000000000001,30.400000000000002 C-12.8,16.0 -14.4,-16.0 0,-32.0 Z' fill='%23e07a00'/%3E%3C/g%3E%3Cg transform='translate(850,690) rotate(-45)'%3E%3Cpath d='M0,-32.0 C14.4,-16.0 12.8,16.0 11.200000000000001,30.400000000000002 L-11.200000000000001,30.400000000000002 C-12.8,16.0 -14.4,-16.0 0,-32.0 Z' fill='%231f5fbf'/%3E%3C/g%3E%3Ctext x='640' y='760' font-size='13' fill='%231a1a1a' text-anchor='middle' font-weight='normal'%3EWind von Backbord%3C/text%3E%3Ctext x='640' y='778' font-size='13' fill='%23e07a00' text-anchor='middle' font-weight='bold'%3E= Backbordbug %E2%86%92 weicht%3C/text%3E%3Ctext x='850' y='760' font-size='13' fill='%231a1a1a' text-anchor='middle' font-weight='normal'%3EWind von Steuerbord%3C/text%3E%3Ctext x='850' y='778' font-size='13' fill='%231f5fbf' text-anchor='middle' font-weight='bold'%3E= Steuerbordbug%3C/text%3E%3Ctext x='745' y='820' font-size='14' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EVerschiedene Bugs: Backbordbug weicht Steuerbordbug%3C/text%3E%3Ctext x='745' y='842' font-size='14' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EGleicher Bug: Luv (windzugewandt) weicht Lee%3C/text%3E%3Ctext x='745' y='864' font-size='12' fill='%23555' text-anchor='middle' font-weight='normal'%3EBug = Seite, von der der Wind kommt (Gro%C3%9Fbaum steht gegen%C3%BCber)%3C/text%3E%3C/svg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<h2>Die 4 Grundsituationen<\/h2>\n<ol>\n<li><strong>Entgegenkommend (Regel 14):<\/strong> Zwei Maschinenfahrzeuge fahren genau aufeinander zu → <strong>beide drehen nach Steuerbord<\/strong> (rechts) und passieren sich Backbord an Backbord.<\/li>\n<li><strong>Kreuzend (Regel 15):<\/strong> Wer den anderen <strong>an seiner Steuerbordseite<\/strong> (rechts) hat, weicht aus und fährt <strong>hinter ihm<\/strong> durch, nicht vor seinem Bug. Wie „rechts vor links“ im Straßenverkehr.<\/li>\n<li><strong>Überholen (Regel 13):<\/strong> Der <strong>Überholer weicht immer aus<\/strong>, egal wer er ist. Überholer ist, wer aus dem Hecklichtsektor kommt (mehr als 22,5° achterlicher als querab).<\/li>\n<li><strong>Zwei Segler (Regel 12):<\/strong><\/li>\n<li>Verschiedene Bugs: <strong>Backbordbug weicht Steuerbordbug<\/strong><\/li>\n<li>Gleicher Bug: <strong>Luv weicht Lee<\/strong> (wer näher am Wind ist, weicht)<\/li>\n<li>Bug = die Seite, von der der Wind kommt. Der Großbaum steht auf der anderen Seite.<\/li>\n<\/ol>\n<h2>Wer weicht wem?<\/h2>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 560' width='760' height='560' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='760' height='560' fill='%23ffffff'/%3E%3Ctext x='380.0' y='40' font-size='22' fill='%230b2545' text-anchor='middle' font-weight='bold'%3EWer weicht wem%3F (Regel 18) %E2%80%93 von oben nach unten%3C/text%3E%3Crect x='200.0' y='70' width='360' height='58' rx='8' fill='%237f1d1d'/%3E%3Ctext x='380.0' y='96' font-size='17' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EMan%C3%B6vrierunf%C3%A4hig (NUC)%3C/text%3E%3Ctext x='380.0' y='116' font-size='13' fill='%23ffe9c7' text-anchor='middle' font-weight='normal'%3ERot-Rot%3C/text%3E%3Crect x='170.0' y='140' width='420' height='58' rx='8' fill='%23a12c2c'/%3E%3Ctext x='380.0' y='166' font-size='17' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EMan%C3%B6vrierbehindert (RAM)%3C/text%3E%3Ctext x='380.0' y='186' font-size='13' fill='%23ffe9c7' text-anchor='middle' font-weight='normal'%3ERot-Wei%C3%9F-Rot%3C/text%3E%3Crect x='140.0' y='210' width='480' height='58' rx='8' fill='%23c0392b'/%3E%3Ctext x='380.0' y='236' font-size='17' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3ETiefgangbehindert (CBD)%3C/text%3E%3Ctext x='380.0' y='256' font-size='13' fill='%23ffe9c7' text-anchor='middle' font-weight='normal'%3E3%C3%97 Rot%3C/text%3E%3Crect x='110.0' y='280' width='540' height='58' rx='8' fill='%23d35400'/%3E%3Ctext x='380.0' y='306' font-size='17' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EFischendes Fahrzeug%3C/text%3E%3Ctext x='380.0' y='326' font-size='13' fill='%23ffe9c7' text-anchor='middle' font-weight='normal'%3EGr%C3%BCn/Wei%C3%9F bzw. Rot/Wei%C3%9F%3C/text%3E%3Crect x='80.0' y='350' width='600' height='58' rx='8' fill='%232471a3'/%3E%3Ctext x='380.0' y='376' font-size='17' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3ESegelfahrzeug (nur unter Segel%21)%3C/text%3E%3Ctext x='380.0' y='396' font-size='13' fill='%23ffe9c7' text-anchor='middle' font-weight='normal'%3ERot/Gr%C3%BCn %2B Heck%3C/text%3E%3Crect x='50.0' y='420' width='660' height='58' rx='8' fill='%231f4e79'/%3E%3Ctext x='380.0' y='446' font-size='17' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EMaschinenfahrzeug%3C/text%3E%3Ctext x='380.0' y='466' font-size='13' fill='%23ffe9c7' text-anchor='middle' font-weight='normal'%3ETopplicht %2B Seiten %2B Heck%3C/text%3E%3Ctext x='380.0' y='510' font-size='14' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EJeder weicht allen %C3%9CBER ihm aus. Merksatz: %E2%80%9ENot, Arbeit, Tiefgang, Fischer, Segel, Motor%E2%80%9C%3C/text%3E%3Ctext x='380.0' y='532' font-size='13' fill='%23555' text-anchor='middle' font-weight='normal'%3EAusnahmen: Der %C3%9Cberholer weicht immer %C2%B7 Im engen Fahrwasser behindern Boote %26lt; 20 m die Gro%C3%9Fen nicht%3C/text%3E%3C/svg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<p>Merksatz von oben nach unten: <strong>„Not – Arbeit – Tiefgang – Fischer – Segel – Motor“<\/strong>\n- Motorboot weicht: Segler, Fischer, Tiefgangbehinderten, Manövrierbehinderten, Manövrierunfähigen\n- Segler weicht: Fischer, Tiefgangbehinderten, Manövrierbehinderten, Manövrierunfähigen\n- <strong>Achtung:<\/strong> Ein Fischer muss <strong>wirklich fischen<\/strong> (Netz oder Leinen draußen). Ein Sportangler mit Rute gilt nicht als „Fischer“.\n- Ein <strong>Segler mit laufendem Motor<\/strong> ist ein Maschinenfahrzeug.<\/p>\n<h2>Die Regeln drumherum (werden gern gefragt)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Regel<\/th>\n<th>Inhalt in 1 Satz<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5 Ausguck<\/td>\n<td>Immer Ausguck halten, mit Augen <strong>und<\/strong> Ohren<\/td>\n<\/tr>\n<tr>\n<td>6 Sichere Geschwindigkeit<\/td>\n<td>So schnell, dass du rechtzeitig stoppen bzw. ausweichen kannst (Sicht, Verkehr, Wind)<\/td>\n<\/tr>\n<tr>\n<td><strong>7 Kollisionsgefahr<\/strong><\/td>\n<td><strong>Peilung bleibt gleich und der Abstand nimmt ab → Kollisionskurs!<\/strong><\/td>\n<\/tr>\n<tr>\n<td>8 Manöver<\/td>\n<td><strong>Früh, deutlich, groß<\/strong> ausweichen (z. B. 30° oder mehr), damit es der andere sieht. Notfalls Fahrt raus<\/td>\n<\/tr>\n<tr>\n<td>9 Enges Fahrwasser<\/td>\n<td><strong>Rechts halten.<\/strong> Boote unter 20 m und Segler dürfen die Großen nicht behindern<\/td>\n<\/tr>\n<tr>\n<td>17 Kurshalter<\/td>\n<td>Kurs <strong>und<\/strong> Geschwindigkeit beibehalten. Wenn der andere nicht reagiert: selbst ausweichen (nicht nach Backbord!)<\/td>\n<\/tr>\n<tr>\n<td>19 Verminderte Sicht<\/td>\n<td>Langsam fahren, Schallsignale geben, Radar/Ausguck. Bei Nebel gibt es <strong>kein<\/strong> Kurshalter-Recht<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"co co-tip\"><div class=\"co-t\">Peilungstrick (Regel 7)<\/div><p>Peile ein anderes Schiff über eine feste Stelle an deinem Boot an, zum Beispiel eine Relingstütze. <strong>Wandert es nicht aus<\/strong> und wird größer, seid ihr auf Kollisionskurs. Dann handeln!<\/p><\/div>\n\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage<\/div><p>Du fährst mit dem Motorboot. Von <strong>Backbord<\/strong> (links) kommt ein Segler mit Kurs, der deinen kreuzt. Wer weicht?\n→ <strong>Du.<\/strong> Maschine weicht Segel, egal von welcher Seite er kommt.<\/p><\/div>"}, {"n": "03", "t": "Seezeichen", "h": "<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 1060' width='1100' height='1060' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='1100' height='1060' fill='%23ffffff'/%3E%3Ctext x='550.0' y='40' font-size='24' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ESeezeichen IALA Region A (gilt in Kroatien / ganz Europa)%3C/text%3E%3Crect x='20' y='60' width='520' height='330' rx='14' fill='%23f4f7fb' stroke='%23c9d5e6'/%3E%3Ctext x='280' y='90' font-size='18' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ELateralzeichen (Fahrwasser-Begrenzung)%3C/text%3E%3Crect x='137.0' y='190.0' width='26' height='110.5' fill='%23d62828' stroke='%231a1a1a' stroke-width='0.8'/%3E%3Cpath d='M110,306 q10,-8 20,0 t20,0 t20,0 t20,0' stroke='%231f5fbf' fill='none' stroke-width='2'/%3E ng>Nord<\/strong><\/td>\n<td>▲▲ beide Spitzen oben<\/td>\n<td>schwarz über gelb<\/td>\n<td>ununterbrochen funkelnd<\/td>\n<td>„zeigt nach oben = Norden“<\/td>\n<\/tr>\n<tr>\n<td><strong>Ost<\/strong><\/td>\n<td>◆ Spitzen auseinander<\/td>\n<td>schwarz-gelb-schwarz<\/td>\n<td><strong>3<\/strong> Blitze<\/td>\n<td>„wie ein <strong>E<\/strong>i“ (East)<\/td>\n<\/tr>\n<tr>\n<td><strong>Süd<\/strong><\/td>\n<td>▼▼ beide Spitzen unten<\/td>\n<td>gelb über schwarz<\/td>\n<td><strong>6<\/strong> Blitze + 1 lang<\/td>\n<td>„zeigt nach unten = Süden“<\/td>\n<\/tr>\n<tr>\n<td><strong>West<\/strong><\/td>\n<td>⧗ Spitzen zusammen<\/td>\n<td>gelb-schwarz-gelb<\/td>\n<td><strong>9<\/strong> Blitze<\/td>\n<td>„Wespentaille = <strong>W<\/strong>est“<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Uhr-Trick:<\/strong> 3 Uhr = Ost, 6 Uhr = Süd, 9 Uhr = West, 12 Uhr = Nord (ununterbrochen).\n<strong>Farbtrick:<\/strong> Schwarz liegt dort, wohin die Kegelspitzen zeigen (N: oben schwarz, S: unten schwarz, O: oben und unten, W: Mitte).<\/p>\n<h2>Weitere Zeichen<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Zeichen<\/th>\n<th>Aussehen<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Einzelgefahr<\/td>\n<td>schwarz-rot-schwarz, 2 schwarze Bälle, weiß Fl(2)<\/td>\n<td>Gefahr <strong>direkt unter<\/strong> dem Zeichen, z. B. ein Felsen. Rundum befahrbar, aber Abstand halten<\/td>\n<\/tr>\n<tr>\n<td>Ansteuerung / sicheres Wasser<\/td>\n<td>rot-weiß senkrecht gestreift, 1 roter Ball<\/td>\n<td>Rundum sicheres Wasser, z. B. Fahrwassermitte oder Hafenansteuerung<\/td>\n<\/tr>\n<tr>\n<td>Sonderzeichen<\/td>\n<td>gelb, gelbes X<\/td>\n<td>Sperrgebiet, Badezone, Kabel, Messboje<\/td>\n<\/tr>\n<tr>\n<td>Neue Gefahr / Wrack<\/td>\n<td>blau-gelb senkrecht, gelbes Kreuz<\/td>\n<td>frisch gesunkenes Wrack, noch nicht in der Karte<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Feuerkennungen – so liest du sie in der Karte<\/h2>\n<p><code>Fl(3) G 10s 8m 5M<\/code> heißt:\n- <strong>Fl(3)<\/strong> = Gruppe aus 3 Blitzen\n- <strong>G<\/strong> = grün (R = rot, W oder ohne Angabe = weiß, Y = gelb)\n- <strong>10s<\/strong> = Wiederkehr alle 10 Sekunden\n- <strong>8m<\/strong> = Feuerhöhe 8 m über dem Wasser\n- <strong>5M<\/strong> = <strong>Tragweite 5 Seemeilen<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Kürzel<\/th>\n<th>Name<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>F<\/td>\n<td>Festfeuer<\/td>\n<td>brennt dauernd<\/td>\n<\/tr>\n<tr>\n<td>Fl<\/td>\n<td>Blitz<\/td>\n<td>hell <strong>kürzer<\/strong> als dunkel<\/td>\n<\/tr>\n<tr>\n<td>LFl<\/td>\n<td>langer Blitz<\/td>\n<td>Blitz mindestens 2 s<\/td>\n<\/tr>\n<tr>\n<td>Oc<\/td>\n<td>unterbrochen<\/td>\n<td>hell <strong>länger<\/strong> als dunkel<\/td>\n<\/tr>\n<tr>\n<td>Iso<\/td>\n<td>Gleichtakt<\/td>\n<td>hell = dunkel<\/td>\n<\/tr>\n<tr>\n<td>Q / VQ<\/td>\n<td>Funkel / schnelles Funkel<\/td>\n<td>50–60 bzw. 100–120 pro Minute<\/td>\n<\/tr>\n<tr>\n<td>Mo(A)<\/td>\n<td>Morse A<\/td>\n<td>· –<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage (AC Nautik)<\/div><p>Ein Leuchtfeuer hat eine Tragweite von 3 sm. Siehst du es aus 5 sm Entfernung?\n→ <strong>Nein.<\/strong> Die Tragweite ist die Grenze, ab der das Feuer sichtbar ist.<\/p><\/div>"}, {"n": "04", "t": "Schall- und Notsignale", "h": "<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 580' width='940' height='580' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='940' height='580' fill='%23ffffff'/%3E%3Ctext x='470.0' y='40' font-size='22' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ESchallsignale %E2%80%93 kurz = ca. 1 s %C2%B7 lang = 4%E2%80%936 s%3C/text%3E%3Ctext x='30' y='106' font-size='15' fill='%230b2545' text-anchor='start' font-weight='bold'%3EMAN%C3%96VERSIGNALE (Sichtweite)%3C/text%3E%3Crect x='20' y='124' width='900' height='36' fill='%23eef3fa'/%3E%3Ctext x='30' y='148' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EIch %C3%A4ndere Kurs nach Steuerbord%3C/text%3E%3Crect x='560' y='136' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Ctext x='910' y='148' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3E1 kurz%3C/text%3E%3Ctext x='30' y='188' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EIch %C3%A4ndere Kurs nach Backbord%3C/text%3E%3Crect x='560' y='176' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='582' y='176' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Ctext x='910' y='188' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3E2 kurz%3C/text%3E%3Crect x='20' y='204' width='900' height='36' fill='%23eef3fa'/%3E%3Ctext x='30' y='228' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EMeine Maschine geht r%C3%BCckw%C3%A4rts%3C/text%3E%3Crect x='560' y='216' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='582' y='216' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='604' y='216' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Ctext x='910' y='228' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3E3 kurz%3C/text%3E%3Ctext x='30' y='268' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EZweifel / Warnung: %E2%80%9EWas machst du%3F%21%E2%80%9C%3C/text%3E%3Crect x='560' y='256' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='582' y='256' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='604' y='256' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='626' y='256' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='648' y='256' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Ctext x='910' y='268' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3Emind. 5 kurz%3C/text%3E%3Crect x='20' y='284' width='900' height='36' fill='%23eef3fa'/%3E%3Ctext x='30' y='308' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EAnn%C3%A4herung an un%C3%BCbersichtliche Biegung im Fahrwasser%3C/text%3E%3Crect x='560' y='296' width='56' height='14' rx='3' fill='%230b2545'/%3E%3Ctext x='910' y='308' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3E1 lang%3C/text%3E%3Ctext x='30' y='346' font-size='15' fill='%230b2545' text-anchor='start' font-weight='bold'%3ENEBELSIGNALE (alle 2 Minuten)%3C/text%3E%3Crect x='20' y='364' width='900' height='36' fill='%23eef3fa'/%3E%3Ctext x='30' y='388' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EMaschinenfahrzeug mit Fahrt durchs Wasser%3C/text%3E%3Crect x='560' y='376' width='56' height='14' rx='3' fill='%230b2545'/%3E%3Ctext x='910' y='388' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3E1 lang%3C/text%3E%3Ctext x='30' y='428' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EMaschinenfahrzeug gestoppt, ohne Fahrt%3C/text%3E%3Crect x='560' y='416' width='56' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='642' y='416' width='56' height='14' rx='3' fill='%230b2545'/%3E%3Ctext x='910' y='428' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3E2 lang%3C/text%3E%3Crect x='20' y='444' width='900' height='36' fill='%23eef3fa'/%3E%3Ctext x='30' y='468' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3ESegler, Fischer, NUC, RAM, CBD, Schlepper%3C/text%3E%3Crect x='560' y='456' width='56' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='624' y='456' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Crect x='646' y='456' width='14' height='14' rx='3' fill='%230b2545'/%3E%3Ctext x='910' y='468' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3Elang-kurz-kurz%3C/text%3E%3Ctext x='30' y='508' font-size='14' fill='%231a1a1a' text-anchor='start' font-weight='normal'%3EVor Anker (jede Minute)%3C/text%3E%3Ctext x='910' y='508' font-size='13' fill='%23444' text-anchor='end' font-weight='bold'%3E5 s Glocke l%C3%A4uten%3C/text%3E%3Ctext x='30' y='546' font-size='13' fill='%23d62828' text-anchor='start' font-weight='bold'%3EBoote %26lt; 12 m: m%C3%BCssen nicht die obigen Signale geben %E2%80%93 aber irgendein Schallsignal alle 2 Min.%3C/text%3E%3C/svg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<h2>Manöversignale – Merkhilfe<\/h2>\n<ul>\n<li><strong>1 kurz<\/strong> = Steuerbord. Das Wort hat <strong>1<\/strong> „S“ am Anfang<\/li>\n<li><strong>2 kurz<\/strong> = Backbord<\/li>\n<li><strong>3 kurz<\/strong> = Maschine rückwärts<\/li>\n<li><strong>5 kurz<\/strong> (oder mehr) = „Ich verstehe deine Absicht nicht / Achtung!“<\/li>\n<\/ul>\n<h2>Nebel (alle 2 Minuten)<\/h2>\n<ul>\n<li>Motorboot <strong>mit Fahrt<\/strong>: 1 lang<\/li>\n<li>Motorboot <strong>gestoppt<\/strong> (treibt): 2 lang<\/li>\n<li>Alles, was „mehr Rechte“ hat (Segler, Fischer, NUC, RAM, CBD, Schlepper): <strong>lang-kurz-kurz<\/strong> (– · ·)<\/li>\n<li>Ankerlieger: jede Minute 5 s die Glocke läuten<\/li>\n<li>Boote <strong>unter 12 m<\/strong> müssen diese Signale nicht geben, aber <strong>irgendein<\/strong> kräftiges Schallsignal alle 2 Minuten<\/li>\n<\/ul>\n<h2>Seenotsignale<\/h2>\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 560' width='940' height='560' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='940' height='560' fill='%23ffffff'/%3E%3Ctext x='470.0' y='40' font-size='22' fill='%23d62828' text-anchor='middle' font-weight='bold'%3ESeenotsignale %E2%80%93 das bedeutet: %E2%80%9EIch bin in Not, brauche Hilfe%21%E2%80%9C%3C/text%3E%3Crect x='30' y='70' width='280' height='130' rx='12' fill='%23fff1f1' stroke='%23f2b8b8'/%3E%3Ctext x='170' y='118' font-size='30' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3E%F0%9F%9A%80%3C/text%3E%3Ctext x='170' y='158' font-size='16' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3ERote Fallschirm-Rakete%3C/text%3E%3Ctext x='170' y='180' font-size='13' fill='%23444' text-anchor='middle' font-weight='normal'%3Eoder rote Handfackel%3C/text%3E%3Crect x='330' y='70' width='280' height='130' rx='12' fill='%23fff1f1' stroke='%23f2b8b8'/%3E%3Ctext x='470' y='118' font-size='30' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3E%F0%9F%9F%A7%3C/text%3E%3Ctext x='470' y='158' font-size='16' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EOranger Rauch%3C/text%3E%3Ctext x='470' y='180' font-size='13' fill='%23444' text-anchor='middle' font-weight='normal'%3ERauchsignal (Tag)%3C/text%3E%3Crect x='630' y='70' width='280' height='130' rx='12' fill='%23fff1f1' stroke='%23f2b8b8'/%3E%3Ctext x='770' y='118' font-size='30' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3E%F0%9F%93%BB%3C/text%3E%3Ctext x='770' y='158' font-size='16' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EMAYDAY %C3%BCber Funk%3C/text%3E%3Ctext x='770' y='180' font-size='13' fill='%23444' text-anchor='middle' font-weight='normal'%3EUKW Kanal 16 / DSC-Notalarm%3C/text%3E%3Crect x='30' y='220' width='280' height='130' rx='12' fill='%23fff1f1' stroke='%23f2b8b8'/%3E%3Ctext x='170' y='268' font-size='22' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3E%C2%B7 %C2%B7 %C2%B7 %E2%80%93 %E2%80%93 %E2%80%93 %C2%B7 %C2%B7 %C2%B7%3C/text%3E%3Ctext x='170' y='308' font-size='16' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3ESOS%3C/text%3E%3Ctext x='170' y='330' font-size='13' fill='%23444' text-anchor='middle' font-weight='normal'%3Eper Licht oder Schall%3C/text%3E%3Crect x='330' y='220' width='280' height='130' rx='12' fill='%23fff1f1' stroke='%23f2b8b8'/%3E%3Ctext x='470' y='268' font-size='30' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3E%E2%86%91 %E2%86%93%3C/text%3E%3Ctext x='470' y='308' font-size='16' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EArme seitlich ausgestreckt%3C/text%3E%3Ctext x='470' y='330' font-size='13' fill='%23444' text-anchor='middle' font-weight='normal'%3Elangsam heben und senken%3C/text%3E%3Crect x='630' y='220' width='280' height='130' rx='12' fill='%23fff1f1' stroke='%23f2b8b8'/%3E%3Ctext x='770' y='268' font-size='30' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3E%F0%9F%93%A2%3C/text%3E%3Ctext x='770' y='308' font-size='16' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EDauerton Nebelhorn%3C/text%3E%3Ctext x='770' y='330' font-size='13' fill='%23444' text-anchor='middle' font-weight='normal'%3Eununterbrochenes Signal%3C/text%3E%3Crect x='30' y='370' width='280' height='130' rx='12' fill='%23fff1f1' stroke='%23f2b8b8'/%3E%3Ctext x='170' y='418' font-size='22' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EN / C%3C/text%3E%3Ctext x='170' y='458' font-size='16' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EFlaggen N %C3%BCber C%3C/text%3E%3Ctext x='170' y='480' font-size='13' fill='%23444' text-anchor='middle' font-weight='normal'%3EFlaggensignal%3C/text%3E%3Crect x='330' y='370' width='280' height='130' rx='12' fill='%23fff1f1' stroke='%23f2b8b8'/%3E%3Ctext x='470' y='418' font-size='30' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3E%F0%9F%94%A5%3C/text%3E%3Ctext x='470' y='458' font-size='16' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EFlammen an Bord%3C/text%3E%3Ctext x='470' y='480' font-size='13' fill='%23444' text-anchor='middle' font-weight='normal'%3Ez. B. brennendes %C3%96l-Fass%3C/text%3E%3Crect x='630' y='370' width='280' height='130' rx='12' fill='%23fff1f1' stroke='%23f2b8b8'/%3E%3Ctext x='770' y='418' font-size='30' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3E%F0%9F%93%A1%3C/text%3E%3Ctext x='770' y='458' font-size='16' fill='%231a1a1a' text-anchor='middle' font-weight='bold'%3EEPIRB / PLB%3C/text%3E%3Ctext x='770' y='480' font-size='13' fill='%23444' text-anchor='middle' font-weight='normal'%3ESatelliten-Notfunkbake%3C/text%3E%3Ctext x='470.0' y='540' font-size='16' fill='%230b2545' text-anchor='middle' font-weight='bold'%3EKroatien: Seenotleitstelle MRCC Rijeka %C2%B7 Tel. 195 (oder 112) %C2%B7 UKW Kanal 16%3C/text%3E%3C/svg%3E\" alt=\"Grafik\" loading=\"lazy\"><figcaption>Antippen zum Vergrößern<\/figcaption><\/figure>\n\n<p><strong>Wichtig für die Prüfung:<\/strong>\n- Rote Rakete oder Handfackel, oranger Rauch, SOS, MAYDAY, Arme heben und senken, Flaggen <strong>N über C<\/strong>, Dauerton\n- <strong>Nicht<\/strong> verwechseln: <strong>Flagge A<\/strong> (weiß-blau) heißt „Taucher unten – Abstand halten, langsam fahren“. Das ist <strong>kein<\/strong> Notsignal\n- <strong>Gelbe Flagge Q<\/strong> heißt „Gesund, ich bitte um freie Verkehrserlaubnis“ (Zoll und Einklarierung)\n- Pyrotechnik <strong>nur im echten Notfall<\/strong> zünden, und erst dann, wenn jemand in Sichtweite ist<\/p>\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage<\/div><p>Was bedeutet ein Schallsignal <strong>lang-kurz-kurz<\/strong> im Nebel?\n→ Ein Fahrzeug mit Vorrang (Segler, Fischer, NUC, RAM, CBD oder Schlepper) ist in der Nähe.<\/p><\/div>"}, {"n": "05", "t": "UKW-Funk", "h": "<h2>Kanäle, die du kennen musst<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Kanal<\/th>\n<th>Wofür<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>16<\/strong><\/td>\n<td><strong>Not-, Dringlichkeits- und Anrufkanal.<\/strong> Immer mithören. Nach dem Anruf auf einen Arbeitskanal wechseln<\/td>\n<\/tr>\n<tr>\n<td><strong>70<\/strong><\/td>\n<td><strong>Nur DSC<\/strong> (digitaler Selektivruf), <strong>kein Sprechfunk<\/strong><\/td>\n<\/tr>\n<tr>\n<td>06, 08, 72, 77<\/td>\n<td>Schiff-zu-Schiff<\/td>\n<\/tr>\n<tr>\n<td>Marinas<\/td>\n<td>meist Kanal 17, steht im Hafenhandbuch<\/td>\n<\/tr>\n<tr>\n<td>Küstenfunkstellen<\/td>\n<td>Rijeka Radio, Split Radio, Dubrovnik Radio, rund um die Uhr. Wetterberichte zu festen Zeiten<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Die 3 Dringlichkeitsstufen<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Wort<\/th>\n<th>Wann<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>MAYDAY<\/strong><\/td>\n<td><strong>Unmittelbare Lebensgefahr<\/strong> für Menschen oder Schiff<\/td>\n<td>Feuer, Sinken, Mann über Bord<\/td>\n<\/tr>\n<tr>\n<td><strong>PAN PAN<\/strong><\/td>\n<td>Dringend, aber <strong>keine unmittelbare Lebensgefahr<\/strong><\/td>\n<td>Motorausfall bei auflandigem Wind, verletzte Person<\/td>\n<\/tr>\n<tr>\n<td><strong>SÉCURITÉ<\/strong><\/td>\n<td>Sicherheitsmeldung<\/td>\n<td>Treibgut, Sturmwarnung, ausgefallenes Leuchtfeuer<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>MAYDAY-Meldung – auswendig lernen!<\/h2>\n<p><strong>Merkhilfe:<\/strong> <em>„MMM – WER – WO – WAS – WIE VIELE – OVER“<\/em>\nVorher, falls vorhanden: <strong>DSC-Notknopf<\/strong> (rot) 5 Sekunden drücken.<\/p>\n<pre><code>MAYDAY MAYDAY MAYDAY\nTHIS IS  &lt;Bootsname&gt; &lt;Bootsname&gt; &lt;Bootsname&gt;\n         &lt;Rufzeichen&gt;  MMSI &lt;Nummer&gt;\nMAYDAY  &lt;Bootsname&gt;  &lt;Rufzeichen&gt;\nMY POSITION IS  43°30' N  016°26' E   (oder: 2 sm südlich Hvar)\nI AM ON FIRE / SINKING / MAN OVERBOARD   (was ist passiert)\nI REQUIRE IMMEDIATE ASSISTANCE\n4 PERSONS ON BOARD\n(weitere Infos: Rettungsinsel klar, Rettungswesten an …)\nOVER\n<\/code><\/pre>\n<ul>\n<li><strong>MAYDAY RELAY<\/strong>: wenn du die Notmeldung eines <strong>anderen<\/strong> weitergibst, z. B. weil er außer Reichweite ist<\/li>\n<li><strong>SEELONCE MAYDAY<\/strong>: Funkstille, nur noch Notverkehr auf Kanal 16<\/li>\n<li><strong>SEELONCE FEENEE<\/strong>: Der Notverkehr ist beendet<\/li>\n<li><strong>OVER<\/strong> = „Ich warte auf Antwort“ · <strong>OUT<\/strong> = „Gespräch beendet“ (nie beides zusammen)<\/li>\n<\/ul>\n<h2>Buchstabieralphabet (international)<\/h2>\n<p>Alfa · Bravo · Charlie · Delta · Echo · Foxtrot · Golf · Hotel · India · Juliett · Kilo · Lima · Mike · November · Oscar · Papa · Quebec · Romeo · Sierra · Tango · Uniform · Victor · Whiskey · X-ray · Yankee · Zulu<\/p>\n<p>Übung: Buchstabiere deinen Namen. <strong>G<\/strong>olf <strong>E<\/strong>cho <strong>R<\/strong>omeo <strong>N<\/strong>ovember <strong>O<\/strong>scar <strong>T<\/strong>ango.<\/p>\n<h2>Kroatien<\/h2>\n<ul>\n<li>Seenotleitstelle <strong>MRCC Rijeka<\/strong>: Telefon <strong>195<\/strong> (oder 112), Funk Kanal 16<\/li>\n<li>In italienischen Gewässern: Küstenwache Tel. <strong>1530<\/strong><\/li>\n<li>Die UKW-Berechtigung im Skipper B gilt <strong>nur in kroatischen Gewässern<\/strong><\/li>\n<\/ul>\n<div class=\"co co-example\"><div class=\"co-t\">Prüfungsfrage (AC Nautik)<\/div><p>Ein Crewmitglied geht über Bord. Wie setzt du den Notruf ab?\n→ Kanal 16, „MAYDAY MAYDAY MAYDAY, this is …“, Bootsname, Position, „man overboard“, Hilfe anfordern, Personen an Bord, „over“.<\/p><\/div>"}, {"n": "06", "t": "Navigation & Seekarte", "h": "<div class=\"co co-tip\"><div class=\"co-t\">Der praktische Teil der Prüfung<\/div><p>Du bekommst eine Seekarte, Zirkel und Kursdreieck und sollst eine Position ablesen oder eintragen, eine Distanz messen oder einen Kurs bestimmen. <strong>Mindestens 3× an einer echten Karte üben<\/strong> (im Kurs oder mit einer Übungskarte).<\/p><\/div>\n\n<figure class=\"fig\"><img src=\"data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 980' width='1000' height='980' font-family='Segoe UI, Arial, sans-serif'%3E%3Crect width='1000' height='980' fill='%23ffffff'/%3E%3Ctext x='500.0' y='40' font-size='23' fill='%230b2545' text-anchor='middle' font-weight='bold'%3ESeekarte %26amp; Navigation %E2%80%93 die 4 Handgriffe, die immer kommen%3C/text%3E%3Crect x='60' y='90' width='500' height='430' fill='%23ffffff' stroke='%231a1a1a' stroke-width='2'/%3E%3Cpath d='M60,90 L230,90 C260,170 200,220 240,300 C280,360 180,420 80,520 L60,520 Z' fill='%23f5e6b8' stroke='%238a7a4a'/%3E%3Cpath d='M230
